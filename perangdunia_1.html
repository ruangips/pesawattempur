function resize() {
  const locked = updateOrientationOverlay();
  if (locked) return;
  const wrap = document.getElementById('gameWrap');
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const vw = rect.width, vh = rect.height;
  if (vw < 10 || vh < 10) { setTimeout(resize, 80); return; }
  const aspect = clamp(vw / vh, 1.4, 2.8);
  const newW = Math.round(BASE_H * aspect);
  if (Math.abs(newW - W) > 20) {
    W = newW; H = BASE_H;
    if (bgReady) initBackground();
  }
  const padding = 0.998;
  const s = Math.min(vw / W, vh / H) * padding;
  viewScale = s;
  uiScale = clamp(0.86 / s, 1, 1.75);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const maxW = 3600;
  if (W * s * dpr > maxW) dpr = Math.max(1, maxW / (W * s));
  cvs.style.width  = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
  cvs.width  = Math.max(2, Math.round(W * s * dpr));
  cvs.height = Math.max(2, Math.round(H * s * dpr));
  baseScale = cvs.width / W;
  applyLayout();
}

let actx = null;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, t='square', v=0.06, s=null, dl=0) {
  if (!actx) return;
  const t0 = actx.currentTime + dl;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = t; o.frequency.setValueAtTime(f, t0);
  if (s) o.frequency.exponentialRampToValueAtTime(Math.max(20, s), t0 + d);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(v, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}
function noiseBurst(d=0.3, v=0.12, c=900, q=1) {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * d);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const da = buf.getChannelData(0);
  for (let i = 0; i < len; i++) da[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.7);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = v;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = c; f.Q.value = q;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (r < 0) r = 0;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function wrapText(text, maxWidth, font) {
  const prev = ctx.font; ctx.font = font;
  const words = text.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  ctx.font = prev;
  return lines;
}

    balloon:     [70, 105, 145],
    biplane:     [45, 70, 100],
    smokeColumn: [90, 140, 200],
  };
  const layerAlphas = [0.30, 0.52, 0.78];
  const layerVs     = [10, 24, 48];

  const size = layerSizes[type][layer] * (0.85 + Math.random() * 0.30);

  /* Warna siluet: coklat/abu gelap dengan sedikit rona perang */
  const palettes = [
    [ 18, 12, 22],   // violet gelap (jauh)
    [ 22, 12, 10],   // cokelat gelap
    [ 14,  8,  6],   // cokelat tua
    [ 20, 14, 12],   // tanah
  ];
  const pal = palettes[Math.floor(Math.random() * palettes.length)];

  return {
    type, size, layer,
    x: Math.random() * W,
    y: atTop ? -size * 2 - Math.random() * H * 0.55 : Math.random() * H,
    v: layerVs[layer] * (0.7 + Math.random() * 0.6),
    alpha: layerAlphas[layer],
    flip: Math.random() < 0.5 ? 1 : -1,
    rot: 0, rotV: (Math.random() - 0.5) * 0.15,
    pal,
    phase: Math.random() * Math.PI * 2,
    variant: Math.floor(Math.random() * 3),
  };
}

function initBackground() {
  /* ═══ Bara api & abu (menggantikan bintang) ═══ */
  stars = [];
  for (let i = 0; i < 260; i++) {
    const layer = i < 160 ? 0 : i < 220 ? 1 : 2;
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: layer === 0 ? Math.random() * 0.9 + 0.35
        : layer === 1 ? Math.random() * 1.5 + 0.65
        : Math.random() * 2.3 + 1.1,
      v: layer === 0 ? 14 : layer === 1 ? 38 : 82,
      a: layer === 0 ? 0.28 : layer === 1 ? 0.52 : 0.82,
      layer,
      twinkle: Math.random() * Math.PI * 2,
      isEmber: Math.random() < 0.68,
      hue: 15 + Math.random() * 28,   // jingga–merah
      drift: (Math.random() - 0.5) * 22,
    });
  }

  /* ═══ Awan asap (menggantikan nebula) ═══ */
  nebulaClouds = [];
  for (let i = 0; i < 7; i++) {
    nebulaClouds.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 200 + Math.random() * 320,
      v: 5 + Math.random() * 12,
      hue: 18 + Math.random() * 20,     // coklat hangat
      a: 0.05 + Math.random() * 0.065,
      kind: Math.random() < 0.55 ? 'smoke' : 'haze',
    });
  }

  /* ═══ Siluet perang ═══ */
  spaceObjects = [];
  for (let i = 0; i < 22; i++) spaceObjects.push(makeWarObject(false));

  /* ═══ Kilatan artileri jauh ═══ */
  distantFlashes = [];
}

initBackground();
bgReady = true;

/* ───────────────────────────────────────────────────────────────
   Fungsi gambar siluet individu
   Setiap fungsi menggambar dalam ruang lokal, dengan `s` = ukuran.
   Siluet "duduk" di atas sumbu y = 0 (kaki/base di y=0).
   ─────────────────────────────────────────────────────────────── */

function silColor(pal, a) {
  return `rgba(${pal[0]}, ${pal[1]}, ${pal[2]}, ${a})`;
}

/* Tentara PD I (Brodie helmet + senapan) */
function drawSilSoldier(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  /* Helm Brodie (pinggir lebar + kubah) */
  ctx.beginPath();
  ctx.ellipse(0, -s * 1.36, s * 0.34, s * 0.09, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, -s * 1.34, s * 0.21, Math.PI, 0);
  ctx.fill();
  /* Kepala */
  ctx.fillRect(-s * 0.12, -s * 1.30, s * 0.24, s * 0.22);
  /* Badan (torso) */
  ctx.beginPath();
  ctx.moveTo(-s * 0.24, -s * 1.08);
  ctx.lineTo( s * 0.24, -s * 1.08);
  ctx.lineTo( s * 0.20, -s * 0.34);
  ctx.lineTo(-s * 0.20, -s * 0.34);
  ctx.closePath();
  ctx.fill();
  /* Lengan kiri (memegang senapan) */
  ctx.fillRect(-s * 0.30, -s * 1.02, s * 0.10, s * 0.50);
  /* Lengan kanan */
  ctx.fillRect( s * 0.22, -s * 1.02, s * 0.10, s * 0.42);
  /* Senapan Lee-Enfield diagonal */
  ctx.save();
  ctx.translate(s * 0.02, -s * 0.72);
  ctx.rotate(0.42);
  ctx.fillRect(-s * 0.035, -s * 0.58, s * 0.07, s * 1.05);
  ctx.fillRect(-s * 0.08,  s * 0.28, s * 0.16, s * 0.06); // popor
  ctx.restore();
  /* Kaki */
  ctx.fillRect(-s * 0.18, -s * 0.34, s * 0.14, s * 0.34);
  ctx.fillRect( s * 0.04, -s * 0.34, s * 0.14, s * 0.34);
  /* Sepatu bot */
  ctx.fillRect(-s * 0.22, -s * 0.05, s * 0.20, s * 0.05);
  ctx.fillRect( s * 0.02, -s * 0.05, s * 0.20, s * 0.05);
}

/* Regu tentara (3–5 orang berdiri berdekatan) */
function drawSilSquad(s, pal, a) {
  const count = 3 + Math.floor(Math.random() * 3);
  ctx.save();
  for (let i = 0; i < count; i++) {
    const ox = (i - (count - 1) / 2) * s * 0.55;
    const oy = (i % 2) * s * 0.05;
    ctx.save();
    ctx.translate(ox, oy);
    drawSilSoldier(s, pal, a);
    ctx.restore();
  }
  ctx.restore();
}

/* Artileri berat (barrel besar, roda, shield) */
function drawSilArtillery(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  /* Roda besar */
  ctx.beginPath();
  ctx.arc(s * 0.28, -s * 0.32, s * 0.34, 0, Math.PI * 2);
  ctx.fill();
  /* Lubang roda */
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.arc(s * 0.28, -s * 0.32, s * 0.14, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  /* Body / cradle */
  ctx.beginPath();
  ctx.moveTo(-s * 0.55, -s * 0.55);
  ctx.lineTo( s * 0.60, -s * 0.55);
  ctx.lineTo( s * 0.55, -s * 0.14);
  ctx.lineTo(-s * 0.55, -s * 0.14);
  ctx.closePath();
  ctx.fill();
  /* Shield pelindung meriam */
  ctx.beginPath();
  ctx.moveTo(-s * 0.52, -s * 0.90);
  ctx.lineTo(-s * 0.12, -s * 0.95);
  ctx.lineTo(-s * 0.12, -s * 0.30);
  ctx.lineTo(-s * 0.52, -s * 0.30);
  ctx.closePath();
  ctx.fill();
  /* Barrel meriam menembak ke atas */
  ctx.save();
  ctx.translate(-s * 0.10, -s * 0.65);
  ctx.rotate(-0.55);
  ctx.fillRect(-s * 0.09, -s * 0.75, s * 0.18, s * 1.10);
  ctx.fillRect(-s * 0.12, -s * 0.78, s * 0.24, s * 0.10); // muzzle
  ctx.restore();
  /* Kaki penopang */
  ctx.fillRect(-s * 0.58, -s * 0.14, s * 0.12, s * 0.14);
  ctx.fillRect( s * 0.42, -s * 0.14, s * 0.12, s * 0.14);
}

/* Reruntuhan bangunan Eropa */
function drawSilRuin(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  /* Dinding utama dengan atap rusak */
  ctx.beginPath();
  ctx.moveTo(-s * 0.75, 0);
  ctx.lineTo(-s * 0.75, -s * 0.65);
  ctx.lineTo(-s * 0.55, -s * 0.90);
  ctx.lineTo(-s * 0.20, -s * 0.90);
  ctx.lineTo(-s * 0.15, -s * 0.55);   // gap atap
  ctx.lineTo( s * 0.05, -s * 0.80);
  ctx.lineTo( s * 0.30, -s * 0.80);
  ctx.lineTo( s * 0.35, -s * 0.40);
  ctx.lineTo( s * 0.60, -s * 0.95);
  ctx.lineTo( s * 0.75, -s * 0.65);
  ctx.lineTo( s * 0.75, 0);
  ctx.closePath();
  ctx.fill();
  /* Cerobong / menara pecah */
  ctx.fillRect(s * 0.45, -s * 1.15, s * 0.14, s * 0.30);
  /* Jendela gelap (lubang) */
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillRect(-s * 0.55, -s * 0.60, s * 0.20, s * 0.28);
  ctx.fillRect(-s * 0.20, -s * 0.55, s * 0.16, s * 0.24);
  ctx.fillRect( s * 0.10, -s * 0.55, s * 0.18, s * 0.26);
  ctx.restore();
  /* Balok kayu miring (bagian runtuh) */
  ctx.save();
  ctx.translate(-s * 0.40, -s * 0.20);
  ctx.rotate(0.35);
  ctx.fillRect(-s * 0.04, -s * 0.55, s * 0.08, s * 0.55);
  ctx.restore();
}

/* Pohon gundul Eropa (dipangkas/dirusak perang) */
function drawSilTree(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  /* Batang utama */
  ctx.beginPath();
  ctx.moveTo(-s * 0.10, 0);
  ctx.lineTo(-s * 0.06, -s * 0.55);
  ctx.lineTo(-s * 0.09, -s * 1.10);
  ctx.lineTo( s * 0.09, -s * 1.10);
  ctx.lineTo( s * 0.06, -s * 0.55);
  ctx.lineTo( s * 0.10, 0);
  ctx.closePath();
  ctx.fill();
  /* Cabang-cabang */
  const branches = [
    [ -0.08, -0.85,  -0.55, -1.35 ],
    [  0.08, -0.90,   0.55, -1.40 ],
    [ -0.06, -0.70,  -0.42, -1.05 ],
    [  0.06, -0.65,   0.42, -1.00 ],
    [ -0.05, -1.05,  -0.25, -1.55 ],
    [  0.05, -1.05,   0.28, -1.60 ],
  ];
  ctx.lineCap = 'round';
  for (const [x1, y1, x2, y2] of branches) {
    ctx.lineWidth = s * 0.055;
    ctx.beginPath();
    ctx.moveTo(x1 * s, y1 * s);
    ctx.lineTo(x2 * s, y2 * s);
    ctx.strokeStyle = silColor(pal, a);
    ctx.stroke();
  }
  /* Ranting kecil di ujung cabang */
  ctx.lineWidth = s * 0.025;
  const twigs = [
    [-0.55,-1.35, -0.70,-1.55], [-0.55,-1.35, -0.42,-1.55],
    [ 0.55,-1.40,  0.72,-1.60], [ 0.55,-1.40,  0.40,-1.60],
    [-0.25,-1.55, -0.35,-1.75], [ 0.28,-1.60,  0.38,-1.80],
  ];
  for (const [x1, y1, x2, y2] of twigs) {
    ctx.beginPath();
    ctx.moveTo(x1 * s, y1 * s);
    ctx.lineTo(x2 * s, y2 * s);
    ctx.stroke();
  }
}

/* Tank Mark I (rhomboid ikonik PD I) */
function drawSilTank(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  /* Bodi rhomboid */
  ctx.beginPath();
  ctx.moveTo(-s * 0.75, -s * 0.10);
  ctx.lineTo(-s * 0.65, -s * 0.55);
  ctx.lineTo(-s * 0.30, -s * 0.75);
  ctx.lineTo( s * 0.35, -s * 0.75);
  ctx.lineTo( s * 0.70, -s * 0.50);
  ctx.lineTo( s * 0.75, -s * 0.10);
  ctx.lineTo( s * 0.70, -s * 0.15);
  ctx.lineTo(-s * 0.70, -s * 0.15);
  ctx.closePath();
  ctx.fill();
  /* Track outline (garis roda) */
  ctx.strokeStyle = silColor(pal, a);
  ctx.lineWidth = s * 0.09;
  ctx.beginPath();
  ctx.moveTo(-s * 0.72, -s * 0.12);
  ctx.lineTo(-s * 0.62, -s * 0.52);
  ctx.lineTo(-s * 0.28, -s * 0.70);
  ctx.lineTo( s * 0.32, -s * 0.70);
  ctx.lineTo( s * 0.66, -s * 0.48);
  ctx.lineTo( s * 0.72, -s * 0.12);
  ctx.stroke();
  /* Kabin kecil di atas */
  ctx.fillRect(-s * 0.10, -s * 0.88, s * 0.30, s * 0.15);
  /* Meriam kecil di depan kabin */
  ctx.fillRect(s * 0.20, -s * 0.82, s * 0.28, s * 0.05);
}

/* Balon barrage (pengawas udara) */
function drawSilBalloon(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  /* Balon utama (elips panjang) */
  ctx.beginPath();
  ctx.ellipse(0, -s * 1.10, s * 0.55, s * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();
  /* Hidung tumpul */
  ctx.beginPath();
  ctx.ellipse(-s * 0.50, -s * 1.10, s * 0.10, s * 0.24, 0, 0, Math.PI * 2);
  ctx.fill();
  /* Sirip ekor */
  ctx.beginPath();
  ctx.moveTo(s * 0.50, -s * 1.10);
  ctx.lineTo(s * 0.75, -s * 1.30);
  ctx.lineTo(s * 0.75, -s * 1.00);
  ctx.closePath();
  ctx.fill();
  /* Gondola kecil di bawah */
  ctx.fillRect(-s * 0.10, -s * 0.80, s * 0.20, s * 0.08);
  /* Kabel tambatan */
  ctx.strokeStyle = silColor(pal, a * 0.7);
  ctx.lineWidth = Math.max(1, s * 0.015);
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.78);
  ctx.lineTo(0, 0);
  ctx.stroke();
}

/* Pesawat biplan PD I (dilihat dari samping) */
function drawSilBiplane(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  /* Sayap bawah */
  ctx.beginPath();
  ctx.moveTo(-s * 0.80, -s * 0.55);
  ctx.lineTo( s * 0.60, -s * 0.55);
  ctx.lineTo( s * 0.60, -s * 0.48);
  ctx.lineTo(-s * 0.80, -s * 0.48);
  ctx.closePath();
  ctx.fill();
  /* Sayap atas */
  ctx.beginPath();
  ctx.moveTo(-s * 0.75, -s * 0.88);
  ctx.lineTo( s * 0.55, -s * 0.88);
  ctx.lineTo( s * 0.55, -s * 0.80);
  ctx.lineTo(-s * 0.75, -s * 0.80);
  ctx.closePath();
  ctx.fill();
  /* Fuselage */
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.68, s * 0.55, s * 0.13, 0, 0, Math.PI * 2);
  ctx.fill();
  /* Ekor */
  ctx.beginPath();
  ctx.moveTo(s * 0.50, -s * 0.68);
  ctx.lineTo(s * 0.80, -s * 0.95);
  ctx.lineTo(s * 0.80, -s * 0.42);
  ctx.closePath();
  ctx.fill();
  /* Struts (penyangga antara dua sayap) */
  ctx.fillRect(-s * 0.35, -s * 0.88, s * 0.04, s * 0.40);
  ctx.fillRect( s * 0.20, -s * 0.88, s * 0.04, s * 0.40);
  /* Baling-baling */
  ctx.fillRect(-s * 0.60, -s * 0.75, s * 0.05, s * 0.14);
  /* Kokpit */
  ctx.beginPath();
  ctx.arc(-s * 0.05, -s * 0.80, s * 0.07, 0, Math.PI * 2);
  ctx.fill();
}

/* Kolom asap dari tanah */
function drawSilSmokeColumn(s, pal, a) {
  /* Beberapa gumpalan asap naik, makin tipis di atas */
  const puffs = 7;
  for (let i = 0; i < puffs; i++) {
    const t = i / (puffs - 1);
    const cy = -t * s * 1.4;
    const cx = Math.sin(t * 3.5 + pal[0]) * s * 0.12;
    const radius = s * (0.35 + t * 0.45);
    const alpha = a * (0.85 - t * 0.55);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    g.addColorStop(0, `rgba(${pal[0]}, ${pal[1]}, ${pal[2]}, ${alpha})`);
    g.addColorStop(0.6, `rgba(${pal[0] + 10}, ${pal[1] + 8}, ${pal[2] + 8}, ${alpha * 0.4})`);
    g.addColorStop(1, `rgba(${pal[0]}, ${pal[1]}, ${pal[2]}, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* Dispatcher */
function drawWarObject(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  if (o.flip < 0) ctx.scale(-1, 1);
  if (o.rot) ctx.rotate(o.rot);
  const a = o.alpha;
  const pal = o.pal;
  switch (o.type) {
    case 'soldier':     drawSilSoldier(o.size, pal, a); break;
    case 'squad':       drawSilSquad(o.size, pal, a); break;
    case 'artillery':   drawSilArtillery(o.size, pal, a); break;
    case 'ruin':        drawSilRuin(o.size, pal, a); break;
    case 'tree':        drawSilTree(o.size, pal, a); break;
    case 'tank':        drawSilTank(o.size, pal, a); break;
    case 'balloon':     drawSilBalloon(o.size, pal, a); break;
    case 'biplane':     drawSilBiplane(o.size, pal, a); break;
    case 'smokeColumn': drawSilSmokeColumn(o.size, pal, a); break;
  }
  ctx.restore();
}

function drawWarObjects() {
  /* Urut berdasarkan layer: jauh dulu, dekat terakhir */
  const sorted = spaceObjects.slice().sort((a, b) => a.layer - b.layer);
  for (const o of sorted) drawWarObject(o);
}

/* ─────────────────────────────────────────────────────────────── */

function drawBackground() {
  /* ═══ Langit senja Perang Dunia I ═══ */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#0a0510');
  g.addColorStop(0.35, '#1a0a12');
  g.addColorStop(0.62, '#2a1008');
  g.addColorStop(0.85, '#160705');
  g.addColorStop(1.00, '#050205');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* ═══ Pendar horizon (kebakaran jauh) ═══ */
  const horizonY = H * 0.72;
  const hg = ctx.createRadialGradient(W / 2, horizonY, 40, W / 2, horizonY, W * 0.85);
  hg.addColorStop(0, 'rgba(190, 70, 25, 0.20)');
  hg.addColorStop(0.45, 'rgba(120, 40, 15, 0.09)');
  hg.addColorStop(1, 'transparent');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, W, H);

  /* ═══ Awan asap atmosferik ═══ */
  ctx.save();
  for (const n of nebulaClouds) {
    const rg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    rg.addColorStop(0, `hsla(${n.hue}, 45%, 14%, ${n.a * 1.6})`);
    rg.addColorStop(0.55, `hsla(${n.hue - 6}, 35%, 9%, ${n.a * 0.7})`);
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  /* ═══ Siluet perang ═══ */
  drawWarObjects();

  /* ═══ Bara api & abu ═══ */
  for (const s of stars) {
    const tw = 0.85 + Math.sin(s.twinkle) * 0.15;
    ctx.globalAlpha = s.a * tw;
    if (s.isEmber) {
      /* Bara jingga dengan glow */
      const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.s * 3.5);
      glow.addColorStop(0, `hsla(${s.hue}, 95%, 68%, 0.95)`);
      glow.addColorStop(0.35, `hsla(${s.hue}, 92%, 52%, 0.45)`);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s * 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `hsl(${s.hue}, 95%, 75%)`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s * 0.95, 0, Math.PI * 2); ctx.fill();
    } else {
      /* Abu lembut */
      ctx.fillStyle = 'rgba(95, 82, 74, 0.65)';
      ctx.fillRect(s.x, s.y, s.s * 0.9, s.s * 1.2);
    }
  }
  ctx.globalAlpha = 1;

  /* ═══ Kilatan artileri jauh (opsional) ═══ */
  for (const f of distantFlashes) {
    const a = Math.max(0, f.life / f.maxLife);
    const rg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    rg.addColorStop(0, `rgba(255, 200, 120, ${a * 0.7})`);
    rg.addColorStop(0.4, `rgba(255, 140, 60, ${a * 0.35})`);
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }

  /* ═══ Garis horizon/parit (menggantikan grid sci-fi) ═══ */
  ctx.save();
  const tGrad = ctx.createLinearGradient(0, horizonY, 0, H);
  tGrad.addColorStop(0, 'rgba(80, 35, 20, 0)');
  tGrad.addColorStop(1, 'rgba(100, 45, 20, 0.14)');
  ctx.strokeStyle = tGrad;
  ctx.lineWidth = 1;
  for (let i = 0; i < 10; i++) {
    const y = horizonY + i * 30;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  /* Garis vertikal perspektif (mengarah ke titik hilang) */
  const vGrad = ctx.createLinearGradient(0, horizonY, 0, H);
  vGrad.addColorStop(0, 'rgba(120, 60, 30, 0)');
  vGrad.addColorStop(1, 'rgba(120, 60, 30, 0.10)');
  ctx.strokeStyle = vGrad;
  for (let i = -10; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(W / 2 + i * 40, horizonY);
    ctx.lineTo(W / 2 + i * 280, H);
    ctx.stroke();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   Lanjutan game (tidak diubah dari versi sebelumnya)
   ═══════════════════════════════════════════════════════════════ */

function explosion(x, y, color, count=30, power=280, sizeMul=1) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * power + 40;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.5 + Math.random()*0.9, max: 1.2, size: (Math.random()*3.5+1.2)*sizeMul, color, glow: Math.random() > 0.5 });
  }
  for (let i = 0; i < count*0.6; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * power * 1.6 + 80;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.3+Math.random()*0.5, max: 0.8, size: Math.random()*2+1, color: C.white, glow: true });
  }
}
function shockwave(x, y, color, maxR=90, life=0.5) { shockwaves.push({ x, y, r: 6, maxR, life, maxLife: life, color }); }
function debrisBurst(x, y, color, count=8) {
  for (let i = 0; i < count; i++) {
    debris.push({ x, y, vx: (Math.random()-0.5)*280, vy: (Math.random()-0.5)*280-60, rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*12, life: 1.5+Math.random()*1, max: 2.5, size: 4+Math.random()*8, color, points: Math.floor(Math.random()*3)+3 });
  }
}
function popup(x, y, text, color, size=22) { popups.push({ x, y, text, color, size, life: 1.2, maxLife: 1.2, vy: -70 }); }
function toast(text, color) { state.toastText = text; state.toastColor = color; state.toastTimer = 1.6; }
function spawnEngineTrail(x, y, color) { engineTrails.push({ x, y, vx: (Math.random()-0.5)*30, vy: 100 + Math.random()*80, life: 0.6, max: 0.6, size: 4 + Math.random()*4, color }); }
function spawnSmokePuff(x, y, sizeMul=1) {
  smokePuffs.push({
    x, y,
    vx: (Math.random()-0.5) * 40, vy: -20 - Math.random() * 40,
    size: (8 + Math.random() * 12) * sizeMul,
    life: 1.5 + Math.random() * 1.5, max: 3,
    rot: Math.random() * Math.PI * 2, rotV: (Math.random()-0.5) * 0.8,
    alpha: 0.5 + Math.random() * 0.3,
  });
}
function spawnHeatDistortion(x, y, r) { heatDistortions.push({ x, y, r, life: 0.4, max: 0.4 }); }

/* ═══ RESET / ROUND ═══ */
function resetGame() {
  state.score = 0; state.hp = state.maxHp; state.shield = state.maxShield;
  state.level = 1; state.correctCount = 0;
  state.streak = 0; state.bestStreak = 0;
  state.hitCorrect = 0; state.hitWrong = 0;
  state.gameTime = 0; state.comboMeter = 0;
  state.shake = 0; state.flashRed = 0; state.flashGreen = 0; state.flashBlue = 0;
  state.toastTimer = 0; state.bossMode = false;
  state.qPanelSlide = 0;
  state.wrongThisRound = 0;
  state.questionFailed = false;
  player.x = W / 2; player.y = 610; player.targetX = W / 2;
  player.vx = 0; player.bank = 0;
  player.weaponLevel = 1; player.overdrive = 0; player.invuln = 1.5;
  player.tier = 1; player.tierFlash = 0;
  player.autoT = 0;
  questionPool = shuffle([...QUESTIONS]);
  enemies = []; bullets = []; particles = [];
  shockwaves = []; debris = []; popups = []; engineTrails = [];
  qShipDebris = []; planeFragments = []; smokePuffs = []; heatDistortions = [];
  state.mode = 'playing';
  newRound();
}

function newRound() {
  if (questionPool.length === 0) questionPool = shuffle([...QUESTIONS]);
  const q = questionPool.pop();
  currentQuestion = q;
  const opts = q.o.map((text, i) => ({ text, correct: i === q.a }));
  shuffle(opts);
  state.bossMode = (state.level >= 5 && state.level % 5 === 0 && state.level < MAX_LEVEL);

  qShip.x = W / 2; qShip.y = qShip.entryY; qShip.baseY = 80;
  qShip.state = 'entering'; qShip.entryT = 0; qShip.hoverT = 0;
  qShip.reactorPulse = 0; qShip.ringAngle = 0; qShip.ringAngle2 = 0;
  qShip.thrusterPulse = 0; qShip.engineGlow = 0;
  qShip.explodeT = 0; qShip.explodeRingR = 0; qShip.explodeRingR2 = 0;
  qShip.chargeLevel = 0; qShip.alarmPulse = 0;
  qShip.leaveVx = 0; qShip.leaveVy = 0; qShip.rotZ = 0;
  qShip.smokeEmitters = [];
  state.qPanelSlide = 0;

  enemies = opts.map((o, i) => ({
    baseX: COL_X[i], baseY: SHIP_Y_START,
    x: COL_X[i], y: -280 - i * 70,
    text: o.text, correct: o.correct,
    alive: true, dying: 0, scale: 1, rot: 0,
    engine: Math.random() * Math.PI * 2,
    flash: 0, type: i,
    hp: state.bossMode ? (o.correct ? 2 : 1) : 1,
    launching: false, launchVy: 0, launchSpin: 0,
    fleeing: false, fleeVx: 0, fleeVy: 0, fleeRot: 0, fleeSpin: 0,
    panelScale: 0, panelFlash: 0,
    bank: 0, bankTarget: 0,
    pitch: 0, pitchTarget: 0, wingFlex: 0,
    smokeTimer: 0, afterburner: 0,
    targetX: COL_X[i], targetY: -280 - i * 70,
  }));

  state.timeMax = Math.max(11, 23 - (state.level - 1) * 1.25);
  state.timeLeft = state.timeMax;
  state.roundActive = true;
  state.locked = false;
  state.wrongThisRound = 0;
  state.questionFailed = false;
}

/* ═══ HANCURKAN PESAWAT MUSUH ═══ */
function destroyEnemyPlane(e) {
  const accentColors = [C.cyan, C.magenta, C.lime, C.amber];
  const accent = accentColors[e.type] || C.cyan;
  const fragColors = [
    '#c8d0d8', '#8c99a8', '#485566', '#1c2634',
    '#ff7060', '#a83028', '#501015', '#ffb040',
    '#e8e8e8', '#9098a4', accent, '#ff4422',
  ];
  explosion(e.x, e.y, '#ffdd77', 32, 130, 1.9);
  explosion(e.x, e.y, C.amber, 42, 230, 1.7);
  explosion(e.x, e.y, C.pink, 38, 270, 1.5);
  explosion(e.x, e.y, C.white, 30, 350, 1.1);
  explosion(e.x, e.y, accent, 24, 260, 1.4);
  shockwave(e.x, e.y, C.white, 340, 1.1);
  shockwave(e.x, e.y, C.amber, 240, 0.95);
  shockwave(e.x, e.y, accent, 480, 1.4);
  shockwave(e.x, e.y, C.pink, 620, 1.8);
  for (let i = 0; i < 46; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 70 + Math.random() * 300;
    planeFragments.push({
      x: e.x + (Math.random() - 0.5) * 70,
      y: e.y + (Math.random() - 0.5) * 140,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 100,
      rot: Math.random() * Math.PI * 2, rotV: (Math.random() - 0.5) * 26,
      size: 3 + Math.random() * 13,
      color: fragColors[Math.floor(Math.random() * fragColors.length)],
      points: 3 + Math.floor(Math.random() * 5),
      life: 1.9 + Math.random() * 1.8, max: 3.7,
      glow: Math.random() < 0.35, edge: Math.random() < 0.6,
      isPanel: Math.random() < 0.25,
      panelW: 6 + Math.random() * 14, panelH: 2 + Math.random() * 5,
      trail: [],
    });
  }
  for (let i = 0; i < 34; i++) {
    spawnEngineTrail(e.x + (Math.random() - 0.5) * 80, e.y + (Math.random() - 0.5) * 110,
      Math.random() < 0.33 ? C.amber : (Math.random() < 0.5 ? C.pink : '#ff8030'));
  }
  for (let i = 0; i < 20; i++) spawnSmokePuff(e.x + (Math.random() - 0.5) * 60, e.y + (Math.random() - 0.5) * 60, 0.8 + Math.random() * 0.9);
  debrisBurst(e.x, e.y, C.cyanDark, 16);
  debrisBurst(e.x, e.y, C.amber, 12);
  debrisBurst(e.x, e.y, C.pink, 10);
  debrisBurst(e.x, e.y, '#606870', 12);
  for (let i = 0; i < 3; i++) spawnHeatDistortion(e.x, e.y, 60 + i * 40);
  state.shake = Math.max(state.shake, 12);
  state.flashGreen = Math.max(state.flashGreen, 0.6);
  state.flashRed   = Math.max(state.flashRed, 0.35);
  noiseBurst(1.2, 0.26, 700);
  noiseBurst(0.6, 0.20, 1800);
  tone(120, 0.7, 'sawtooth', 0.15, 30);
  tone(240, 0.45, 'square', 0.09, 55);
  tone(90,  1.0, 'sine',    0.12, 22, 0.06);
}

function fire(idx) {
  if (state.mode !== 'playing' || state.locked || !state.roundActive) return;
  const e = enemies[idx];
  if (!e || !e.alive || e.dying > 0 || e.launching || e.fleeing) return;
  state.locked = true;
  const shots = player.weaponLevel;
  for (let s = 0; s < shots; s++) {
    const spread = (s - (shots-1)/2) * 22;
    bullets.push({ x: player.x + spread, y: player.y - 40, target: e, speed: 2000, trail: [], life: 0 });
  }
  for (let i = 0; i < 8; i++) {
    particles.push({ x: player.x, y: player.y - 30, vx: (Math.random()-0.5)*120, vy: -Math.random()*180, life: 0.15, max: 0.15, size: 3+Math.random()*3, color: C.cyan, glow: true });
  }
  spawnHeatDistortion(player.x, player.y - 40, 30);
  tone(1200, 0.06, 'sawtooth', 0.035, 400);
  tone(2200, 0.04, 'square', 0.022, 800);
}

function resolveHit(bullet, enemy) {
  if (enemy.correct) {
    if (enemy.hp > 1) {
      enemy.hp--; enemy.flash = 0.2;
      explosion(enemy.x, enemy.y, C.amber, 20, 240);
      spawnSmokePuff(enemy.x, enemy.y, 0.6);
      tone(600, 0.08, 'square', 0.05);
      state.locked = false;
      return;
    }
    state.hitCorrect++; state.correctCount++; state.streak++;
    state.comboMeter = Math.min(100, state.comboMeter + 22);
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const timeBonus = Math.floor(state.timeLeft * 8);
    const streakBonus = state.streak >= 2 ? state.streak * 75 : 0;
    const comboBonus = state.comboMeter >= 100 ? 500 : 0;
    const gained = 100 + timeBonus + streakBonus + comboBonus;
    state.score += gained;

    qShip.state = 'leaving';
    qShip.leaveVx = (Math.random() - 0.5) * 200;
    qShip.leaveVy = -50;
    qShip.engineGlow = 1;
    explosion(qShip.x, qShip.y, C.lime, 40, 360, 1.3);
    shockwave(qShip.x, qShip.y, C.lime, 260, 0.8);

    enemies.forEach(o => {
      if (o !== enemy && o.alive && o.dying <= 0 && !o.launching && !o.fleeing) {
        o.fleeing = true;
        const dirX = o.baseX < W / 2 ? -1 : 1;
        o.fleeVx = dirX * (80 + Math.random() * 100);
        o.fleeVy = -(140 + Math.random() * 120);
        o.fleeSpin = dirX * (0.55 + Math.random() * 0.7);
        o.fleeRot = 0; o.bankTarget = dirX * 0.9;
        o.panelScale = 0;
      }
    });

    enemy.panelFlash = 0.6;
    destroyEnemyPlane(enemy);
    enemy.alive = false;
    enemy.launching = false;
    enemy.dying = 0.001;

    tone(880, 0.08, 'square', 0.07);
    tone(1320, 0.14, 'sine', 0.055, 1980, 0.04);
    tone(1760, 0.22, 'sine', 0.045, 2640, 0.09);

    let msg = `✓ +${gained}`;
    if (streakBonus) msg += `  [COMBO ×${state.streak}]`;
    if (comboBonus) msg += `  ⚡ OVERDRIVE!`;
    toast(msg, C.lime);
    popup(enemy.x, enemy.y, `+${gained}`, C.lime, 26);

    const newTier = Math.min(5, Math.floor(state.correctCount / 3) + 1);
    if (newTier > player.tier) {
      player.tier = newTier;
      player.tierFlash = 1.2;
      toast(`⬆  PESAWAT UPGRADE — TIER ${newTier}!`, C.cyan);
      explosion(player.x, player.y, C.cyan, 45, 420, 1.5);
      shockwave(player.x, player.y, C.cyan, 220, 0.9);
      state.flashBlue = 0.8;
      tone(440, 0.12, 'triangle', 0.07);
      tone(660, 0.15, 'triangle', 0.07, null, 0.1);
      tone(880, 0.2, 'triangle', 0.07, null, 0.22);
    }
    if (state.comboMeter >= 100) {
      state.comboMeter = 0;
      player.overdrive = 6;
      player.weaponLevel = Math.min(3, player.weaponLevel + 1);
      state.flashBlue = 0.7;
      toast('⚡ OVERDRIVE AKTIF!', C.cyan);
      tone(440, 0.15, 'sine', 0.06);
      tone(660, 0.2, 'sine', 0.06, 880, 0.1);
    }
    state.roundActive = false;
    state.nextRoundIn = 1.35;

    if (state.correctCount >= MAX_LEVEL * QUESTIONS_PER_LEVEL) { triggerVictory(); return; }
    const newLevel = Math.floor(state.correctCount / QUESTIONS_PER_LEVEL) + 1;
    if (newLevel > state.level) {
      state.level = Math.min(MAX_LEVEL, newLevel);
      toast(`◆ LEVEL ${state.level} / ${MAX_LEVEL} ◆`, C.amber);
      tone(660, 0.12, 'triangle', 0.055);
      tone(990, 0.16, 'triangle', 0.055, null, 0.12);
    }
  } else {
    state.hitWrong++; state.streak = 0;
    state.comboMeter = Math.max(0, state.comboMeter - 30);
    state.wrongThisRound++;
    enemy.launching = true; enemy.launchVy = 400; enemy.panelFlash = 0.5;

    if (state.wrongThisRound >= MAX_WRONG_PER_ROUND && !state.questionFailed) { failQuestion(); return; }

    if (state.shield > 0) {
      state.shield = Math.max(0, state.shield - 55);
      if (state.shield === 0) { toast('⚠ PERISAI HANCUR!', C.amber); state.flashBlue = 0.8; }
      else toast('✗ SALAH — Perisai diserap!', C.amber);
      explosion(enemy.x, enemy.y, C.amber, 30, 300);
      shockwave(enemy.x, enemy.y, C.amber, 120, 0.5);
      spawnSmokePuff(enemy.x, enemy.y, 0.5);
      tone(180, 0.25, 'sawtooth', 0.07, 60);
      noiseBurst(0.35, 0.13);
      state.shake = Math.max(state.shake, 4);
      state.locked = false;
      const remaining = enemies.filter(o => o.alive && o.dying <= 0 && !o.launching && !o.fleeing);
      if (remaining.length <= 1) { state.roundActive = false; state.nextRoundIn = 1.15; }
    } else {
      state.hp--;
      explosion(enemy.x, enemy.y, C.pink, 34, 340);
      shockwave(enemy.x, enemy.y, C.pink, 140, 0.6);
      tone(160, 0.4, 'sawtooth', 0.09, 40);
      noiseBurst(0.5, 0.16);
      state.flashRed = 0.7; state.shake = Math.max(state.shake, 7);
      toast('✗ SALAH! -1 Energi', C.pink);
      state.locked = false;
      if (state.hp <= 0) { endGame(); return; }
      const remaining = enemies.filter(o => o.alive && o.dying <= 0 && !o.launching && !o.fleeing);
      if (remaining.length <= 1) { state.roundActive = false; state.nextRoundIn = 1.15; }
    }
  }
}

function failQuestion() {
  state.questionFailed = true;
  state.roundActive = false;
  state.locked = true;
  const correctEnemy = enemies.find(e => e.correct && e.alive && !e.launching && !e.fleeing);
  enemies.forEach(o => {
    if (o === correctEnemy) return;
    if (o.alive && o.dying <= 0 && !o.launching && !o.fleeing) {
      o.fleeing = true;
      const dirX = o.baseX < W / 2 ? -1 : 1;
      o.fleeVx = dirX * (200 + Math.random() * 220);
      o.fleeVy = -(280 + Math.random() * 200);
      o.fleeSpin = dirX * (1 + Math.random() * 1.2);
      o.panelScale = 0;
    }
  });
  if (correctEnemy) {
    correctEnemy.panelFlash = 1.5;
    correctEnemy.flash = 0.6;
    explosion(correctEnemy.x, correctEnemy.y, C.lime, 50, 420, 1.4);
    shockwave(correctEnemy.x, correctEnemy.y, C.lime, 320, 0.9);
    popup(correctEnemy.x, correctEnemy.y - 90, '✓ JAWABAN BENAR', C.lime, 28);
  }
  state.hp--;
  state.flashRed = 0.9;
  state.shake = 14;
  state.streak = 0;
  state.comboMeter = 0;
  noiseBurst(0.8, 0.24, 800);
  tone(120, 0.7, 'sawtooth', 0.12, 30);
  toast('❌ 2× SALAH — Jawaban benar ditandai HIJAU  |  -1 Energi', C.pink);
  if (state.hp <= 0) { setTimeout(() => endGame(), 1400); return; }
  state.nextRoundIn = 2.4;
}

function endGame() {
  state.mode = 'over'; state.roundActive = false; state.locked = true;
  state.shake = 10;
  explosion(player.x, player.y, C.amber, 80, 500, 1.5);
  explosion(player.x, player.y, C.white, 40, 600, 1);
  shockwave(player.x, player.y, C.amber, 240, 0.9);
  noiseBurst(1.2, 0.2);
  tone(220, 0.9, 'sawtooth', 0.1, 30);
}

function triggerVictory() {
  state.mode = 'victory';
  state.roundActive = false;
  state.locked = true;
  state.nextRoundIn = 0;
  enemies.forEach(e => {
    if (e.alive && !e.fleeing) {
      e.fleeing = true;
      e.fleeVx = (Math.random() - 0.5) * 700;
      e.fleeVy = -(400 + Math.random() * 300);
      e.fleeSpin = (Math.random() - 0.5) * 3;
    }
  });
  explosion(W/2, 300, C.lime, 80, 520, 1.7);
  explosion(W/2, 300, C.cyan, 60, 640, 1.5);
  shockwave(W/2, 300, C.lime, 420, 1.2);
  state.flashGreen = 1.0;
  state.shake = 12;
  tone(660, 0.15, 'triangle', 0.08);
  tone(880, 0.2, 'triangle', 0.08, null, 0.12);
  tone(1320, 0.3, 'sine', 0.07, null, 0.26);
}

function timeUp() {
  qShip.state = 'exploding';
  qShip.explodeT = 0; qShip.explodeRingR = 0; qShip.explodeRingR2 = 0;
  const qx = qShip.x, qy = qShip.y;
  explosion(qx, qy, C.pink, 60, 550, 1.7);
  explosion(qx, qy, C.white, 40, 700, 1.1);
  shockwave(qx, qy, C.white, 400, 1.2);
  shockwave(qx, qy, C.pink, 500, 1.5);
  debrisBurst(qx, qy, C.purpleDeep, 40);
  for (let i = 0; i < 30; i++) spawnSmokePuff(qx + (Math.random()-0.5)*200, qy + (Math.random()-0.5)*100, 1.2);
  state.shake = Math.max(state.shake, 14);
  state.flashRed = 1.0; state.flashBlue = 0.5;
  noiseBurst(1.5, 0.32, 700);
  tone(180, 1.0, 'sawtooth', 0.15, 30);
  tone(90, 1.4, 'sine', 0.13, 25, 0.08);
  enemies.forEach((o, i) => {
    if (o.alive && o.dying <= 0 && !o.launching && !o.fleeing) {
      o.launching = true;
      o.launchVy = 500 + Math.random()*400 + i * 30;
      o.panelFlash = 0.6;
      explosion(o.x, o.y, C.pink, 24, 280);
    }
  });
  if (state.shield > 0) {
    state.shield = 0; state.flashBlue = 0.9;
    toast('💥 SKUADRON F16 MENEROBOS! Perisai jatuh!', C.amber);
  } else {
    state.hp--;
    toast('💥 SKUADRON F16 MENEROBOS! -1 Energi', C.pink);
  }
  state.streak = 0;
  state.comboMeter = Math.max(0, state.comboMeter - 40);
  state.roundActive = false; state.locked = true;
  if (state.hp <= 0) setTimeout(() => endGame(), 900);
  else state.nextRoundIn = 2.2;
}

/* ═══ UPDATE ═══ */
function update(dt) {
  state.gameTime += dt;
  const starMult = state.mode === 'playing' ? 1 : 0.45;

  /* Bara & abu */
  for (const s of stars) {
    s.y += s.v * dt * starMult;
    s.x += s.drift * dt * starMult;
    s.twinkle += dt * 3;
    if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    if (s.x < -8) s.x = W + 8;
    if (s.x > W + 8) s.x = -8;
  }
  /* Awan asap */
  for (const n of nebulaClouds) {
    n.y += n.v * dt * 0.35;
    n.hue = (n.hue + dt * 3) % 360;
    if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random() * W; }
  }
  /* Siluet perang */
  for (let i = 0; i < spaceObjects.length; i++) {
    const o = spaceObjects[i];
    o.y += o.v * dt * starMult;
    o.rot += o.rotV * dt;
    if (o.y - o.size * 2 > H + 80) spaceObjects[i] = makeWarObject(true);
  }
  /* Kilatan artileri jauh sesekali */
  if (state.mode === 'playing' && Math.random() < dt * 0.35) {
    distantFlashes.push({
      x: Math.random() * W,
      y: horizonYAt() + (Math.random() - 0.5) * 30,
      r: 80 + Math.random() * 120,
      life: 0.35, maxLife: 0.35,
    });
  }
  for (let i = distantFlashes.length - 1; i >= 0; i--) {
    distantFlashes[i].life -= dt;
    if (distantFlashes[i].life <= 0) distantFlashes.splice(i, 1);
  }

  /* Auto-move pesawat pemain */
  player.autoT += dt;
  const patrolRange = W * 0.40;
  const patrolSpeed = 0.35;
  player.targetX = W / 2 + Math.sin(player.autoT * patrolSpeed) * patrolRange;

  const dx = player.targetX - player.x;
  player.vx = lerp(player.vx, dx * 8, Math.min(1, dt * 8));
  player.x = lerp(player.x, player.targetX, Math.min(1, dt * 8));
  const targetBank = clamp(-player.vx * 0.001, -0.4, 0.4);
  player.bank = lerp(player.bank, targetBank, Math.min(1, dt * 8));

  player.enginePulse += dt * 28;
  player.shieldPhase += dt * 2.4;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.tierFlash > 0) player.tierFlash -= dt;
  if (player.overdrive > 0) {
    player.overdrive -= dt;
    if (player.overdrive <= 0) player.weaponLevel = 1;
  }
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 70);
  if (state.flashRed > 0) state.flashRed = Math.max(0, state.flashRed - dt * 1.5);
  if (state.flashGreen > 0) state.flashGreen = Math.max(0, state.flashGreen - dt * 1.8);
  if (state.flashBlue > 0) state.flashBlue = Math.max(0, state.flashBlue - dt * 1.5);
  if (state.toastTimer > 0) state.toastTimer -= dt;
  state.qPanelSlide = Math.min(1, state.qPanelSlide + dt * 3);

  updateQShip(dt);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.955; p.vy *= 0.955; p.vy += 55 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt;
    sw.r = lerp(6, sw.maxR, 1 - sw.life / sw.maxLife);
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vy += 280 * dt; d.rot += d.rotV * dt;
    d.life -= dt;
    if (d.life <= 0 || d.y > H + 50) debris.splice(i, 1);
  }
  for (let i = qShipDebris.length - 1; i >= 0; i--) {
    const d = qShipDebris[i];
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vx *= 0.97; d.vy *= 0.97; d.vy += 40 * dt;
    d.rot += d.rotV * dt; d.life -= dt;
    if (d.life <= 0) qShipDebris.splice(i, 1);
  }
  for (let i = planeFragments.length - 1; i >= 0; i--) {
    const f = planeFragments[i];
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.vx *= 0.985; f.vy *= 0.985; f.vy += 220 * dt;
    f.rot += f.rotV * dt; f.life -= dt;
    if (f.life <= 0 || f.y > H + 90) planeFragments.splice(i, 1);
  }
  for (let i = smokePuffs.length - 1; i >= 0; i--) {
    const s = smokePuffs[i];
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vy -= 8 * dt; s.vx *= 0.98;
    s.size += 18 * dt; s.rot += s.rotV * dt; s.life -= dt;
    s.alpha = Math.max(0, (s.life / s.max) * 0.55);
    if (s.life <= 0) smokePuffs.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y += p.vy * dt; p.vy *= 0.95; p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
  for (let i = engineTrails.length - 1; i >= 0; i--) {
    const t = engineTrails[i];
    t.x += t.vx * dt; t.y += t.vy * dt; t.life -= dt;
    if (t.life <= 0) engineTrails.splice(i, 1);
  }
  for (let i = heatDistortions.length - 1; i >= 0; i--) {
    const hd = heatDistortions[i];
    hd.life -= dt; hd.r += 40 * dt;
    if (hd.life <= 0) heatDistortions.splice(i, 1);
  }

  if (state.mode !== 'playing') return;

  if (state.shield < state.maxShield && state.roundActive && !state.locked) {
    state.shield = Math.min(state.maxShield, state.shield + dt * 8);
  }

  if (state.roundActive && !state.locked && qShip.state === 'hovering') {
    state.timeLeft -= dt;
    qShip.chargeLevel = 1 - state.timeLeft / state.timeMax;
    const progress = 1 - state.timeLeft / state.timeMax;
    const descentY = SHIP_Y_START + progress * SHIP_TOTAL_DESCENT;
    for (const e of enemies) {
      if (e.alive && e.dying <= 0 && !e.launching && !e.fleeing) e.baseY = descentY;
    }
    if (state.timeLeft <= 0) { state.timeLeft = 0; timeUp(); }
  }

  for (const e of enemies) {
    e.engine += dt * 8;
    if (e.panelFlash > 0) e.panelFlash -= dt;
    if (!e.fleeing && !e.launching && e.dying <= 0 && e.alive) e.bankTarget = 0;
    e.bank = lerp(e.bank, e.bankTarget, Math.min(1, dt * 4));

    if (e.fleeing) {
      e.fleeVy -= 180 * dt;
      e.fleeVx *= 1.006;
      e.x += e.fleeVx * dt; e.y += e.fleeVy * dt;
      e.fleeRot += e.fleeSpin * dt;
      e.rot = e.fleeRot;
      e.bankTarget = e.fleeVx > 0 ? 0.9 : -0.9;
      if (Math.random() < 0.7) spawnEngineTrail(e.x + (Math.random()-0.5)*18, e.y + 20, C.cyan);
      if (Math.random() < 0.35) spawnSmokePuff(e.x, e.y + 10, 0.4);
      if (e.y < -300 || e.x < -320 || e.x > W + 320) e.alive = false;
      continue;
    }
    if (e.launching) {
      e.launchVy += 1400 * dt;
      e.y += e.launchVy * dt;
      e.launchSpin += dt * 5;
      e.rot = e.launchSpin * (e.correct ? -1 : 1);
      e.bankTarget = e.launchSpin * 0.3;
      if (Math.random() < 0.75) spawnEngineTrail(e.x + (Math.random()-0.5)*30, e.y - 30, e.correct ? C.lime : C.pink);
      if (Math.random() < 0.5) spawnSmokePuff(e.x, e.y, 0.5);
      if ((e.y > H + 60 || e.y < -200) && e.alive) {
        e.alive = false; e.dying = 0.3;
        const ey = clamp(e.y, 30, H - 30);
        explosion(e.x, ey, e.correct ? C.lime : C.pink, 30, 280);
        shockwave(e.x, ey, e.correct ? C.lime : C.pink, 100, 0.4);
      }
      continue;
    }
    if (e.dying > 0) {
      e.dying -= dt;
      e.scale = Math.max(0, e.dying / 0.7);
      e.rot += dt * 5;
      continue;
    }
    if (!e.alive) continue;

    if (e.y < e.baseY - 0.5) e.y = Math.min(e.baseY, e.y + 700 * dt);
    else if (e.y > e.baseY + 0.5) e.y = Math.max(e.baseY, e.y - 700 * dt);
    else { e.y = e.baseY; e.x = e.baseX; e.rot = 0; }

    e.panelScale = Math.min(1, e.panelScale + dt * 4);
    if (e.flash > 0) e.flash -= dt;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const target = b.target;
    if (!target || (!target.alive && target.dying <= 0 && !target.launching && !target.fleeing)) { bullets.splice(i, 1); continue; }
    const tx = target.x, ty = target.y;
    const dx2 = tx - b.x, dy2 = ty - b.y;
    const d = Math.hypot(dx2, dy2) || 1;
    const step = b.speed * dt;
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 16) b.trail.shift();
    b.life += dt;
    if (d <= step) { b.x = tx; b.y = ty; bullets.splice(i, 1); resolveHit(b, target); }
    else { b.x += (dx2 / d) * step; b.y += (dy2 / d) * step; }
  }

  if (state.nextRoundIn > 0) {
    state.nextRoundIn -= dt;
    if (state.nextRoundIn <= 0) {
      if (state.hp > 0 && state.mode === 'playing') newRound();
    }
  }
}

function horizonYAt() { return H * 0.72; }

function updateQShip(dt) {
  qShip.reactorPulse += dt * 4;
  qShip.ringAngle += dt * 0.5;
  qShip.ringAngle2 -= dt * 0.9;
  qShip.thrusterPulse += dt * 20;
  if (qShip.state === 'entering') {
    qShip.entryT += dt;
    const t = Math.min(1, qShip.entryT / 1.3);
    const ease = 1 - Math.pow(1 - t, 3);
    qShip.y = lerp(qShip.entryY, qShip.baseY, ease);
    if (t >= 1) { qShip.state = 'hovering'; qShip.hoverT = 0; }
  } else if (qShip.state === 'hovering') {
    qShip.hoverT += dt;
    qShip.y = qShip.baseY;
    const ratio = state.timeLeft / state.timeMax;
    if (ratio < 0.4) {
      const urgency = 1 - ratio / 0.4;
      qShip.alarmPulse = 0.5 + Math.sin(state.gameTime * (8 + urgency * 14)) * 0.5;
    } else qShip.alarmPulse = 0;
    if (Math.random() < 0.9) {
      for (let i = 0; i < 2; i++) spawnEngineTrail(qShip.x + (Math.random()-0.5)*520, qShip.y + 95, qShip.chargeLevel > 0.7 ? C.amber : C.cyan);
    }
  } else if (qShip.state === 'leaving') {
    qShip.leaveVx *= 1.03;
    qShip.x += qShip.leaveVx * dt;
    qShip.y += qShip.leaveVy * dt;
    qShip.leaveVy -= 30 * dt;
    qShip.rotZ = lerp(qShip.rotZ, qShip.leaveVx * 0.0004, dt * 3);
    qShip.engineGlow = Math.max(0, qShip.engineGlow - dt * 0.8);
  } else if (qShip.state === 'exploding') {
    qShip.explodeT += dt;
    qShip.explodeRingR = lerp(0, 600, Math.min(1, qShip.explodeT / 1.5));
    qShip.explodeRingR2 = lerp(0, 800, Math.min(1, qShip.explodeT / 2.0));
    if (qShip.explodeT < 1.4 && Math.random() < 0.7) {
      explosion(qShip.x + (Math.random()-0.5)*700, qShip.y + (Math.random()-0.5)*160, Math.random() > 0.5 ? C.amber : C.pink, 16, 380, 1.3);
    }
  }
}

/* ═══ RENDER EFEK (tidak diubah) ═══ */
function drawEngineTrails() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const t of engineTrails) {
    const a = Math.max(0, t.life / t.max);
    ctx.globalAlpha = a * 0.7;
    const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.size * a * 2);
    g.addColorStop(0, C.white);
    g.addColorStop(0.4, t.color);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.size * a * 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawSmokePuffs() {
  ctx.save();
  for (const s of smokePuffs) {
    ctx.globalAlpha = s.alpha;
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s.size);
    g.addColorStop(0, 'rgba(50,50,55,0.9)');
    g.addColorStop(0.5, 'rgba(35,35,40,0.6)');
    g.addColorStop(1, 'rgba(20,20,25,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, s.size, 0, Math.PI*2); ctx.fill();
    ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
  }
  ctx.restore();
}

function drawHeatDistortions() {
  ctx.save();
  for (const h of heatDistortions) {
    const a = h.life / h.max;
    ctx.globalAlpha = a * 0.25;
    const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
    g.addColorStop(0, 'rgba(255,220,180,0.5)');
    g.addColorStop(0.7, 'rgba(255,150,80,0.15)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ═══ PESAWAT INDUK MUSUH (Q-Ship) ═══ */
function drawQShip() {
  if (qShip.state === 'idle') return;
  if (qShip.state === 'exploding' && qShip.explodeT > 3.5) return;
  const cx = qShip.x, cy = qShip.y;
  if (qShip.state === 'exploding') {
    const t1 = Math.min(1, qShip.explodeT / 1.5);
    const t2 = Math.min(1, qShip.explodeT / 2.0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (1 - t1) * 0.9;
    ctx.strokeStyle = C.white; ctx.lineWidth = 10 * (1 - t1) + 1;
    ctx.shadowColor = C.white; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(cx, cy, qShip.explodeRingR, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = (1 - t2) * 0.7;
    ctx.strokeStyle = C.pink; ctx.lineWidth = 18 * (1 - t2) + 2;
    ctx.beginPath(); ctx.arc(cx, cy, qShip.explodeRingR2, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    const coreT = Math.min(1, qShip.explodeT / 1.1);
    const coreR = lerp(0, 380, 1 - Math.pow(1 - coreT, 2.2));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1 - coreT;
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    cg.addColorStop(0, C.white); cg.addColorStop(0.2, '#ffd0ee');
    cg.addColorStop(0.45, C.amber); cg.addColorStop(0.7, C.magenta);
    cg.addColorStop(0.9, C.pink); cg.addColorStop(1, 'transparent');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(qShip.rotZ || 0);
  const charge = qShip.chargeLevel;
  const alarm = qShip.alarmPulse;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const ambientAlpha = 0.14 + charge * 0.32 + alarm * 0.16;
  const ambientColor = charge > 0.6 ? hex2rgba(C.pink, ambientAlpha) : hex2rgba(C.purple, ambientAlpha * 0.9);
  const ambient = ctx.createRadialGradient(0, 0, 0, 0, 0, 520);
  ambient.addColorStop(0, ambientColor);
  ambient.addColorStop(0.6, hex2rgba(C.magenta, ambientAlpha * 0.3));
  ambient.addColorStop(1, 'transparent');
  ctx.fillStyle = ambient;
  ctx.beginPath(); ctx.arc(0, 0, 520, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.rotate(qShip.ringAngle);
  ctx.strokeStyle = hex2rgba(C.cyan, 0.3 + charge * 0.4);
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const a0 = (i/8)*Math.PI*2, a1 = a0 + Math.PI/12;
    ctx.beginPath(); ctx.arc(0, 0, 480, a0, a1); ctx.stroke();
  }
  ctx.restore();
  ctx.save();
  ctx.rotate(qShip.ringAngle2);
  ctx.strokeStyle = charge > 0.6 ? hex2rgba(C.pink, 0.5) : hex2rgba(C.magenta, 0.4);
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) {
    const a0 = (i/6)*Math.PI*2, a1 = a0 + Math.PI/10;
    ctx.beginPath(); ctx.arc(0, 0, 560, a0, a1); ctx.stroke();
  }
  ctx.restore();
  drawWingPanels(charge, alarm);
  drawMainHull(charge, alarm);
  drawBridgeTower(charge, alarm);
  drawTurrets(charge, alarm);
  drawRunningLights(charge);
  drawGreebles(charge);
  ctx.restore();
}

function drawMainHull(charge, alarm) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-340, -30); ctx.lineTo(-400, 0); ctx.lineTo(-380, 55);
  ctx.lineTo(-260, 80); ctx.lineTo(-140, 90); ctx.lineTo(0, 100);
  ctx.lineTo(140, 90); ctx.lineTo(260, 80); ctx.lineTo(380, 55);
  ctx.lineTo(400, 0); ctx.lineTo(340, -30); ctx.lineTo(200, -50);
  ctx.lineTo(-200, -50); ctx.closePath();
  const hullG = ctx.createLinearGradient(0, -50, 0, 100);
  if (charge > 0.6) {
    hullG.addColorStop(0, '#2a0820'); hullG.addColorStop(0.3, '#5a1030');
    hullG.addColorStop(0.55, '#8a1850'); hullG.addColorStop(0.8, '#5a1030');
    hullG.addColorStop(1, '#2a0820');
  } else {
    hullG.addColorStop(0, '#0d0830'); hullG.addColorStop(0.25, '#1f1450');
    hullG.addColorStop(0.5, '#322070'); hullG.addColorStop(0.75, '#1f1450');
    hullG.addColorStop(1, '#0a0425');
  }
  ctx.fillStyle = hullG; ctx.fill();
  ctx.strokeStyle = charge > 0.6 ? '#ff2090' : '#00e0ff';
  ctx.lineWidth = 2.4; ctx.stroke();
  ctx.strokeStyle = charge > 0.6 ? hex2rgba(C.pink, 0.7) : hex2rgba(C.cyan, 0.6);
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-200, -49); ctx.lineTo(200, -49); ctx.stroke();
  ctx.strokeStyle = charge > 0.6 ? 'rgba(255,80,140,0.55)' : 'rgba(0,220,255,0.5)';
  ctx.beginPath();
  ctx.moveTo(-360, -20); ctx.lineTo(360, -20);
  ctx.moveTo(-380, 10); ctx.lineTo(380, 10);
  ctx.moveTo(-370, 40); ctx.lineTo(370, 40);
  ctx.moveTo(-320, 68); ctx.lineTo(320, 68);
  ctx.stroke();
  ctx.strokeStyle = charge > 0.6 ? 'rgba(200,20,90,0.5)' : 'rgba(120,20,220,0.45)';
  for (let i = -7; i <= 7; i++) {
    const x = i * 46;
    ctx.beginPath(); ctx.moveTo(x, -50); ctx.lineTo(x * 1.05, 100); ctx.stroke();
  }
  ctx.fillStyle = charge > 0.6 ? 'rgba(255,80,140,0.9)' : 'rgba(200,20,255,0.8)';
  ctx.fillRect(-280, 78, 80, 4); ctx.fillRect(200, 78, 80, 4);
  ctx.beginPath();
  ctx.moveTo(0, 100); ctx.lineTo(-30, 88); ctx.lineTo(30, 88); ctx.closePath();
  ctx.fillStyle = charge > 0.6 ? C.amber : '#9ff8ff';
  ctx.fill();
  ctx.restore();
}

function drawWingPanels(charge, alarm) {
  ctx.save();
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 340, -30); ctx.lineTo(side * 460, -80);
    ctx.lineTo(side * 500, -50); ctx.lineTo(side * 420, 0);
    ctx.lineTo(side * 380, 55); ctx.closePath();
    const wingG = ctx.createLinearGradient(side * 500, -80, side * 380, 55);
    wingG.addColorStop(0, charge > 0.6 ? '#3a0820' : '#0d0425');
    wingG.addColorStop(0.5, charge > 0.6 ? '#6a1550' : '#201560');
    wingG.addColorStop(1, charge > 0.6 ? '#4a1030' : '#302060');
    ctx.fillStyle = wingG; ctx.fill();
    ctx.strokeStyle = charge > 0.6 ? '#ff2090' : '#00e0ff';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(side * 490, -55, 14, 22, side * 0.2, 0, Math.PI*2);
    const podG = ctx.createRadialGradient(side*490 - 4, -60, 0, side*490, -55, 24);
    podG.addColorStop(0, charge > 0.6 ? C.amber : '#7ff2ff');
    podG.addColorStop(0.5, charge > 0.6 ? '#5a1040' : '#201560');
    podG.addColorStop(1, charge > 0.6 ? '#2a0518' : '#080220');
    ctx.fillStyle = podG; ctx.fill();
    ctx.strokeStyle = charge > 0.6 ? '#ff2090' : '#9ff8ff';
    ctx.lineWidth = 1.6; ctx.stroke();
    const blink = 0.5 + Math.sin(state.gameTime * 3 + (side === 1 ? Math.PI : 0)) * 0.5;
    ctx.globalAlpha = blink;
    ctx.beginPath(); ctx.arc(side * 490, -55, 3.5, 0, Math.PI*2);
    ctx.fillStyle = side === -1 ? C.lime : C.pink;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawBridgeTower(charge, alarm) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-150, -50); ctx.lineTo(-120, -125); ctx.lineTo(-60, -145);
  ctx.lineTo(60, -145); ctx.lineTo(120, -125); ctx.lineTo(150, -50);
  ctx.closePath();
  const bridgeG = ctx.createLinearGradient(0, -145, 0, -50);

    bridgeG.addColorStop(0, '#3a0820'); bridgeG.addColorStop(0.4, '#6a1a50');

  ctx.fillStyle = bridgeG; ctx.fill();
  ctx.strokeStyle = charge > 0.6 ? '#ff2090' : '#00e0ff';
  ctx.lineWidth = 2.2; ctx.stroke();
  const windowGlow = charge > 0.6 ? '#ff80c0' : '#9ff8ff';
  ctx.fillStyle = windowGlow;
  for (let i = -7; i <= 7; i++) ctx.fillRect(i * 15 - 4, -130, 8, 12);

}

function drawTurrets(charge, alarm) {
  const turretPositions = [
    [-260, -35], [-180, -35], [-100, -35],

  ];

    ctx.moveTo(-4, -2); ctx.lineTo(-6, -14);

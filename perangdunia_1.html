    ctx.strokeRect(-5, 14, 10, 5);
    ctx.strokeRect(-4, -18, 8, 4);
    ctx.strokeRect(-3, -36, 6, 3);
  }

  ctx.beginPath();
  ctx.moveTo(-7, 46);
  ctx.quadraticCurveTo(-8.5, 40, -7.5, 32);
  ctx.quadraticCurveTo(-6.5, 22, -4, 16);
  ctx.lineTo(4, 16);
  ctx.quadraticCurveTo(6.5, 22, 7.5, 32);
  ctx.quadraticCurveTo(8.5, 40, 7, 46);
  ctx.closePath();
  ctx.fillStyle = isHit ? 'rgba(80,10,20,0.9)' : 'rgba(30,40,55,0.9)';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-6, 45);
  ctx.quadraticCurveTo(-7.2, 40, -6.2, 32);
  ctx.quadraticCurveTo(-5.2, 24, -3.5, 18);
  ctx.lineTo(3.5, 18);
  ctx.quadraticCurveTo(5.2, 24, 6.2, 32);
  ctx.quadraticCurveTo(7.2, 40, 6, 45);
  ctx.closePath();
  const cg2 = ctx.createRadialGradient(-3, 40, 0, 0, 32, 14);
  if (isHit) {
    cg2.addColorStop(0, 'rgba(255,240,240,1)');
    cg2.addColorStop(0.5, 'rgba(255,110,90,0.95)');
    cg2.addColorStop(1, 'rgba(80,5,20,0.95)');
  } else {
    cg2.addColorStop(0, 'rgba(230,250,255,0.98)');
    cg2.addColorStop(0.3, 'rgba(150,215,245,0.92)');
    cg2.addColorStop(0.6, 'rgba(75,135,195,0.88)');
    cg2.addColorStop(0.85, 'rgba(35,65,115,0.92)');
    cg2.addColorStop(1, 'rgba(12,22,48,0.95)');
  }
  ctx.fillStyle = cg2; ctx.fill();
  ctx.strokeStyle = isHit ? 'rgba(255,160,140,0.95)' : 'rgba(30,45,65,0.9)';
  ctx.lineWidth = 0.7; ctx.stroke();

  if (!isHit) {
    ctx.beginPath();
    ctx.ellipse(0, 40, 3, 4.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(20,30,45,0.7)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 38, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(75,95,125,0.85)';
    ctx.fill();
  }

  ctx.strokeStyle = isHit ? 'rgba(255,190,170,0.9)' : 'rgba(40,55,75,0.85)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(-6.5, 40); ctx.lineTo(6.5, 40);
  ctx.moveTo(-5.5, 26); ctx.lineTo(5.5, 26);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-4, 44); ctx.quadraticCurveTo(-3, 34, 0, 20);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(-1.5, 43); ctx.quadraticCurveTo(-0.5, 34, 1.5, 21);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(0, 54, 8, 5.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#08080f'; ctx.fill();
  ctx.strokeStyle = isHit ? 'rgba(255,150,130,0.9)' : 'rgba(20,30,45,0.95)';
  ctx.lineWidth = 1.3; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, 54, 6.5, 4.2, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(85,100,120,0.8)';
  ctx.lineWidth = 0.6; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, 54, 4, 2.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-6, 54); ctx.lineTo(6, 54);
  ctx.strokeStyle = 'rgba(55,65,85,0.7)';
  ctx.lineWidth = 0.5; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, 72);
  ctx.bezierCurveTo(-2.5, 68, -4.5, 60, -5.5, 52);
  ctx.lineTo(5.5, 52);
  ctx.bezierCurveTo(4.5, 60, 2.5, 68, 0, 72);
  ctx.closePath();
  const noseG = ctx.createLinearGradient(-5, 52, 5, 72);
  if (isHit) {
    noseG.addColorStop(0, '#501015');
    noseG.addColorStop(0.5, '#ff7060');
    noseG.addColorStop(1, '#501015');
  } else {
    noseG.addColorStop(0, hullDeep);
    noseG.addColorStop(0.4, hullDark);
    noseG.addColorStop(0.7, hullMid);
    noseG.addColorStop(1, hullDark);
  }
  ctx.fillStyle = noseG; ctx.fill();
  ctx.strokeStyle = isHit ? 'rgba(255,170,150,0.9)' : 'rgba(30,40,55,0.85)';
  ctx.lineWidth = 0.7; ctx.stroke();

  ctx.strokeStyle = isHit ? 'rgba(255,190,170,0.55)' : 'rgba(85,95,115,0.65)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(-5.5, 52); ctx.lineTo(5.5, 52);
  ctx.stroke();

  ctx.strokeStyle = isHit ? 'rgba(255,190,170,0.9)' : 'rgba(110,120,140,0.95)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, 72); ctx.lineTo(0, 82); ctx.stroke();
  ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-1.5, 78); ctx.lineTo(1.5, 78); ctx.stroke();

  const navBlink = 0.6 + Math.sin(e.engine * 1.5) * 0.4;
  ctx.globalAlpha = sc * navBlink;
  ctx.beginPath(); ctx.arc(-84, -24, 1.8, 0, Math.PI * 2);
  ctx.fillStyle = C.pink;
  ctx.shadowColor = C.pink; ctx.shadowBlur = 10; ctx.fill();
  ctx.beginPath(); ctx.arc(84, -24, 1.8, 0, Math.PI * 2);
  ctx.fillStyle = C.lime;
  ctx.shadowColor = C.lime; ctx.shadowBlur = 10; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -62, 1.4, 0, Math.PI * 2);
  ctx.fillStyle = C.white;
  ctx.shadowColor = C.white; ctx.shadowBlur = 8; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = sc;

  if (state.bossMode && e.hp > 1 && e.alive) {
    const hpW = 44;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-hpW / 2 - 1, -83, hpW + 2, 5);
    ctx.fillStyle = hex2rgba(C.amber, 0.95);
    ctx.shadowColor = C.amber; ctx.shadowBlur = 8;
    ctx.fillRect(-hpW / 2, -82, hpW * (e.hp / 2), 3);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = hex2rgba(C.amber, 0.7);
    ctx.lineWidth = 0.8;
    ctx.strokeRect(-hpW / 2 - 1, -83, hpW + 2, 5);
  }

  ctx.restore();

  /* ── Nomor jawaban digambar di luar skala pesawat supaya tetap besar ── */
  const idx = enemies.indexOf(e);
  if (idx >= 0) {
    const br = 13 * Math.min(uiScale, 1.6);
    const bfx = e.x - 46 * totalScale;
    const bfy = e.y - 24 * totalScale;
    ctx.save();
    ctx.globalAlpha = sc;
    ctx.beginPath(); ctx.arc(bfx, bfy, br, 0, Math.PI*2);
    const bg2 = ctx.createRadialGradient(bfx - br*0.35, bfy - br*0.35, 0, bfx, bfy, br);
    bg2.addColorStop(0, 'rgba(34,52,80,0.96)');
    bg2.addColorStop(1, 'rgba(8,12,24,0.98)');
    ctx.fillStyle = bg2; ctx.fill();
    ctx.strokeStyle = state.bossMode ? C.amber : accent;
    ctx.lineWidth = 2.2; ctx.stroke();
    ctx.fillStyle = C.white;
    ctx.font = `bold ${Math.round(14 * Math.min(uiScale, 1.6))}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(idx + 1), bfx, bfy + 1);
    ctx.restore();
  }
}

function drawEnemyPanel(e) {
  if (e.fleeing) return;
  if (!e.alive && e.dying <= 0 && !e.launching) return;
  if (e.panelScale <= 0.01) return;

  const panelSc = e.panelScale;
  const cx = e.x;
  const cy = e.y + PANEL_BELOW_GAP;
  const w = PANEL_W * panelSc;
  const h = PANEL_H * panelSc;
  const x = cx - w / 2;
  const y = cy - h / 2;

  const isHit = e.flash > 0;
  const accentColors = [C.cyan, C.magenta, C.lime, C.amber];
  const accent = accentColors[e.type] || C.cyan;
  const panelColor = isHit ? C.pink : (state.bossMode ? C.amber : accent);
  const urgency = 1 - state.timeLeft / state.timeMax;
  const urgencyAlpha = Math.max(0, urgency - 0.5) * 2;

  ctx.save();
  ctx.strokeStyle = hex2rgba(accent, 0.5);
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(cx, e.y + 55 * panelSc);
  ctx.lineTo(cx, y);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.arc(cx, e.y + 55 * panelSc, 3, 0, Math.PI*2);
  ctx.fillStyle = accent;
  ctx.shadowColor = accent; ctx.shadowBlur = 12; ctx.fill();
  ctx.shadowBlur = 0;

  ctx.shadowColor = panelColor; ctx.shadowBlur = 22 + urgencyAlpha * 20;
  roundRect(ctx, x, y, w, h, 10);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  if (isHit) {
    g.addColorStop(0, 'rgba(60, 5, 30, 0.92)');
    g.addColorStop(1, 'rgba(25, 2, 15, 0.94)');
  } else if (urgencyAlpha > 0.3) {
    g.addColorStop(0, 'rgba(60, 15, 10, 0.9)');
    g.addColorStop(1, 'rgba(35, 8, 5, 0.92)');
  } else if (state.bossMode) {
    g.addColorStop(0, 'rgba(60, 35, 8, 0.9)');
    g.addColorStop(1, 'rgba(25, 14, 3, 0.92)');
  } else {
    g.addColorStop(0, 'rgba(15, 8, 40, 0.9)');
    g.addColorStop(0.5, 'rgba(8, 4, 25, 0.92)');
    g.addColorStop(1, 'rgba(4, 2, 15, 0.94)');
  }
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = urgencyAlpha > 0.3 ? C.pink : panelColor;
  ctx.lineWidth = 2; ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = isHit ? C.pink : accent;
  ctx.lineWidth = 2.6;
  const cLen = 12;
  ctx.beginPath();
  ctx.moveTo(x + 4, y + cLen); ctx.lineTo(x + 4, y + 4); ctx.lineTo(x + cLen, y + 4);
  ctx.moveTo(x + w - cLen, y + 4); ctx.lineTo(x + w - 4, y + 4); ctx.lineTo(x + w - 4, y + cLen);
  ctx.moveTo(x + 4, y + h - cLen); ctx.lineTo(x + 4, y + h - 4); ctx.lineTo(x + cLen, y + h - 4);
  ctx.moveTo(x + w - cLen, y + h - 4); ctx.lineTo(x + w - 4, y + h - 4); ctx.lineTo(x + w - 4, y + h - cLen);
  ctx.stroke();

  const fBadge = Math.round(10 * Math.min(uiScale, 1.5));
  ctx.font = `bold ${fBadge}px "Consolas", monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = accent;
  ctx.shadowColor = accent; ctx.shadowBlur = 8;
  ctx.fillText(`[${enemies.indexOf(e) + 1}]`, x + 12, y + 6);
  ctx.shadowBlur = 0;

  const fOpt = Math.round(15 * uiScale * panelSc);
  const font = `bold ${fOpt}px system-ui, sans-serif`;
  const lines = wrapText(e.text, w - 30, font);
  ctx.font = font;
  ctx.fillStyle = C.white;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = accent; ctx.shadowBlur = 8;
  const lh = Math.round(fOpt * 1.16);
  const startY = cy - ((lines.length - 1) * lh) / 2 + 3;
  lines.forEach((ln, i) => ctx.fillText(ln, cx, startY + i * lh));
  ctx.shadowBlur = 0;

  if (e.panelFlash > 0) {
    ctx.save();
    ctx.globalAlpha = e.panelFlash;
    ctx.strokeStyle = e.correct ? C.lime : C.pink;
    ctx.lineWidth = 4;
    ctx.shadowColor = e.correct ? C.lime : C.pink;
    ctx.shadowBlur = 26;
    roundRect(ctx, x - 6, y - 6, w + 12, h + 12, 12);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* ═══ PESAWAT PEMAIN ═══ */
function drawPlayer() {
  if (state.mode === 'over') return;
  const bob = Math.sin(state.gameTime * 2.4) * 2.5;
  const px = player.x, py = player.y + bob;
  const tilt = player.bank * 0.5;
  const tier = player.tier;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(tilt);

  if (player.overdrive > 0) {
    const a = 0.4 + Math.sin(state.gameTime * 20) * 0.2;
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 110);
    rg.addColorStop(0, hex2rgba(C.cyan, a * 0.6));
    rg.addColorStop(0.5, hex2rgba(C.purple, a * 0.35));
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI*2); ctx.fill();
  }

  if (player.tierFlash > 0) {
    const a = player.tierFlash;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * 0.7;
    const tg = ctx.createRadialGradient(0, 0, 0, 0, 0, 130);
    tg.addColorStop(0, hex2rgba(C.white, 0.9));
    tg.addColorStop(0.3, hex2rgba(C.cyan, 0.6));
    tg.addColorStop(1, 'transparent');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(0, 0, 130, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  const flameLen = 32 + Math.sin(player.enginePulse) * 8;
  const engineGrad = ctx.createLinearGradient(0, 18, 0, 18 + flameLen);
  engineGrad.addColorStop(0, hex2rgba(C.white, 0.98));
  engineGrad.addColorStop(0.35, hex2rgba(C.cyan, 0.85));
  engineGrad.addColorStop(0.7, hex2rgba(C.purple, 0.5));
  engineGrad.addColorStop(1, 'transparent');

  const thrusters = [[-13, 18], [13, 18]];
  if (tier >= 2) thrusters.push([-28, 20], [28, 20]);
  if (tier >= 3) thrusters.push([-42, 22], [42, 22]);
  if (tier >= 4) thrusters.push([-56, 24], [56, 24]);
  if (tier >= 5) thrusters.push([-70, 26], [70, 26]);

  for (const [tx, ty] of thrusters) {
    ctx.fillStyle = engineGrad;
    ctx.beginPath();
    ctx.moveTo(tx - 5, ty);
    ctx.lineTo(tx, ty + flameLen * (1 - Math.abs(tx) * 0.004));
    ctx.lineTo(tx + 5, ty);
    ctx.closePath(); ctx.fill();
  }

  const coreLen = flameLen * 1.4;
  const coreGrad = ctx.createLinearGradient(0, 16, 0, 16 + coreLen);
  coreGrad.addColorStop(0, C.white);
  coreGrad.addColorStop(0.3, hex2rgba(C.cyan, 0.9));
  coreGrad.addColorStop(0.7, hex2rgba(C.purple, 0.5));
  coreGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.moveTo(-6, 16); ctx.lineTo(0, 16 + coreLen); ctx.lineTo(6, 16);
  ctx.closePath(); ctx.fill();

  ctx.shadowColor = C.cyan;
  ctx.shadowBlur = 24 + tier * 3;

  const wingSpan = 44 + (tier - 1) * 14;
  const wingSweep = 0.55 + tier * 0.02;

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 7, -10);
    ctx.bezierCurveTo(side * 18, -6, side * (wingSpan * 0.7), wingSweep * 22, side * wingSpan, wingSweep * 30);
    ctx.lineTo(side * (wingSpan - 3), wingSweep * 30 + 8);
    ctx.bezierCurveTo(side * (wingSpan * 0.65), 40, side * 24, 24, side * 8, 14);
    ctx.closePath();
    const wingGrad = ctx.createLinearGradient(side * wingSpan, 0, 0, 18);
    wingGrad.addColorStop(0, '#0a1a3a'); wingGrad.addColorStop(0.4, '#1a3a6a');
    wingGrad.addColorStop(0.85, '#3a6aa0'); wingGrad.addColorStop(1, '#2a4a80');
    ctx.fillStyle = wingGrad; ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.75); ctx.lineWidth = 1.3; ctx.stroke();

    ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.1;
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(side * 7, -10);
    ctx.bezierCurveTo(side * 18, -6, side * (wingSpan * 0.7), wingSweep * 22, side * wingSpan, wingSweep * 30);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = hex2rgba(C.cyan, 0.35); ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(side * 10, 0);
    ctx.lineTo(side * (wingSpan - 8), wingSweep * 26 + 2);
    ctx.stroke();
  }

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 5, -28);
    ctx.bezierCurveTo(side * 14, -30, side * 24, -24, side * 28, -20);
    ctx.lineTo(side * 26, -16);
    ctx.bezierCurveTo(side * 18, -20, side * 10, -24, side * 5, -22);
    ctx.closePath();
    ctx.fillStyle = '#1a3a6a'; ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.8); ctx.lineWidth = 1; ctx.stroke();
  }

  const cannonPositions = [[-36, 6], [36, 6]];
  if (tier >= 2) cannonPositions.push([-52, 8], [52, 8]);
  if (tier >= 4) cannonPositions.push([-68, 10], [68, 10]);
  if (tier >= 5) cannonPositions.push([-84, 12], [84, 12]);

  for (const [cx2, cy2] of cannonPositions) {
    ctx.fillStyle = '#05010f';
    ctx.strokeStyle = hex2rgba(C.cyan, 0.85); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(cx2 - 3.5, cy2 - 8, 7, 14); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx2, cy2 - 10, 1.6, 0, Math.PI*2);
    ctx.fillStyle = C.lime; ctx.shadowColor = C.lime; ctx.shadowBlur = 10; ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (player.weaponLevel >= 2) {
    ctx.fillStyle = C.lime; ctx.shadowColor = C.lime; ctx.shadowBlur = 14;
    for (const [cx2, cy2] of cannonPositions) { ctx.beginPath(); ctx.arc(cx2, cy2 - 10, 2, 0, Math.PI*2); ctx.fill(); }
    ctx.shadowBlur = 0;
  }

  if (tier >= 3) {
    for (const side of [-1, 1]) {
      ctx.beginPath();
      const baseX = side * (wingSpan - 16);
      ctx.ellipse(baseX, 8, 12, 6.5, 0, 0, Math.PI*2);
      const podG = ctx.createRadialGradient(baseX - 4, 4, 0, baseX, 8, 15);
      podG.addColorStop(0, C.cyan); podG.addColorStop(0.5, '#1a1060'); podG.addColorStop(1, '#05010f');
      ctx.fillStyle = podG;
      ctx.shadowColor = C.cyan; ctx.shadowBlur = 14; ctx.fill();
      ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(baseX, 8, 2.8, 0, Math.PI*2);
      ctx.fillStyle = C.lime; ctx.shadowColor = C.lime; ctx.shadowBlur = 16; ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  if (tier >= 3) {
    ctx.beginPath();
    ctx.moveTo(0, -38); ctx.lineTo(-7, -58); ctx.lineTo(0, -50); ctx.lineTo(7, -58);
    ctx.closePath();
    const finG = ctx.createLinearGradient(0, -58, 0, -38);
    finG.addColorStop(0, hex2rgba(C.cyan, 0.95)); finG.addColorStop(1, '#1a5a9a');
    ctx.fillStyle = finG;
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 1;
    ctx.fill(); ctx.stroke();
  }

  if (tier >= 4) {
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 14, 16); ctx.lineTo(side * 30, 30); ctx.lineTo(side * 22, 32); ctx.lineTo(side * 11, 22);
      ctx.closePath();
      ctx.fillStyle = '#0a2050'; ctx.strokeStyle = C.cyan; ctx.lineWidth = 1;
      ctx.fill(); ctx.stroke();
    }
  }

  const hullW = 11 + (tier - 1) * 1.2;
  const hullH = 42 + (tier - 1) * 2;

  ctx.beginPath();
  ctx.moveTo(0, -hullH);
  ctx.lineTo(hullW * 0.7, -hullH + 14);
  ctx.lineTo(hullW, -8);
  ctx.lineTo(hullW + 1, 12);
  ctx.lineTo(0, 20);
  ctx.lineTo(-hullW - 1, 12);
  ctx.lineTo(-hullW, -8);
  ctx.lineTo(-hullW * 0.7, -hullH + 14);
  ctx.closePath();

  const bodyGrad = ctx.createLinearGradient(0, -hullH, 0, 22);
  bodyGrad.addColorStop(0, '#e0f4ff'); bodyGrad.addColorStop(0.25, C.cyan);
  bodyGrad.addColorStop(0.55, '#3a68b0'); bodyGrad.addColorStop(0.85, '#0a1a40');
  bodyGrad.addColorStop(1, '#050a20');
  ctx.fillStyle = bodyGrad; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.white, 0.9); ctx.lineWidth = 1.4; ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = hex2rgba(C.cyan, 0.5); ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(0, -hullH + 8); ctx.lineTo(0, 18); ctx.stroke();

  ctx.strokeStyle = hex2rgba(C.cyan, 0.4); ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(-5, -20); ctx.lineTo(5, -20);
  ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
  ctx.moveTo(-5, 12); ctx.lineTo(5, 12);
  ctx.stroke();

  if (tier >= 4) {
    ctx.fillStyle = 'rgba(10, 5, 30, 0.9)';
    ctx.strokeStyle = hex2rgba(C.cyan, 0.5); ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.rect(-7, -32, 14, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.rect(-9, 14, 18, 5); ctx.fill(); ctx.stroke();
  }

  if (tier >= 5) {
    ctx.beginPath(); ctx.arc(0, -6, 5, 0, Math.PI*2);
    const corePulse = 0.7 + Math.sin(state.gameTime * 6) * 0.3;
    ctx.fillStyle = hex2rgba(C.lime, corePulse);
    ctx.shadowColor = C.lime; ctx.shadowBlur = 22; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = C.white; ctx.lineWidth = 1; ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(0, -hullH + 4);
  ctx.quadraticCurveTo(-4.5, -hullH + 20, -4, -hullH + 32);
  ctx.lineTo(4, -hullH + 32);
  ctx.quadraticCurveTo(4.5, -hullH + 20, 0, -hullH + 4);
  ctx.closePath();
  const cg2 = ctx.createRadialGradient(-1.5, -hullH + 18, 0, 0, -hullH + 20, 12);
  cg2.addColorStop(0, hex2rgba(C.white, 0.98));
  cg2.addColorStop(0.4, hex2rgba(C.cyan, 0.95));
  cg2.addColorStop(0.75, 'rgba(40, 100, 180, 0.9)');
  cg2.addColorStop(1, 'rgba(10, 30, 70, 0.9)');
  ctx.fillStyle = cg2; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.white, 0.95); ctx.lineWidth = 0.9; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-1, -hullH + 8);
  ctx.quadraticCurveTo(-2.5, -hullH + 18, -2, -hullH + 26);
  ctx.lineTo(-0.5, -hullH + 26);
  ctx.quadraticCurveTo(-0.8, -hullH + 18, 0.3, -hullH + 8);
  ctx.closePath();
  ctx.fillStyle = hex2rgba(C.white, 0.75); ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, -hullH); ctx.lineTo(2.5, -hullH - 8); ctx.lineTo(-2.5, -hullH - 8);
  ctx.closePath();
  ctx.fillStyle = hex2rgba(C.white, 0.95);
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 16; ctx.fill();
  ctx.shadowBlur = 0;

  if (tier >= 4) {
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 6, -hullH + 6); ctx.lineTo(side * 8, -hullH - 4); ctx.lineTo(side * 4, -hullH - 4);
      ctx.closePath();
      ctx.fillStyle = hex2rgba(C.cyan, 0.85);
      ctx.shadowColor = C.cyan; ctx.shadowBlur = 10; ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  if (tier >= 2) {
    ctx.font = `bold ${fs(9, 1.5)}px "Consolas", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.lime;
    ctx.shadowColor = C.lime; ctx.shadowBlur = 8;
    ctx.fillText('T' + tier, 0, 18);
    ctx.shadowBlur = 0;
  }

  ctx.restore();

  if (state.shield > 0) {
    const shieldRatio = state.shield / state.maxShield;
    const pulse = 0.5 + Math.sin(player.shieldPhase * 2) * 0.15;
    const radius = 58 + pulse * 4 + (tier - 1) * 6;
    ctx.save();
    ctx.translate(px, py + bob);
    ctx.globalAlpha = shieldRatio * 0.6;
    const sg = ctx.createRadialGradient(0, 0, radius*0.6, 0, 0, radius);
    sg.addColorStop(0, 'transparent');
    sg.addColorStop(0.7, hex2rgba(C.cyan, 0.3 * shieldRatio));
    sg.addColorStop(1, hex2rgba(C.cyan, 0.8 * shieldRatio));
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, shieldRatio * 0.9); ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = shieldRatio * 0.4;
    ctx.strokeStyle = hex2rgba(C.magenta, 0.9); ctx.lineWidth = 0.8;
    for (let i = 0; i < 8; i++) {
      const ang = player.shieldPhase * 0.5 + i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*20, Math.sin(ang)*20);
      ctx.lineTo(Math.cos(ang)*radius, Math.sin(ang)*radius);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (player.invuln > 0) {
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(state.gameTime * 40) * 0.2;
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(px, py + bob, 70, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawBullets() {
  for (const b of bullets) {
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i], a = (i + 1) / b.trail.length;
      ctx.globalAlpha = a * 0.75;
      const grad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 5 + a*4);
      grad.addColorStop(0, C.white);
      grad.addColorStop(0.4, C.cyan);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(t.x, t.y, 5 + a*4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 24;
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 13);
    g.addColorStop(0, C.white);
    g.addColorStop(0.35, hex2rgba(C.cyan, 0.95));
    g.addColorStop(0.7, hex2rgba(C.purple, 0.5));
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, 13, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    if (p.glow) { ctx.shadowColor = p.color; ctx.shadowBlur = 14; }
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawShockwaves() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const sw of shockwaves) {
    const t = 1 - sw.life / sw.maxLife;
    ctx.globalAlpha = (1 - t) * 0.85;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 4 * (1 - t) + 1;
    ctx.shadowColor = sw.color; ctx.shadowBlur = 26;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawDebris() {
  for (const d of debris) {
    const a = Math.max(0, d.life / d.max);
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < d.points; i++) {
      const ang = (i/d.points)*Math.PI*2;
      const r = d.size * (0.6 + (i%2)*0.4);
      const px = Math.cos(ang)*r, py = Math.sin(ang)*r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.4); ctx.lineWidth = 0.8; ctx.stroke();
    ctx.restore();
  }
}

function drawPlaneFragments() {
  for (const f of planeFragments) {
    const a = Math.max(0, f.life / f.max);
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = a;

    if (f.glow) { ctx.shadowColor = f.color; ctx.shadowBlur = 14; }

    if (f.isPanel) {
      ctx.fillStyle = f.color;
      ctx.fillRect(-f.panelW / 2, -f.panelH / 2, f.panelW, f.panelH);
      ctx.strokeStyle = hex2rgba(C.white, 0.6 * a);
      ctx.lineWidth = 0.7;
      ctx.strokeRect(-f.panelW / 2, -f.panelH / 2, f.panelW, f.panelH);
    } else {
      ctx.fillStyle = f.color;
      ctx.beginPath();
      for (let i = 0; i < f.points; i++) {
        const ang = (i / f.points) * Math.PI * 2;
        const r = f.size * (0.45 + ((i % 2) ? 0.55 : 0.35));
        const px = Math.cos(ang) * r;
        const py = Math.sin(ang) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      if (f.edge) {
        ctx.strokeStyle = hex2rgba(C.white, 0.55 * a);
        ctx.lineWidth = 0.9;
        ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

function drawPopups() {
  for (const p of popups) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `bold ${fs(p.size, 1.5)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 18;
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }
}

/* ═══ HUD — ikut membesar di layar kecil ═══ */
function drawHUD() {
  const u = uiScale;
  ctx.save();

  const barH = 58 + 46 * u;
  const barGrad = ctx.createLinearGradient(0, 0, 0, barH);
  barGrad.addColorStop(0, 'rgba(15, 5, 40, 0.88)');
  barGrad.addColorStop(1, 'rgba(15, 5, 40, 0)');
  ctx.fillStyle = barGrad;
  ctx.fillRect(0, 0, W, barH);

  const by = 10;
  const bh = 42 * u;
  const bw = 208 * u;

  /* — KIRI : SKOR — */
  const px = 20;
  roundRect(ctx, px, by, bw, bh, 10);
  const sg1 = ctx.createLinearGradient(px, by, px, by + bh);
  sg1.addColorStop(0, 'rgba(30, 10, 60, 0.85)');
  sg1.addColorStop(1, 'rgba(10, 4, 30, 0.9)');
  ctx.fillStyle = sg1; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 0.7); ctx.lineWidth = 1.5; ctx.stroke();

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs(11, 1.6)}px system-ui, sans-serif`;
  ctx.fillStyle = C.cyan;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 8;
  ctx.fillText('◈ SKOR', px + 14, by + bh * 0.32);
  ctx.shadowBlur = 0;
  ctx.font = `bold ${fs(21, 1.6)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 12;
  ctx.fillText(String(state.score).padStart(6, '0'), px + 14, by + bh * 0.72);
  ctx.shadowBlur = 0;

  /* — TENGAH : LEVEL / TIER — */
  const cbx = (W - bw) / 2;
  roundRect(ctx, cbx, by, bw, bh, 10);
  const sg2 = ctx.createLinearGradient(cbx, by, cbx, by + bh);
  sg2.addColorStop(0, 'rgba(60, 15, 50, 0.85)');
  sg2.addColorStop(1, 'rgba(20, 4, 25, 0.9)');
  ctx.fillStyle = sg2; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.magenta, 0.7); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = `bold ${fs(10, 1.6)}px system-ui, sans-serif`;
  ctx.fillStyle = C.magenta;
  ctx.shadowColor = C.magenta; ctx.shadowBlur = 8;
  ctx.fillText('◈ LEVEL / TIER', W/2, by + bh * 0.30);
  ctx.shadowBlur = 0;
  ctx.font = `bold ${fs(17, 1.6)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.shadowColor = C.magenta; ctx.shadowBlur = 12;
  ctx.fillText(`LV ${state.level}  ·  T${player.tier}`, W/2, by + bh * 0.72);
  ctx.shadowBlur = 0;

  /* — KANAN : HULL + SHIELD + COMBO — */
  const segW = 24 * u, segH = 14 * u, gap = 5 * u;
  const totalW = state.maxHp * segW + (state.maxHp - 1) * gap;
  const startX = W - 20 - totalW;

  ctx.textAlign = 'right';
  ctx.font = `bold ${fs(10, 1.6)}px system-ui, sans-serif`;
  ctx.fillStyle = state.bossMode ? C.amber : C.cyan;
  ctx.shadowColor = state.bossMode ? C.amber : C.cyan;
  ctx.shadowBlur = 8;
  ctx.fillText(state.bossMode ? '☠ BOSS' : 'ERA ' + state.level, W - 20, by + bh * 0.22);
  ctx.shadowBlur = 0;

  for (let i = 0; i < state.maxHp; i++) {
    const sx = startX + i * (segW + gap);
    const on = i < state.hp;
    const isCrit = state.hp <= 2;
    roundRect(ctx, sx, by + bh * 0.36, segW, segH, 4);
    if (on) {
      const hg = ctx.createLinearGradient(sx, by, sx, by + bh);
      hg.addColorStop(0, isCrit ? C.pink : C.lime);
      hg.addColorStop(1, isCrit ? '#7a1508' : '#004a30');
      ctx.fillStyle = hg;
      ctx.shadowColor = isCrit ? C.pink : C.lime;
      ctx.shadowBlur = 12;
    } else ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.stroke();
  }

  const shY = by + bh * 0.80;
  roundRect(ctx, startX, shY, totalW, 5 * u, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
  if (state.shield > 0) {
    const sr = state.shield / state.maxShield;
    roundRect(ctx, startX, shY, totalW * sr, 5 * u, 3);
    const sg = ctx.createLinearGradient(startX, 0, startX + totalW, 0);
    sg.addColorStop(0, C.cyan); sg.addColorStop(1, C.magenta);
    ctx.fillStyle = sg;
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 10;
    ctx.fill(); ctx.shadowBlur = 0;
  }

  /* Combo meter di bawah panel tengah */
  const cmW = 200 * u, cmH = 9 * u;
  const cmX = (W - cmW) / 2;
  const cmY = by + bh + 10;
  roundRect(ctx, cmX, cmY, cmW, cmH, cmH / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  const cmRatio = state.comboMeter / 100;
  if (cmRatio > 0) {
    roundRect(ctx, cmX, cmY, cmW * cmRatio, cmH, cmH / 2);
    const cg = ctx.createLinearGradient(cmX, 0, cmX + cmW, 0);
    cg.addColorStop(0, C.lime); cg.addColorStop(1, C.cyan);
    ctx.fillStyle = cg;
    ctx.shadowColor = C.lime; ctx.shadowBlur = 12;
    ctx.fill(); ctx.shadowBlur = 0;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs(10, 1.6)}px system-ui, sans-serif`;
  ctx.fillStyle = C.lime;
  ctx.shadowColor = C.lime; ctx.shadowBlur = 8;
  ctx.fillText('COMBO ' + Math.floor(state.comboMeter) + '%', W/2, cmY + cmH + 10 * u);
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawToast() {
  if (state.toastTimer <= 0) return;
  const a = Math.min(1, state.toastTimer / 0.4);
  ctx.save();
  ctx.globalAlpha = a;
  const cx = W/2, cy = 600;
  const fToast = fs(26, 1.5);
  ctx.font = `bold ${fToast}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const metrics = ctx.measureText(state.toastText);
  const bw = metrics.width + 70;
  const bh = fToast + 34;
  roundRect(ctx, cx - bw/2, cy - bh/2, bw, bh, 12);
  const tg = ctx.createLinearGradient(cx, cy - bh/2, cx, cy + bh/2);
  tg.addColorStop(0, 'rgba(30, 10, 60, 0.9)');
  tg.addColorStop(1, 'rgba(10, 4, 30, 0.9)');
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = state.toastColor; ctx.lineWidth = 2.5;
  ctx.shadowColor = state.toastColor; ctx.shadowBlur = 30; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = state.toastColor;
  ctx.shadowColor = state.toastColor; ctx.shadowBlur = 20;
  ctx.fillText(state.toastText, cx, cy + 2);
  ctx.restore();
}

/* ═══ MENU ═══ */
function drawMenu() {
  const mu = Math.min(uiScale, 1.45);
  ctx.save();
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, H);
  bgGrad.addColorStop(0, 'rgba(20, 5, 45, 0.92)');
  bgGrad.addColorStop(1, 'rgba(3, 0, 12, 0.96)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const y = 40 + i * 24 * mu;
    const grd = ctx.createLinearGradient(0, y, W, y);
    const t = (state.gameTime * 0.6 + i) % 1;
    grd.addColorStop(0, 'transparent');
    grd.addColorStop(Math.max(0, t - 0.15), 'transparent');
    grd.addColorStop(t, i % 2 === 0 ? hex2rgba(C.cyan, 0.7) : hex2rgba(C.magenta, 0.7));
    grd.addColorStop(Math.min(1, t + 0.15), 'transparent');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(0, y - 1.5, W, 3);
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = `bold ${Math.round(20 * mu)}px system-ui, sans-serif`;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 22;
  ctx.fillStyle = C.cyan;
  ctx.fillText('◈  KUIS SEJARAH — MATERI SMA  ◈', W/2, 52);
  ctx.shadowBlur = 0;

  const titleSize = Math.round(62 * Math.min(mu, 1.2));
  ctx.font = `bold ${titleSize}px system-ui, sans-serif`;
  const tg = ctx.createLinearGradient(W/2 - 400, 0, W/2 + 400, 0);
  tg.addColorStop(0, C.cyan); tg.addColorStop(0.35, C.white);
  tg.addColorStop(0.7, C.magenta); tg.addColorStop(1, C.purple);
  ctx.shadowColor = C.magenta; ctx.shadowBlur = 45;
  ctx.fillStyle = tg;
  ctx.fillText('PERANG', W/2, 130);
  ctx.fillText('DUNIA I', W/2, 130 + titleSize * 1.08);
  ctx.shadowBlur = 0;

  ctx.font = `bold ${Math.round(15 * mu)}px system-ui, sans-serif`;
  ctx.fillStyle = hex2rgba(C.white, 0.78);
  ctx.fillText('⚡  1914–1918  •  F16 Musuh Terbang Mendekat — Lewat Pesawatmu = MELEDAK!  ⚡', W/2, 252);

  const panelY = 288, panelH = 300;
  const lx = 60, lw = 560;
  const rx = 650, rw = 490;

  /* — panel kiri — */
  roundRect(ctx, lx, panelY, lw, panelH, 18);
  const bgL = ctx.createLinearGradient(lx, panelY, lx, panelY + panelH);
  bgL.addColorStop(0, 'rgba(20, 8, 50, 0.85)');
  bgL.addColorStop(1, 'rgba(8, 3, 25, 0.9)');
  ctx.fillStyle = bgL; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 0.7); ctx.lineWidth = 2; ctx.stroke();

  ctx.font = `bold ${Math.round(16 * mu)}px system-ui, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillStyle = C.cyan;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 12;
  ctx.fillText('◆  KONTROL MISI', lx + 28, panelY + 34);
  ctx.shadowBlur = 0;

  const rules = [
    ['[1] [2] [3] [4]', 'Tembak jawaban 1-4'],
    ['KLIK / TAP', 'Tembak pesawat F16'],
    ['[SPASI]', 'Mulai / Ulangi'],
    ['← → / A D', 'Geser pesawat'],
  ];
  const keyBoxW = 168 * mu;
  const keyBoxH = 30 * mu;
  const rowH = 40 * mu;
  const descX = lx + 28 + keyBoxW + 20;
  rules.forEach((r, i) => {
    const yy = panelY + 80 + i * rowH;
    roundRect(ctx, lx + 28, yy - keyBoxH / 2, keyBoxW, keyBoxH, 6);
    ctx.fillStyle = hex2rgba(C.cyan, 0.12); ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.5); ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = C.cyan;
    ctx.font = `bold ${Math.round(13 * mu)}px "Consolas", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(r[0], lx + 28 + keyBoxW / 2, yy + 1);
    ctx.textAlign = 'left';
    ctx.font = `bold ${Math.round(14 * mu)}px system-ui, sans-serif`;
    ctx.fillStyle = C.white;
    ctx.fillText(r[1], descX, yy + 1);
  });

  /* — panel kanan — */
  roundRect(ctx, rx, panelY, rw, panelH, 18);
  const bgR = ctx.createLinearGradient(rx, panelY, rx, panelY + panelH);
  bgR.addColorStop(0, 'rgba(60, 8, 45, 0.85)');
  bgR.addColorStop(1, 'rgba(20, 3, 25, 0.9)');
  ctx.fillStyle = bgR; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.magenta, 0.7); ctx.lineWidth = 2; ctx.stroke();

  ctx.font = `bold ${Math.round(16 * mu)}px system-ui, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillStyle = C.magenta;
  ctx.shadowColor = C.magenta; ctx.shadowBlur = 12;
  ctx.fillText('◆  ANCAMAN F16', rx + 28, panelY + 34);
  ctx.shadowBlur = 0;

  const systems = [
    ['F16 · 4 SKUADRON', 'Terbang maju mendekatimu'],
    ['MAJU = TIMER', 'Semakin dekat = waktu habis'],
    ['LEWAT PESAWATMU', 'Perisai/Darah langsung jatuh'],
    ['JAWAB BENAR', '3 F16 kabur, 1 hancur lebur'],
  ];
  const sysColors = [C.cyan, C.lime, C.amber, C.pink];
  systems.forEach((s, i) => {
    const yy = panelY + 76 + i * rowH;
    ctx.fillStyle = sysColors[i];
    ctx.fillRect(rx + 28, yy - 9 * mu, 4, 20 * mu);
    ctx.font = `bold ${Math.round(13 * mu)}px "Consolas", monospace`;
    ctx.fillStyle = sysColors[i];
    ctx.shadowColor = sysColors[i];
    ctx.shadowBlur = 8;
    ctx.fillText(s[0], rx + 44, yy - 6 * mu);
    ctx.shadowBlur = 0;
    ctx.font = `${Math.round(13 * mu)}px system-ui, sans-serif`;
    ctx.fillStyle = hex2rgba(C.white, 0.88);
    ctx.fillText(s[1], rx + 44, yy + 14 * mu);
  });

  /* — tombol mulai — */
  const blink = 0.65 + Math.sin(state.gameTime * 4) * 0.35;
  ctx.globalAlpha = blink;
  const btnW = 560, btnH = 68;
  const btnX = (W - btnW) / 2, btnY = 612;
  roundRect(ctx, btnX, btnY, btnW, btnH, 14);
  const bg = ctx.createLinearGradient(btnX, 0, btnX + btnW, 0);
  bg.addColorStop(0, hex2rgba(C.cyan, 0.18));
  bg.addColorStop(0.5, hex2rgba(C.magenta, 0.3));
  bg.addColorStop(1, hex2rgba(C.cyan, 0.18));
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.5;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 26; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.font = `bold ${Math.round(24 * mu)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.white;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 22;
  ctx.fillText('▶  MULAI MISI  ◀', W/2, btnY + btnH / 2);
  ctx.restore();
}

function drawGameOver() {
  const mu = Math.min(uiScale, 1.45);
  ctx.save();
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, H);
  bgGrad.addColorStop(0, 'rgba(60, 5, 35, 0.92)');
  bgGrad.addColorStop(1, 'rgba(10, 0, 8, 0.96)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.1;
  for (let i = 0; i < 6; i++) {
    const y = (state.gameTime * 80 + i * 120) % H;
    ctx.fillStyle = C.pink; ctx.fillRect(0, y, W, 2);
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tSize = Math.round(66 * Math.min(mu, 1.15));
  ctx.font = `bold ${tSize}px system-ui, sans-serif`;
  const ox = (Math.random()-0.5)*4, oy = (Math.random()-0.5)*4;
  ctx.fillStyle = C.pink;
  ctx.shadowColor = C.pink; ctx.shadowBlur = 40;
  ctx.fillText('MISI GAGAL', W/2 + ox, 138 + oy);
  ctx.fillStyle = C.white; ctx.shadowBlur = 0;
  ctx.fillText('MISI GAGAL', W/2, 138);

  ctx.font = `bold ${Math.round(15 * mu)}px system-ui, sans-serif`;
  ctx.fillStyle = hex2rgba(C.white, 0.72);
  ctx.fillText('Skuadron F16 musuh berhasil menerobos pertahananmu...', W/2, 198);

  const px = 240, py = 232, pw = W - 480, ph = 200 + 62 * mu;
  roundRect(ctx, px, py, pw, ph, 20);
  const bg = ctx.createLinearGradient(px, py, px, py + ph);
  bg.addColorStop(0, 'rgba(20, 5, 45, 0.94)');
  bg.addColorStop(1, 'rgba(8, 2, 22, 0.94)');
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.pink, 0.65); ctx.lineWidth = 2.5; ctx.stroke();

  ctx.font = `bold ${Math.round(15 * mu)}px system-ui, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillStyle = C.pink;
  ctx.shadowColor = C.pink; ctx.shadowBlur = 10;
  ctx.fillText('◆  LAPORAN MISI', px + 30, py + 32);
  ctx.shadowBlur = 0;

  const total = state.hitCorrect + state.hitWrong;
  const stats = [
    ['SKOR AKHIR', String(state.score), C.lime],
    ['JAWABAN BENAR', String(state.hitCorrect), C.cyan],
    ['JAWABAN SALAH', String(state.hitWrong), C.pink],
    ['TIER PESAWAT', 'T' + player.tier, C.amber],
    ['COMBO TERBAIK', 'x' + state.bestStreak, C.magenta],
    ['AKURASI', total > 0 ? Math.round(state.hitCorrect / total * 100) + '%' : '—', C.cyan],
  ];
  const colW = (pw - 60) / 2;
  const rowHH = 50 * mu;
  stats.forEach((s, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const x = px + 30 + col * colW, y = py + 72 + row * rowHH;
    ctx.fillStyle = s[2];
    ctx.fillRect(x - 12, y - 9, 3, 34 * mu);
    ctx.textAlign = 'left';
    ctx.font = `bold ${Math.round(11 * mu)}px system-ui, sans-serif`;
    ctx.fillStyle = hex2rgba(C.white, 0.72);
    ctx.fillText(s[0], x, y);
    ctx.font = `bold ${Math.round(26 * mu)}px system-ui, sans-serif`;
    ctx.fillStyle = s[2];
    ctx.shadowColor = s[2]; ctx.shadowBlur = 16;
    ctx.fillText(s[1], x, y + 26 * mu);
    ctx.shadowBlur = 0;
  });

  const blink = 0.6 + Math.sin(state.gameTime * 4) * 0.4;
  ctx.globalAlpha = blink;
  const btnW = 520, btnH = 62;
  const btnX = (W - btnW) / 2, btnY = 560;
  roundRect(ctx, btnX, btnY, btnW, btnH, 14);
  const btnG = ctx.createLinearGradient(btnX, 0, btnX + btnW, 0);
  btnG.addColorStop(0, hex2rgba(C.cyan, 0.18));
  btnG.addColorStop(0.5, hex2rgba(C.magenta, 0.3));
  btnG.addColorStop(1, hex2rgba(C.cyan, 0.18));
  ctx.fillStyle = btnG; ctx.fill();
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.5;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 26; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.font = `bold ${Math.round(22 * mu)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.white;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 20;
  ctx.fillText('▶  COBA LAGI  ◀', W/2, btnY + btnH / 2);
  ctx.restore();
}

/* ═══ MASTER RENDER ═══ */
function render() {
  ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
  ctx.save();
  if (state.shake > 0) {
    ctx.translate((Math.random()-0.5) * state.shake, (Math.random()-0.5) * state.shake);
  }
  drawBackground();
  if (state.mode === 'playing' || state.mode === 'over') {
    drawEngineTrails();
    drawSmokePuffs();
    drawQShip();
    drawQShipDebris();
    for (const e of enemies) drawEnemyPanel(e);
    for (const e of enemies) drawEnemyShip(e);
    drawBullets();
    drawShockwaves();
    drawDebris();
    drawPlaneFragments();
    drawParticles();
    drawHeatDistortions();
    drawPlayer();
    drawPopups();
    if (state.mode === 'playing') {
      drawQuestionPanel();
      drawHUD();
      drawToast();
    }
  }
  ctx.restore();

  if (state.flashRed > 0) { ctx.fillStyle = hex2rgba(C.pink, state.flashRed*0.35); ctx.fillRect(0,0,W,H); }
  if (state.flashGreen > 0) { ctx.fillStyle = hex2rgba(C.lime, state.flashGreen*0.22); ctx.fillRect(0,0,W,H); }
  if (state.flashBlue > 0) { ctx.fillStyle = hex2rgba(C.cyan, state.flashBlue*0.28); ctx.fillRect(0,0,W,H); }

  const vg = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.95);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let y = 0; y < H; y += 3) { ctx.fillStyle = '#000'; ctx.fillRect(0, y, W, 1); }
  ctx.restore();

  if (state.mode === 'menu') drawMenu();
  if (state.mode === 'over') drawGameOver();
}

/* ═══ MAIN LOOP ═══ */
let lastTs = 0;
function loop(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  if (document.body.classList.contains('portrait-locked')) {
    requestAnimationFrame(loop);
    return;
  }

  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ═══ INPUT ═══ */
function canvasCoords(clientX, clientY) {
  const r = cvs.getBoundingClientRect();
  return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
}

function handleStart() {
  initAudio();
  if (state.mode === 'menu' || state.mode === 'over') {
    resetGame();
    tone(520, 0.1, 'triangle', 0.055, 880);
    tone(780, 0.14, 'triangle', 0.055, 1200, 0.1);
    tone(1040, 0.18, 'sine', 0.045, 1560, 0.22);
  }
}

let pointerDown = false;
let dragTargetX = null;

cvs.addEventListener('pointerdown', (evt) => {
  evt.preventDefault();
  initAudio();
  pointerDown = true;
  const { x, y } = canvasCoords(evt.clientX, evt.clientY);
  if (state.mode !== 'playing') { handleStart(); return; }
  if (!state.locked && state.roundActive) {
    let hit = false;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive || e.dying > 0 || e.launching || e.fleeing) continue;
      const inShip = x >= e.x - 62 && x <= e.x + 62 && y >= e.y - 60 && y <= e.y + 60;
      const panelCY = e.y + PANEL_BELOW_GAP;
      const inPanel = x >= e.x - PANEL_W/2 - 14 && x <= e.x + PANEL_W/2 + 14
                   && y >= panelCY - PANEL_H/2 - 14 && y <= panelCY + PANEL_H/2 + 14;
      if (inShip || inPanel) { fire(i); hit = true; return; }
    }
    if (!hit) {
      dragTargetX = clamp(x, 80, W - 80);
      player.targetX = dragTargetX;
    }
  } else {
    dragTargetX = clamp(x, 80, W - 80);
    player.targetX = dragTargetX;
  }
}, { passive: false });

cvs.addEventListener('pointermove', (evt) => {
  if (state.mode !== 'playing') return;
  const { x } = canvasCoords(evt.clientX, evt.clientY);
  if (pointerDown) { dragTargetX = clamp(x, 80, W - 80); player.targetX = dragTargetX; }
  else { player.targetX = clamp(x, 80, W - 80); }
}, { passive: false });

cvs.addEventListener('pointerup', () => { pointerDown = false; dragTargetX = null; });
cvs.addEventListener('pointercancel', () => { pointerDown = false; dragTargetX = null; });
cvs.addEventListener('pointerleave', () => { pointerDown = false; dragTargetX = null; });

window.addEventListener('keydown', (evt) => {
  initAudio();
  if (evt.code === 'Space' || evt.code === 'Enter') {
    evt.preventDefault();
    if (state.mode !== 'playing') handleStart();
    return;
  }
  if (state.mode === 'playing') {
    if (evt.code === 'ArrowLeft' || evt.code === 'KeyA') {
      player.targetX = clamp(player.targetX - 60, 80, W - 80);
      evt.preventDefault();
    } else if (evt.code === 'ArrowRight' || evt.code === 'KeyD') {
      player.targetX = clamp(player.targetX + 60, 80, W - 80);
      evt.preventDefault();
    }
    const keyMap = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 };
    if (evt.code in keyMap) { evt.preventDefault(); fire(keyMap[evt.code]); }
  }
});

const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

function setMoveBtn(btn, dir) {
  let interval = null;
  const startMove = (e) => {
    e.preventDefault();
    initAudio();
    const step = () => { player.targetX = clamp(player.targetX + dir * 40, 80, W - 80); };
    step();
    interval = setInterval(step, 90);
  };
  const stopMove = () => { if (interval) { clearInterval(interval); interval = null; } };
  btn.addEventListener('touchstart', startMove, { passive: false });
  btn.addEventListener('touchend', stopMove, { passive: false });
  btn.addEventListener('touchcancel', stopMove, { passive: false });
  btn.addEventListener('mousedown', startMove);
  btn.addEventListener('mouseup', stopMove);
  btn.addEventListener('mouseleave', stopMove);
}
if (btnLeft) setMoveBtn(btnLeft, -1);
if (btnRight) setMoveBtn(btnRight, 1);

document.querySelectorAll('.fireBtn').forEach((btn) => {
  const opt = parseInt(btn.getAttribute('data-opt'), 10);
  const doFire = (e) => {
    e.preventDefault();
    initAudio();
    if (state.mode !== 'playing') { handleStart(); return; }
    fire(opt);
  };
  btn.addEventListener('touchstart', doFire, { passive: false });
  btn.addEventListener('mousedown', doFire);
});

window.addEventListener('blur', () => { lastTs = 0; pointerDown = false; dragTargetX = null; });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

state.gameTime = 0;
</script>
</body>
</html>

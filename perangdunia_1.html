/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE / SKALA — semua ukuran teks kini adaptif
   ═══════════════════════════════════════════════════════════════ */
let viewScale = 1;    // skala kanvas (CSS px per px logis)
let uiScale   = 1;    // pengali ukuran teks supaya selalu terbaca
let baseScale = 1;    // skala transform kanvas (viewScale * dpr)
let dpr       = 1;

/* Variabel layout (berubah mengikuti ukuran layar) */
let COL_X = [150, 450, 750, 1050];
let SHIP_Y_START = 250;
let SHIP_Y_END = 448;
let SHIP_TOTAL_DESCENT = 198;
let PANEL_BELOW_GAP = 102;
let PANEL_W = 286;
let PANEL_H = 82;
let QP_X = 130, QP_Y = 76, QP_W = 940, QP_H = 126;
const ENEMY_SCALE = 0.72;

const isCoarsePointer = () => window.matchMedia('(hover: none) and (pointer: coarse)').matches;
const isPortrait = () => window.innerHeight > window.innerWidth;

function updateOrientationOverlay() {
  const locked = isCoarsePointer() && isPortrait();
  document.body.classList.toggle('portrait-locked', locked);
  return locked;
}

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function hex2rgba(hex, a) {
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* Ukuran font adaptif — inti dari perbaikan keterbacaan */
function fs(n, cap) { return Math.round(n * Math.min(uiScale, cap || 1.7)); }

function applyLayout() {
  const u = uiScale;

  // Panel pertanyaan
  QP_X = 120 - 8 * (u - 1);
  QP_W = W - QP_X * 2;
  QP_Y = 62 + 15 * u;
  QP_H = 124 + 42 * (u - 1);

  // Posisi pesawat & panel jawaban
  SHIP_Y_START = QP_Y + QP_H + 62;
  PANEL_H = 54 + 27 * u;
  PANEL_BELOW_GAP = 52 + PANEL_H / 2 + 10;
  SHIP_Y_END = 592 - PANEL_BELOW_GAP - PANEL_H / 2;
  if (SHIP_Y_END > 470) SHIP_Y_END = 470;
  if (SHIP_Y_END < SHIP_Y_START + 90) SHIP_Y_END = SHIP_Y_START + 90;
  SHIP_TOTAL_DESCENT = SHIP_Y_END - SHIP_Y_START;

  COL_X = [150, 450, 750, 1050];
  PANEL_W = 286;
}

function resize() {
  const locked = updateOrientationOverlay();
  if (locked) return;

  const isMobile = isCoarsePointer();
  const padding = isMobile ? 0.965 : 0.98;

  const vw = (window.visualViewport && window.visualViewport.width)  || window.innerWidth;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;

  const s = Math.min(vw / W, vh / H) * padding;
  viewScale = s;

  // Perbesar teks bila kanvas tampil kecil di layar
  uiScale = clamp(0.88 / s, 1, 1.7);

  // Resolusi internal mengikuti pixel density layar → teks tajam
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const maxW = 3400;
  if (W * s * dpr > maxW) dpr = Math.max(1, maxW / (W * s));

  cvs.style.width  = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
  cvs.width  = Math.max(2, Math.round(W * s * dpr));
  cvs.height = Math.max(2, Math.round(H * s * dpr));
  baseScale = cvs.width / W;

  applyLayout();
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
}
resize();

/* ═══ AUDIO ═══ */
let actx = null;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, t='square', v=0.06, s=null, dl=0) {
  if (!actx) return;
  const t0 = actx.currentTime + dl;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = t; o.frequency.setValueAtTime(f, t0);
  if (s) o.frequency.exponentialRampToValueAtTime(Math.max(20, s), t0 + d);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(v, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}
function noiseBurst(d=0.3, v=0.12, c=900, q=1) {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * d);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const da = buf.getChannelData(0);
  for (let i = 0; i < len; i++) da[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.7);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = v;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = c; f.Q.value = q;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}

/* ═══ UTIL ═══ */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (r < 0) r = 0;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function wrapText(text, maxWidth, font) {
  const prev = ctx.font; ctx.font = font;
  const words = text.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  ctx.font = prev;
  return lines;
}

/* ═══ BACKGROUND + BENDA RUANG ANGKASA ═══ */
function makeSpaceObject(atTop) {
  const r = Math.random();
  let type;
  if (r < 0.38) type = 'asteroid';
  else if (r < 0.58) type = 'moon';
  else if (r < 0.75) type = 'planet';
  else if (r < 0.86) type = 'gasGiant';
  else if (r < 0.95) type = 'comet';
  else type = 'station';
  let size, hue, alpha, v;
  switch (type) {
    case 'asteroid': size = 8 + Math.random() * 32;  hue = 18 + Math.random() * 25;  alpha = 0.45 + Math.random() * 0.35; v = 12 + Math.random() * 30; break;
    case 'moon':     size = 18 + Math.random() * 38; hue = 200 + Math.random() * 60; alpha = 0.4 + Math.random() * 0.3;   v = 8 + Math.random() * 18;  break;
    case 'planet':   size = 30 + Math.random() * 65; hue = Math.random() * 360;      alpha = 0.42 + Math.random() * 0.3;  v = 5 + Math.random() * 14;  break;
    case 'gasGiant': size = 90 + Math.random() * 140;hue = Math.random() * 360;      alpha = 0.30 + Math.random() * 0.25; v = 3 + Math.random() * 8;   break;
    case 'comet':    size = 4 + Math.random() * 6;   hue = 175 + Math.random() * 70; alpha = 0.75 + Math.random() * 0.2;  v = 40 + Math.random() * 50; break;
    case 'station':  size = 22 + Math.random() * 26; hue = 180 + Math.random() * 90; alpha = 0.55;                       v = 10 + Math.random() * 14; break;
  }
  const o = {
    type, size, hue, alpha, v,
    x: Math.random() * W,
    y: atTop ? -size * 3 - Math.random() * H * 0.5 : Math.random() * H,
    rot: Math.random() * Math.PI * 2,
    rotV: (Math.random() - 0.5) * 0.5,
    detail: Math.random(),
    shape: [], craters: [],
    hasRing: type === 'planet' && Math.random() < 0.35,
    ringTilt: (Math.random() - 0.5) * 0.6,
    bandSeed: Math.random() * 100,
  };
  if (type === 'asteroid') {
    const pts = 7 + Math.floor(Math.random() * 5);
    for (let j = 0; j < pts; j++) { const a = (j / pts) * Math.PI * 2; o.shape.push({ a, r: 0.65 + Math.random() * 0.55 }); }
    const nc = 2 + Math.floor(Math.random() * 4);
    for (let j = 0; j < nc; j++) o.craters.push({ x: (Math.random() - 0.5) * size * 1.1, y: (Math.random() - 0.5) * size * 1.1, r: size * (0.08 + Math.random() * 0.18) });
  } else if (type === 'moon' || type === 'planet') {
    const nc = 2 + Math.floor(Math.random() * 5);
    for (let j = 0; j < nc; j++) o.craters.push({ x: (Math.random() - 0.5) * size * 1.2, y: (Math.random() - 0.5) * size * 1.2, r: size * (0.07 + Math.random() * 0.16) });
  }
  return o;
}

initBackground();

function drawSpaceObjects() {
  for (const o of spaceObjects) {
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.type === 'asteroid') {
      ctx.rotate(o.rot);
      ctx.globalAlpha = o.alpha;
      ctx.beginPath();
      for (let i = 0; i < o.shape.length; i++) {
        const p = o.shape[i];
        const px = Math.cos(p.a) * o.size * p.r;
        const py = Math.sin(p.a) * o.size * p.r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const g = ctx.createRadialGradient(-o.size*0.35, -o.size*0.35, 0, 0, 0, o.size*1.2);
      g.addColorStop(0, `hsl(${o.hue}, 28%, 38%)`);
      g.addColorStop(0.55, `hsl(${o.hue}, 22%, 22%)`);
      g.addColorStop(1, `hsl(${o.hue}, 18%, 9%)`);
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = `hsla(${o.hue}, 35%, 50%, 0.5)`; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.fillStyle = `hsla(${o.hue}, 30%, 12%, 0.75)`;
      for (const c of o.craters) { ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill(); }
    } else if (o.type === 'moon' || o.type === 'planet') {
      ctx.globalAlpha = o.alpha;
      if (o.hasRing) {
        ctx.save();
        ctx.rotate(o.ringTilt);
        ctx.strokeStyle = `hsla(${o.hue}, 40%, 60%, 0.4)`; ctx.lineWidth = o.size * 0.12;
        ctx.beginPath(); ctx.ellipse(0, 0, o.size * 1.7, o.size * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = `hsla(${o.hue}, 40%, 75%, 0.25)`; ctx.lineWidth = o.size * 0.06;
        ctx.beginPath(); ctx.ellipse(0, 0, o.size * 1.9, o.size * 0.45, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      const g = ctx.createRadialGradient(-o.size*0.35, -o.size*0.35, 0, 0, 0, o.size);
      g.addColorStop(0, `hsl(${o.hue}, 55%, 60%)`);
      g.addColorStop(0.55, `hsl(${o.hue}, 48%, 38%)`);
      g.addColorStop(1, `hsl(${o.hue}, 50%, 14%)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, o.size, 0, Math.PI*2); ctx.fill();
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, o.size, 0, Math.PI*2); ctx.clip();
      const sh = ctx.createRadialGradient(o.size*0.6, o.size*0.6, 0, 0, 0, o.size*1.05);
      sh.addColorStop(0, 'rgba(0,0,0,0.75)'); sh.addColorStop(0.65, 'rgba(0,0,0,0.35)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sh; ctx.fillRect(-o.size, -o.size, o.size*2, o.size*2);
      ctx.restore();
      ctx.fillStyle = `hsla(${o.hue}, 50%, 18%, 0.55)`;
      for (const c of o.craters) {
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = `hsla(${o.hue}, 60%, 70%, 0.2)`;
        ctx.beginPath(); ctx.arc(c.x - c.r*0.3, c.y - c.r*0.3, c.r*0.6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = `hsla(${o.hue}, 50%, 18%, 0.55)`;
      }
    } else if (o.type === 'gasGiant') {
      ctx.globalAlpha = o.alpha;
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, o.size, 0, Math.PI*2); ctx.clip();
      const g = ctx.createRadialGradient(-o.size*0.3, -o.size*0.3, 0, 0, 0, o.size*1.1);
      g.addColorStop(0, `hsl(${o.hue}, 55%, 62%)`);
      g.addColorStop(0.6, `hsl(${o.hue}, 48%, 38%)`);
      g.addColorStop(1, `hsl(${o.hue}, 40%, 18%)`);
      ctx.fillStyle = g; ctx.fillRect(-o.size, -o.size, o.size*2, o.size*2);
      const bands = 10;
      for (let i = 0; i < bands; i++) {
        const t = i / bands;
        const by = -o.size + t * o.size * 2;
        const bh = o.size * 2 / bands;
        const hueShift = Math.sin(i * 0.9 + o.bandSeed) * 22;
        const light = 30 + Math.sin(i * 1.7 + o.bandSeed) * 18 + 20;
        ctx.fillStyle = `hsla(${o.hue + hueShift}, 55%, ${light}%, 0.35)`;
        ctx.fillRect(-o.size, by, o.size*2, bh * 0.85);
      }
      const sh = ctx.createRadialGradient(o.size*0.55, o.size*0.55, 0, 0, 0, o.size*1.1);
      sh.addColorStop(0, 'rgba(0,0,0,0.75)'); sh.addColorStop(0.5, 'rgba(0,0,0,0.35)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sh; ctx.fillRect(-o.size, -o.size, o.size*2, o.size*2);
      const hi = ctx.createRadialGradient(-o.size*0.4, -o.size*0.4, 0, 0, 0, o.size*0.8);
      hi.addColorStop(0, 'rgba(255,255,255,0.18)'); hi.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hi; ctx.fillRect(-o.size, -o.size, o.size*2, o.size*2);
      ctx.restore();
      ctx.strokeStyle = `hsla(${o.hue}, 55%, 65%, 0.25)`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, o.size - 0.5, 0, Math.PI*2); ctx.stroke();
    } else if (o.type === 'comet') {
      ctx.globalAlpha = o.alpha;
      const tailLen = o.size * 14;
      const tg = ctx.createLinearGradient(0, 0, 0, -tailLen);
      tg.addColorStop(0, `hsla(${o.hue}, 95%, 75%, 0.9)`);
      tg.addColorStop(0.35, `hsla(${o.hue}, 85%, 60%, 0.4)`);
      tg.addColorStop(1, 'transparent');
      ctx.fillStyle = tg;
      ctx.beginPath();
      ctx.moveTo(-o.size*0.9, 0);
      ctx.quadraticCurveTo(0, -tailLen*0.5, 0, -tailLen);
      ctx.quadraticCurveTo(0, -tailLen*0.5, o.size*0.9, 0);
      ctx.closePath(); ctx.fill();
      const hg = ctx.createRadialGradient(0, 0, 0, 0, 0, o.size*2.4);
      hg.addColorStop(0, '#ffffff');
      hg.addColorStop(0.35, `hsl(${o.hue}, 95%, 78%)`);
      hg.addColorStop(1, 'transparent');
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(0, 0, o.size*2.4, 0, Math.PI*2); ctx.fill();
    } else if (o.type === 'station') {
      ctx.rotate(o.rot);
      ctx.globalAlpha = o.alpha;
      ctx.strokeStyle = `hsl(${o.hue}, 65%, 65%)`;
      ctx.fillStyle = `hsla(${o.hue}, 55%, 15%, 0.85)`;
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, 0, o.size * 0.28, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        const px = Math.cos(a) * o.size * 0.28;
        const py = Math.sin(a) * o.size * 0.28;
        const ex = Math.cos(a) * o.size;
        const ey = Math.sin(a) * o.size;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.save();
        ctx.translate(ex, ey);
        ctx.rotate(a + Math.PI/2);
        ctx.fillStyle = `hsla(${o.hue}, 65%, 22%, 0.85)`;
        ctx.fillRect(-o.size*0.42, -2.5, o.size*0.84, 5);
        ctx.strokeRect(-o.size*0.42, -2.5, o.size*0.84, 5);
        ctx.restore();
      }
      const blink = 0.4 + Math.sin(state.gameTime * 3 + o.detail * 10) * 0.6;
      ctx.globalAlpha = o.alpha * blink;
      ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI*2);
      ctx.fillStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 12; ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
}

function resetGame() {
  state.score = 0; state.hp = state.maxHp; state.shield = state.maxShield;
  state.level = 1; state.correctCount = 0;
  state.streak = 0; state.bestStreak = 0;
  state.hitCorrect = 0; state.hitWrong = 0;
  state.gameTime = 0; state.comboMeter = 0;
  state.shake = 0; state.flashRed = 0; state.flashGreen = 0; state.flashBlue = 0;
  state.toastTimer = 0; state.bossMode = false;
  state.qPanelSlide = 0;
  player.x = W / 2; player.y = 655; player.targetX = W / 2;
  player.vx = 0; player.bank = 0;
  player.weaponLevel = 1; player.overdrive = 0; player.invuln = 1.5;
  player.tier = 1; player.tierFlash = 0;
  player.thrusterTrails = [];
  questionPool = shuffle([...QUESTIONS]);
  enemies = []; bullets = []; particles = [];
  shockwaves = []; debris = []; popups = []; engineTrails = [];
  qShipDebris = []; planeFragments = []; smokePuffs = []; heatDistortions = [];
  state.mode = 'playing';
  newRound();
}

function newRound() {
  if (questionPool.length === 0) questionPool = shuffle([...QUESTIONS]);
  const q = questionPool.pop();
  currentQuestion = q;
  const opts = q.o.map((text, i) => ({ text, correct: i === q.a }));
  shuffle(opts);
  state.bossMode = (state.level >= 5 && state.level % 5 === 0);

  qShip.x = W / 2; qShip.y = qShip.entryY; qShip.baseY = 80;
  qShip.state = 'entering'; qShip.entryT = 0; qShip.hoverT = 0;
  qShip.reactorPulse = 0; qShip.ringAngle = 0; qShip.ringAngle2 = 0;
  qShip.thrusterPulse = 0; qShip.engineGlow = 0;
  qShip.explodeT = 0; qShip.explodeRingR = 0; qShip.explodeRingR2 = 0;
  qShip.chargeLevel = 0; qShip.alarmPulse = 0;
  qShip.leaveVx = 0; qShip.leaveVy = 0; qShip.rotZ = 0;
  qShip.smokeEmitters = [];
  state.qPanelSlide = 0;

  enemies = opts.map((o, i) => ({
    baseX: COL_X[i], baseY: SHIP_Y_START,
    x: COL_X[i], y: -280 - i * 70,
    text: o.text, correct: o.correct,
    alive: true, dying: 0, scale: 1, rot: 0,
    engine: Math.random() * Math.PI * 2,
    flash: 0, type: i,
    hp: state.bossMode ? (o.correct ? 2 : 1) : 1,
    launching: false, launchVy: 0, launchSpin: 0,
    fleeing: false, fleeVx: 0, fleeVy: 0, fleeRot: 0, fleeSpin: 0,
    panelScale: 0, panelFlash: 0,
    bank: 0, bankTarget: 0,
    pitch: 0, pitchTarget: 0,
    wingFlex: 0,
    smokeTimer: 0,
    afterburner: 0,
    targetX: COL_X[i],
    targetY: -280 - i * 70,
  }));

  state.timeMax = Math.max(11, 23 - (state.level - 1) * 1.25);
  state.timeLeft = state.timeMax;
  state.roundActive = true;
  state.locked = false;
}

function explosion(x, y, color, count=30, power=280, sizeMul=1) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * power + 40;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.5 + Math.random()*0.9, max: 1.2, size: (Math.random()*3.5+1.2)*sizeMul, color, glow: Math.random() > 0.5 });
  }
  for (let i = 0; i < count*0.6; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * power * 1.6 + 80;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.3+Math.random()*0.5, max: 0.8, size: Math.random()*2+1, color: C.white, glow: true });
  }
}
function shockwave(x, y, color, maxR=90, life=0.5) { shockwaves.push({ x, y, r: 6, maxR, life, maxLife: life, color }); }
function debrisBurst(x, y, color, count=8) {

function toast(text, color) { state.toastText = text; state.toastColor = color; state.toastTimer = 1.4; }
function spawnEngineTrail(x, y, color) { engineTrails.push({ x, y, vx: (Math.random()-0.5)*30, vy: 100 + Math.random()*80, life: 0.6, max: 0.6, size: 4 + Math.random()*4, color }); }

function destroyEnemyPlane(e) {
  const accentColors = [C.cyan, C.magenta, C.lime, C.amber];
  const accent = accentColors[e.type] || C.cyan;
  const fragColors = [
    '#c8d0d8', '#8c99a8', '#485566', '#1c2634',
    '#ff7060', '#a83028', '#501015', '#ffb040',
    '#e8e8e8', '#9098a4', accent, '#ff4422',
  ];

  explosion(e.x, e.y, '#ffdd77', 32, 260, 1.9);
  explosion(e.x, e.y, C.amber, 42, 460, 1.7);
  explosion(e.x, e.y, C.pink, 38, 540, 1.5);
  explosion(e.x, e.y, '#ff5030', 30, 420, 1.6);
  explosion(e.x, e.y, C.white, 30, 700, 1.1);
  explosion(e.x, e.y, accent, 24, 520, 1.4);
  explosion(e.x, e.y, '#401510', 22, 380, 2.2);

  shockwave(e.x, e.y, C.white, 340, 0.75);
  shockwave(e.x, e.y, C.amber, 240, 0.6);
  shockwave(e.x, e.y, accent, 480, 1.0);
  shockwave(e.x, e.y, C.pink, 620, 1.3);
  shockwave(e.x, e.y, C.white, 780, 1.6);

  for (let i = 0; i < 46; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 130 + Math.random() * 620;
    const long = Math.random() < 0.3;
    planeFragments.push({
      x: e.x + (Math.random() - 0.5) * 70,
      y: e.y + (Math.random() - 0.5) * 140,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 100,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 26,
      size: 3 + Math.random() * 13,
      color: fragColors[Math.floor(Math.random() * fragColors.length)],
      points: long ? 4 : 3 + Math.floor(Math.random() * 4),
      life: 1.9 + Math.random() * 1.8,
      max: 3.7,
      glow: Math.random() < 0.35,
      edge: Math.random() < 0.6,
      isPanel: Math.random() < 0.25,
      panelW: 6 + Math.random() * 14,
      panelH: 2 + Math.random() * 5,
      trail: [],
    });
  }

  for (let i = 0; i < 34; i++) {
    spawnEngineTrail(
      e.x + (Math.random() - 0.5) * 80,
      e.y + (Math.random() - 0.5) * 110,
      Math.random() < 0.33 ? C.amber : (Math.random() < 0.5 ? C.pink : '#ff8030')
    );
  }
  for (let i = 0; i < 20; i++) {
    spawnSmokePuff(
      e.x + (Math.random() - 0.5) * 60,
      e.y + (Math.random() - 0.5) * 60,
      0.8 + Math.random() * 0.9
    );
  }

  debrisBurst(e.x, e.y, C.cyanDark, 16);
  debrisBurst(e.x, e.y, C.amber, 12);
  debrisBurst(e.x, e.y, C.pink, 10);
  debrisBurst(e.x, e.y, '#606870', 12);

  for (let i = 0; i < 3; i++) spawnHeatDistortion(e.x, e.y, 60 + i * 40);

  state.shake = Math.max(state.shake, 12);
  state.flashGreen = Math.max(state.flashGreen, 0.6);
  state.flashRed   = Math.max(state.flashRed, 0.35);

  noiseBurst(1.2, 0.26, 700);
  noiseBurst(0.6, 0.20, 1800);
  noiseBurst(0.3, 0.15, 3200);
  tone(120, 0.7, 'sawtooth', 0.15, 30);
  tone(240, 0.45, 'square', 0.09, 55);
  tone(90,  1.0, 'sine',    0.12, 22, 0.06);
  tone(1600, 0.15, 'sine',  0.05, 400, 0.02);
}

/* ═══ FIRE ═══ */
function fire(idx) {
  if (state.mode !== 'playing' || state.locked || !state.roundActive) return;
  const e = enemies[idx];
  if (!e || !e.alive || e.dying > 0 || e.launching || e.fleeing) return;
  state.locked = true;
  const shots = player.weaponLevel;
  for (let s = 0; s < shots; s++) {
    const spread = (s - (shots-1)/2) * 22;
    bullets.push({ x: player.x + spread, y: player.y - 40, target: e, speed: 2000, trail: [], life: 0 });
  }
  for (let i = 0; i < 8; i++) {
    particles.push({ x: player.x, y: player.y - 30, vx: (Math.random()-0.5)*120, vy: -Math.random()*180, life: 0.15, max: 0.15, size: 3+Math.random()*3, color: C.cyan, glow: true });
  }
  spawnHeatDistortion(player.x, player.y - 40, 30);
  tone(1200, 0.06, 'sawtooth', 0.035, 400);
  tone(2200, 0.04, 'square', 0.022, 800);
}

/* ═══ RESOLVE HIT ═══ */
function resolveHit(bullet, enemy) {
  if (enemy.correct) {
    if (enemy.hp > 1) {
      enemy.hp--; enemy.flash = 0.2;
      explosion(enemy.x, enemy.y, C.amber, 20, 240);
      spawnSmokePuff(enemy.x, enemy.y, 0.6);
      tone(600, 0.08, 'square', 0.05);
      state.locked = false;
      return;
    }
    state.hitCorrect++; state.correctCount++; state.streak++;
    state.comboMeter = Math.min(100, state.comboMeter + 22);
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const timeBonus = Math.floor(state.timeLeft * 8);
    const streakBonus = state.streak >= 2 ? state.streak * 75 : 0;
    const comboBonus = state.comboMeter >= 100 ? 500 : 0;
    const gained = 100 + timeBonus + streakBonus + comboBonus;
    state.score += gained;

    qShip.state = 'leaving';
    qShip.leaveVx = (Math.random() - 0.5) * 200;
    qShip.leaveVy = -50;
    qShip.engineGlow = 1;
    explosion(qShip.x, qShip.y, C.lime, 40, 360, 1.3);
    shockwave(qShip.x, qShip.y, C.lime, 260, 0.8);

    enemies.forEach(o => {
      if (o !== enemy && o.alive && o.dying <= 0 && !o.launching && !o.fleeing) {
        o.fleeing = true;
        const dirX = o.baseX < W / 2 ? -1 : 1;
        o.fleeVx = dirX * (180 + Math.random() * 220);
        o.fleeVy = -(300 + Math.random() * 250);
        o.fleeSpin = dirX * (1.2 + Math.random() * 1.5);
        o.fleeRot = 0;
        o.bankTarget = dirX * 0.9;
        o.panelScale = 0;
        for (let k = 0; k < 8; k++) {
          spawnEngineTrail(o.x + (Math.random()-0.5)*20, o.y + 20, C.cyan);
        }
      }
    });

    enemy.panelFlash = 0.6;
    destroyEnemyPlane(enemy);
    enemy.alive = false;
    enemy.launching = false;
    enemy.dying = 0.001;

    tone(880, 0.08, 'square', 0.07);
    tone(1320, 0.14, 'sine', 0.055, 1980, 0.04);
    tone(1760, 0.22, 'sine', 0.045, 2640, 0.09);

    let msg = `✓ +${gained}`;
    if (streakBonus) msg += `  [COMBO ×${state.streak}]`;
    if (comboBonus) msg += `  ⚡ OVERDRIVE!`;
    toast(msg, C.lime);
    popup(enemy.x, enemy.y, `+${gained}`, C.lime, 26);

    const newTier = Math.min(5, Math.floor(state.correctCount / 3) + 1);
    if (newTier > player.tier) {
      player.tier = newTier;
      player.tierFlash = 1.2;
      toast(`⬆  PESAWAT UPGRADE — TIER ${newTier}!`, C.cyan);
      explosion(player.x, player.y, C.cyan, 45, 420, 1.5);
      explosion(player.x, player.y, C.purple, 30, 300, 1.8);
      shockwave(player.x, player.y, C.cyan, 220, 0.9);
      shockwave(player.x, player.y, C.magenta, 300, 1.2);
      state.flashBlue = 0.8;
      tone(440, 0.12, 'triangle', 0.07);
      tone(660, 0.15, 'triangle', 0.07, null, 0.1);
      tone(880, 0.2, 'triangle', 0.07, null, 0.22);
      tone(1320, 0.32, 'sine', 0.06, null, 0.36);
    }

    if (state.comboMeter >= 100) {
      state.comboMeter = 0;
      player.overdrive = 6;
      player.weaponLevel = Math.min(3, player.weaponLevel + 1);
      state.flashBlue = 0.7;
      toast('⚡ OVERDRIVE AKTIF!', C.cyan);
      tone(440, 0.15, 'sine', 0.06);
      tone(660, 0.2, 'sine', 0.06, 880, 0.1);
      tone(990, 0.26, 'sine', 0.05, 1320, 0.2);
    }
    state.roundActive = false;
    state.nextRoundIn = 1.35;

    const newLevel = Math.floor(state.correctCount / 4) + 1;
    if (newLevel > state.level) {
      state.level = newLevel;
      toast(`◆ LEVEL ${state.level} ◆`, C.amber);
      tone(660, 0.12, 'triangle', 0.055);
      tone(990, 0.16, 'triangle', 0.055, null, 0.12);
      tone(1320, 0.22, 'triangle', 0.055, null, 0.26);
    }
  } else {
    state.hitWrong++; state.streak = 0;
    state.comboMeter = Math.max(0, state.comboMeter - 30);
    enemy.launching = true; enemy.launchVy = 400; enemy.panelFlash = 0.5;

    if (state.shield > 0) {
      state.shield = Math.max(0, state.shield - 55);
      if (state.shield === 0) { toast('⚠ PERISAI HANCUR!', C.amber); state.flashBlue = 0.8; }
      else toast('✗ SALAH — Perisai diserap!', C.amber);
      explosion(enemy.x, enemy.y, C.amber, 30, 300);
      shockwave(enemy.x, enemy.y, C.amber, 120, 0.5);
      spawnSmokePuff(enemy.x, enemy.y, 0.5);
      tone(180, 0.25, 'sawtooth', 0.07, 60);
      noiseBurst(0.35, 0.13);
      state.shake = Math.max(state.shake, 4);
      state.locked = false;
      const remaining = enemies.filter(o => o.alive && o.dying <= 0 && !o.launching && !o.fleeing);
      if (remaining.length <= 1) { state.roundActive = false; state.nextRoundIn = 1.15; }
    } else {
      state.hp--;
      explosion(enemy.x, enemy.y, C.pink, 34, 340);
      shockwave(enemy.x, enemy.y, C.pink, 140, 0.6);
      debrisBurst(enemy.x, enemy.y, C.purpleDeep, 8);
      spawnSmokePuff(enemy.x, enemy.y, 0.7);
      tone(160, 0.4, 'sawtooth', 0.09, 40);
      noiseBurst(0.5, 0.16);
      state.flashRed = 0.7; state.shake = Math.max(state.shake, 7);
      toast('✗ SALAH! -1 Energi', C.pink);
      state.locked = false;
      if (state.hp <= 0) { endGame(); return; }
      const remaining = enemies.filter(o => o.alive && o.dying <= 0 && !o.launching && !o.fleeing);
      if (remaining.length <= 1) { state.roundActive = false; state.nextRoundIn = 1.15; }
    }
  }
}

function endGame() {
  state.mode = 'over'; state.roundActive = false; state.locked = true;
  state.shake = 10;
  explosion(player.x, player.y, C.amber, 80, 500, 1.5);
  explosion(player.x, player.y, C.white, 40, 600, 1);
  shockwave(player.x, player.y, C.amber, 240, 0.9);
  debrisBurst(player.x, player.y, C.purpleDeep, 16);
  noiseBurst(1.2, 0.2);
  tone(220, 0.9, 'sawtooth', 0.1, 30);
}

function timeUp() {
  qShip.state = 'exploding';
  qShip.explodeT = 0; qShip.explodeRingR = 0; qShip.explodeRingR2 = 0;
  const qx = qShip.x, qy = qShip.y;

  explosion(qx, qy, C.pink, 60, 550, 1.7);
  explosion(qx, qy, C.white, 40, 700, 1.1);
  shockwave(qx, qy, C.white, 400, 1.2);
  shockwave(qx, qy, C.pink, 500, 1.5);
  debrisBurst(qx, qy, C.purpleDeep, 40);
  debrisBurst(qx, qy, C.pink, 30);
  for (let i = 0; i < 30; i++) spawnSmokePuff(qx + (Math.random()-0.5)*200, qy + (Math.random()-0.5)*100, 1.2);

  state.shake = Math.max(state.shake, 14);
  state.flashRed = 1.0; state.flashBlue = 0.5;
  noiseBurst(1.5, 0.32, 700);
  noiseBurst(1.0, 0.26, 1400);
  tone(180, 1.0, 'sawtooth', 0.15, 30);
  tone(90, 1.4, 'sine', 0.13, 25, 0.08);
  tone(440, 0.7, 'square', 0.09, 80, 0.2);

  enemies.forEach((o, i) => {
    if (o.alive && o.dying <= 0 && !o.launching && !o.fleeing) {
      o.launching = true;
      o.launchVy = 500 + Math.random()*400 + i * 30;
      o.panelFlash = 0.6;
      explosion(o.x, o.y, C.pink, 24, 280);
      debrisBurst(o.x, o.y, C.purpleDeep, 8);
    }
  });

  if (state.shield > 0) {
    state.shield = 0; state.flashBlue = 0.9;
    toast('💥 SKUADRON F16 MENEROBOS! Perisai jatuh!', C.amber);
  } else {
    state.hp--;
    toast('💥 SKUADRON F16 MENEROBOS! -1 Energi', C.pink);
  }
  state.streak = 0;
  state.comboMeter = Math.max(0, state.comboMeter - 40);
  state.roundActive = false; state.locked = true;
  if (state.hp <= 0) setTimeout(() => endGame(), 900);
  else state.nextRoundIn = 2.2;
}

/* ═══ UPDATE ═══ */
function update(dt) {
  state.gameTime += dt;
  const starMult = state.mode === 'playing' ? 1 : 0.35;
  for (const s of stars) {
    s.y += s.v * dt * starMult;
    s.twinkle += dt * 3;
    if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
  }
  for (const n of nebulaClouds) {
    n.y += n.v * dt * 0.3;
    n.hue = (n.hue + dt * 4) % 360;
    if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random() * W; }
  }
  for (let i = 0; i < spaceObjects.length; i++) {
    const o = spaceObjects[i];
    o.y += o.v * dt * starMult;
    o.rot += o.rotV * dt;
    if (o.y - o.size * 2 > H) spaceObjects[i] = makeSpaceObject(true);
  }

  const dx = player.targetX - player.x;
  player.vx = lerp(player.vx, dx * 10, Math.min(1, dt * 12));
  player.x = lerp(player.x, player.targetX, Math.min(1, dt * 12));
  const targetBank = clamp(-player.vx * 0.0012, -0.5, 0.5);
  player.bank = lerp(player.bank, targetBank, Math.min(1, dt * 10));

  player.enginePulse += dt * 28;
  player.shieldPhase += dt * 2.4;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.tierFlash > 0) player.tierFlash -= dt;
  if (player.overdrive > 0) {
    player.overdrive -= dt;
    if (player.overdrive <= 0) player.weaponLevel = 1;
  }
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 70);
  if (state.flashRed > 0) state.flashRed = Math.max(0, state.flashRed - dt * 1.5);
  if (state.flashGreen > 0) state.flashGreen = Math.max(0, state.flashGreen - dt * 1.8);
  if (state.flashBlue > 0) state.flashBlue = Math.max(0, state.flashBlue - dt * 1.5);
  if (state.toastTimer > 0) state.toastTimer -= dt;
  state.qPanelSlide = Math.min(1, state.qPanelSlide + dt * 3);

  updateQShip(dt);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.955; p.vy *= 0.955; p.vy += 55 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt;
    sw.r = lerp(6, sw.maxR, 1 - sw.life / sw.maxLife);
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vy += 280 * dt; d.rot += d.rotV * dt;
    d.life -= dt;
    if (d.life <= 0 || d.y > H + 50) debris.splice(i, 1);
  }
  for (let i = qShipDebris.length - 1; i >= 0; i--) {
    const d = qShipDebris[i];
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vx *= 0.97; d.vy *= 0.97; d.vy += 40 * dt;
    d.rot += d.rotV * dt; d.life -= dt;
    if (d.life <= 0) qShipDebris.splice(i, 1);
  }

  for (let i = planeFragments.length - 1; i >= 0; i--) {
    const f = planeFragments[i];
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.vx *= 0.985;
    f.vy *= 0.985;
    f.vy += 220 * dt;
    f.rot += f.rotV * dt;
    f.life -= dt;
    if (f.life <= 0 || f.y > H + 90) planeFragments.splice(i, 1);
  }

  for (let i = smokePuffs.length - 1; i >= 0; i--) {
    const s = smokePuffs[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy -= 8 * dt;
    s.vx *= 0.98;
    s.size += 18 * dt;
    s.rot += s.rotV * dt;
    s.life -= dt;
    s.alpha = Math.max(0, (s.life / s.max) * 0.55);
    if (s.life <= 0) smokePuffs.splice(i, 1);
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y += p.vy * dt; p.vy *= 0.95; p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
  for (let i = engineTrails.length - 1; i >= 0; i--) {
    const t = engineTrails[i];
    t.x += t.vx * dt; t.y += t.vy * dt; t.life -= dt;
    if (t.life <= 0) engineTrails.splice(i, 1);
  }
  for (let i = heatDistortions.length - 1; i >= 0; i--) {
    const hd = heatDistortions[i];
    hd.life -= dt; hd.r += 40 * dt;
    if (hd.life <= 0) heatDistortions.splice(i, 1);
  }

  if (state.mode !== 'playing') return;

  if (state.shield < state.maxShield && state.roundActive && !state.locked) {
    state.shield = Math.min(state.maxShield, state.shield + dt * 8);
  }

  if (state.roundActive && !state.locked && qShip.state === 'hovering') {
    state.timeLeft -= dt;
    qShip.chargeLevel = 1 - state.timeLeft / state.timeMax;
    const progress = 1 - state.timeLeft / state.timeMax;
    const descentY = SHIP_Y_START + progress * SHIP_TOTAL_DESCENT;

    for (const e of enemies) {
      if (e.alive && e.dying <= 0 && !e.launching && !e.fleeing) {
        e.baseY = descentY;
      }
    }
    if (state.timeLeft <= 0) { state.timeLeft = 0; timeUp(); }
  }

  for (const e of enemies) {
    e.engine += dt * 8;
    if (e.panelFlash > 0) e.panelFlash -= dt;

    if (!e.fleeing && !e.launching && e.dying <= 0 && e.alive) {
      e.bankTarget = 0;
    }
    e.bank = lerp(e.bank, e.bankTarget, Math.min(1, dt * 4));

    if (e.fleeing) {
      e.fleeVy -= 400 * dt;
      e.fleeVx *= 1.012;
      e.x += e.fleeVx * dt;
      e.y += e.fleeVy * dt;
      e.fleeRot += e.fleeSpin * dt;
      e.rot = e.fleeRot;
      e.bankTarget = e.fleeVx > 0 ? 0.9 : -0.9;
      if (Math.random() < 0.7) {
        spawnEngineTrail(e.x + (Math.random()-0.5)*18, e.y + 20, C.cyan);
      }
      if (Math.random() < 0.35) {
        spawnSmokePuff(e.x, e.y + 10, 0.4);
      }
      if (e.y < -300 || e.x < -320 || e.x > W + 320) {
        e.alive = false;
      }
      continue;
    }

    if (e.launching) {
      e.launchVy += 1400 * dt;
      e.y += e.launchVy * dt;
      e.launchSpin += dt * 5;
      e.rot = e.launchSpin * (e.correct ? -1 : 1);
      e.bankTarget = e.launchSpin * 0.3;
      if (Math.random() < 0.75) spawnEngineTrail(e.x + (Math.random()-0.5)*30, e.y - 30, e.correct ? C.lime : C.pink);
      if (Math.random() < 0.5) spawnSmokePuff(e.x, e.y, 0.5);
      if ((e.y > H + 60 || e.y < -200) && e.alive) {
        e.alive = false; e.dying = 0.3;
        const ey = clamp(e.y, 30, H - 30);
        explosion(e.x, ey, e.correct ? C.lime : C.pink, 30, 280);
        shockwave(e.x, ey, e.correct ? C.lime : C.pink, 100, 0.4);
      }
      continue;
    }

    if (e.dying > 0) {
      e.dying -= dt;
      e.scale = Math.max(0, e.dying / 0.7);
      e.rot += dt * 5;
      continue;
    }
    if (!e.alive) continue;

    if (e.y < e.baseY - 0.5) {
      e.y = Math.min(e.baseY, e.y + 700 * dt);
    } else if (e.y > e.baseY + 0.5) {
      e.y = Math.max(e.baseY, e.y - 700 * dt);
    } else {
      e.y = e.baseY;
      e.x = e.baseX;
      e.rot = 0;
    }

    e.panelScale = Math.min(1, e.panelScale + dt * 4);
    if (e.flash > 0) e.flash -= dt;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const target = b.target;
    if (!target || (!target.alive && target.dying <= 0 && !target.launching && !target.fleeing)) {
      bullets.splice(i, 1); continue;
    }
    const tx = target.x, ty = target.y;
    const dx = tx - b.x, dy = ty - b.y;
    const d = Math.hypot(dx, dy) || 1;
    const step = b.speed * dt;
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 16) b.trail.shift();
    b.life += dt;
    if (d <= step) {
      b.x = tx; b.y = ty;
      bullets.splice(i, 1);
      resolveHit(b, target);
    } else {
      b.x += (dx / d) * step;
      b.y += (dy / d) * step;
    }
  }

  if (state.nextRoundIn > 0) {
    state.nextRoundIn -= dt;
    if (state.nextRoundIn <= 0) {
      if (state.hp > 0 && state.mode === 'playing') newRound();
    }
  }
}

function updateQShip(dt) {
  qShip.reactorPulse += dt * 4;
  qShip.ringAngle += dt * 0.5;
  qShip.ringAngle2 -= dt * 0.9;
  qShip.thrusterPulse += dt * 20;

  if (qShip.state === 'entering') {
    qShip.entryT += dt;
    const t = Math.min(1, qShip.entryT / 1.3);
    const ease = 1 - Math.pow(1 - t, 3);
    qShip.y = lerp(qShip.entryY, qShip.baseY, ease);
    if (t >= 1) { qShip.state = 'hovering'; qShip.hoverT = 0; }
  } else if (qShip.state === 'hovering') {
    qShip.hoverT += dt;
    qShip.y = qShip.baseY;
    const ratio = state.timeLeft / state.timeMax;
    if (ratio < 0.4) {
      const urgency = 1 - ratio / 0.4;
      qShip.alarmPulse = 0.5 + Math.sin(state.gameTime * (8 + urgency * 14)) * 0.5;
    } else qShip.alarmPulse = 0;
    if (Math.random() < 0.9) {
      for (let i = 0; i < 2; i++) spawnEngineTrail(qShip.x + (Math.random()-0.5)*520, qShip.y + 95, qShip.chargeLevel > 0.7 ? C.amber : C.cyan);
    }
  } else if (qShip.state === 'leaving') {
    qShip.leaveVx *= 1.03;
    qShip.x += qShip.leaveVx * dt;
    qShip.y += qShip.leaveVy * dt;
    qShip.leaveVy -= 30 * dt;
    qShip.rotZ = lerp(qShip.rotZ, qShip.leaveVx * 0.0004, dt * 3);
    qShip.engineGlow = Math.max(0, qShip.engineGlow - dt * 0.8);
    for (let i = 0; i < 4; i++) spawnEngineTrail(qShip.x + (Math.random()-0.5)*560, qShip.y + 100, C.cyan);
  } else if (qShip.state === 'exploding') {
    qShip.explodeT += dt;
    qShip.explodeRingR = lerp(0, 600, Math.min(1, qShip.explodeT / 1.5));
    qShip.explodeRingR2 = lerp(0, 800, Math.min(1, qShip.explodeT / 2.0));
    if (qShip.explodeT < 1.4 && Math.random() < 0.7) {

function drawBackground() {
  const g = ctx.createRadialGradient(W/2, H*0.3, 80, W/2, H*0.5, H*1.2);
  g.addColorStop(0, '#150a30'); g.addColorStop(0.35, '#0a0420');
  g.addColorStop(0.7, '#050110'); g.addColorStop(1, '#020005');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const n of nebulaClouds) {
    const rg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    rg.addColorStop(0, `hsla(${n.hue}, 90%, 55%, ${n.a * 1.3})`);
    rg.addColorStop(0.5, `hsla(${(n.hue + 60) % 360}, 80%, 45%, ${n.a * 0.6})`);
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  drawSpaceObjects();

  for (const s of stars) {
    const tw = 0.85 + Math.sin(s.twinkle) * 0.15;
    ctx.globalAlpha = s.a * tw;
    if (s.layer === 2) { ctx.fillStyle = C.white; ctx.shadowColor = C.cyan; ctx.shadowBlur = 8; }
    else if (s.layer === 1) { ctx.fillStyle = '#dfeaff'; ctx.shadowBlur = 0; }
    else { ctx.fillStyle = '#6a5a9a'; ctx.shadowBlur = 0; }
    ctx.fillRect(s.x, s.y, s.s, s.s * 1.5);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  ctx.save();
  const gridGrad = ctx.createLinearGradient(0, 380, 0, H);
  gridGrad.addColorStop(0, hex2rgba(C.cyan, 0));
  gridGrad.addColorStop(1, hex2rgba(C.cyan, 0.15));
  ctx.strokeStyle = gridGrad; ctx.lineWidth = 1;
  for (let i = 0; i < 12; i++) { const y = 380 + i * 32; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const vGrad = ctx.createLinearGradient(0, 380, 0, H);
  vGrad.addColorStop(0, hex2rgba(C.magenta, 0));
  vGrad.addColorStop(1, hex2rgba(C.magenta, 0.12));

  for (let i = -7; i <= 7; i++) { ctx.beginPath(); ctx.moveTo(W/2 + i*40, 380); ctx.lineTo(W/2 + i*260, H); ctx.stroke(); }
  ctx.restore();
}

function drawQShip() {

  if (qShip.state === 'exploding') {
    const t1 = Math.min(1, qShip.explodeT / 1.5);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    ctx.shadowColor = C.white; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(cx, cy, qShip.explodeRingR, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = (1 - t2) * 0.7;
    ctx.strokeStyle = C.pink; ctx.lineWidth = 18 * (1 - t2) + 2;
    ctx.shadowColor = C.pink; ctx.shadowBlur = 50;
    ctx.beginPath(); ctx.arc(cx, cy, qShip.explodeRingR2, 0, Math.PI*2); ctx.stroke();

    const coreT = Math.min(1, qShip.explodeT / 1.1);
    const coreR = lerp(0, 380, 1 - Math.pow(1 - coreT, 2.2));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1 - coreT;
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    cg.addColorStop(0, C.white); cg.addColorStop(0.2, '#ffd0ee');

    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  ctx.save();

  ctx.save();

  ambient.addColorStop(1, 'transparent');
  ctx.fillStyle = ambient;
  ctx.beginPath(); ctx.arc(0, 0, 520, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.lineWidth = 2; ctx.shadowColor = C.cyan; ctx.shadowBlur = 20;

  ctx.moveTo(panelX + 12, panelY + cLen); ctx.lineTo(panelX + 12, panelY + 12); ctx.lineTo(panelX + cLen, panelY + 12);
  ctx.moveTo(panelX + panelW - cLen, panelY + 12); ctx.lineTo(panelX + panelW - 12, panelY + 12); ctx.lineTo(panelX + panelW - 12, panelY + cLen);
  ctx.moveTo(panelX + 12, panelY + panelH - cLen); ctx.lineTo(panelX + 12, panelY + panelH - 12); ctx.lineTo(panelX + cLen, panelY + panelH - 12);
  ctx.moveTo(panelX + panelW - cLen, panelY + panelH - 12); ctx.lineTo(panelX + panelW - 12, panelY + panelH - 12); ctx.lineTo(panelX + panelW - 12, panelY + panelH - cLen);
  ctx.stroke();
  ctx.restore();

  const scanY = panelY + ((state.gameTime * 120) % panelH);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const scanGrad = ctx.createLinearGradient(0, scanY - 20, 0, scanY + 20);
  scanGrad.addColorStop(0, 'transparent');
  scanGrad.addColorStop(0.5, hex2rgba(C.magenta, 0.18));
  scanGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = scanGrad;
  ctx.fillRect(panelX + 4, scanY - 20, panelW - 8, 40);
  ctx.restore();

  ctx.font = `bold ${fHead}px "Consolas", monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = C.magenta;
  ctx.shadowColor = C.magenta; ctx.shadowBlur = 10;
  ctx.fillText('◈ PERTANYAAN PERANG DUNIA I (1914–1918)', panelX + 26, panelY + 12);
  ctx.shadowBlur = 0;

  const pulse = 0.5 + Math.sin(state.gameTime * 5) * 0.5;
  ctx.globalAlpha = pulse;
  ctx.beginPath(); ctx.arc(panelX + panelW - 30, panelY + 18, 5, 0, Math.PI*2);
  ctx.fillStyle = C.lime;
  ctx.shadowColor = C.lime; ctx.shadowBlur = 14; ctx.fill();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  ctx.font = `bold ${fs(10, 1.45)}px "Consolas", monospace`;
  ctx.textAlign = 'right';
  ctx.fillStyle = C.lime;
  ctx.fillText('AKTIF', panelX + panelW - 42, panelY + 14);

  const font = `bold ${fQ}px system-ui, sans-serif`;
  const lines = wrapText(currentQuestion.q, panelW - 70, font);
  ctx.font = font;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.white;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 12;
  const regionTop = panelY + 12 + fHead + 10;
  const regionBot = panelY + panelH - 20;
  const textCY = (regionTop + regionBot) / 2;
  const startY = textCY - ((lines.length - 1) * lh) / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, W/2, startY + i * lh));
  ctx.shadowBlur = 0;

  const tBarX = panelX + 30;
  const tBarY = panelY + panelH - 14;
  const tBarW = panelW - 60;
  const tBarH = 7;

  roundRect(ctx, tBarX, tBarY, tBarW, tBarH, 3.5);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)'; ctx.fill();

  const tRatio = clamp(state.timeLeft / state.timeMax, 0, 1);
  const barColor = tRatio > 0.5 ? C.lime : tRatio > 0.25 ? C.amber : C.pink;
  if (tRatio > 0) {
    roundRect(ctx, tBarX, tBarY, tBarW * tRatio, tBarH, 3.5);
    ctx.fillStyle = barColor;
    ctx.shadowColor = barColor; ctx.shadowBlur = 18; ctx.fill();
    ctx.shadowBlur = 0;
    const edgeX = tBarX + tBarW * tRatio;
    ctx.beginPath(); ctx.arc(edgeX, tBarY + tBarH/2, 5.5, 0, Math.PI*2);
    ctx.fillStyle = C.white;
    ctx.shadowColor = barColor; ctx.shadowBlur = 20; ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.font = `bold ${fTime}px "Consolas", monospace`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = barColor;
  ctx.shadowColor = barColor; ctx.shadowBlur = 10;
  ctx.fillText(state.timeLeft.toFixed(1) + 's', panelX + panelW - 30, panelY + 36);
  ctx.shadowBlur = 0;
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   F-16 FIGHTING FALCON — REALISTIS
   ═══════════════════════════════════════════════════════════════ */
function drawEnemyShip(e) {
  if (!e.alive && e.dying <= 0 && !e.launching && !e.fleeing) return;
  const sc = e.dying > 0 ? e.scale : 1;
  if (sc <= 0.01) return;

  const isHit = e.flash > 0;
  const accentColors = [C.cyan, C.magenta, C.lime, C.amber];
  const accent = accentColors[e.type] || C.cyan;

  const schemes = [
    { hi:'#d4dce4', mid:'#8895a3', lo:'#485566', dark:'#1c2634' },
    { hi:'#e0d4dc', mid:'#a38895', lo:'#664855', dark:'#341c26' },
    { hi:'#d4e0d8', mid:'#88a395', lo:'#486656', dark:'#1c3426' },
    { hi:'#e0dcd4', mid:'#a39588', lo:'#665648', dark:'#342a1c' },
  ];
  const s = schemes[e.type] || schemes[0];
  const hullLight = isHit ? '#ff7060' : s.hi;
  const hullMid   = isHit ? '#a83028' : s.mid;
  const hullDark  = isHit ? '#501015' : s.lo;
  const hullDeep  = isHit ? '#2a0508' : s.dark;
  const panelLine = isHit ? 'rgba(255,90,80,0.55)' : 'rgba(45,60,80,0.6)';

  const totalScale = sc * ENEMY_SCALE;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.rot + e.bank * 0.35);
  ctx.scale(totalScale, totalScale);
  ctx.globalAlpha = sc;

  const glow = isHit ? C.pink : accent;
  const flick = 0.75 + Math.sin(e.engine) * 0.25;
  const isLaunch = e.launching;
  const isFleeing = e.fleeing;
  const boost = isLaunch ? 2.2 : (isFleeing ? 1.8 : 1.0);

  const flameLen = (36 + Math.sin(e.engine * 1.4) * 8) * flick * boost;
  const fg = ctx.createLinearGradient(0, -60, 0, -60 - flameLen);
  if (isHit) {
    fg.addColorStop(0, 'rgba(255,255,255,0.98)');
    fg.addColorStop(0.25, 'rgba(255,140,100,0.95)');
    fg.addColorStop(0.6, 'rgba(200,60,80,0.55)');
    fg.addColorStop(1, 'transparent');
  } else if (isLaunch || isFleeing) {
    fg.addColorStop(0, 'rgba(255,255,255,0.98)');
    fg.addColorStop(0.2, 'rgba(150,230,255,0.95)');
    fg.addColorStop(0.5, 'rgba(70,150,250,0.7)');
    fg.addColorStop(0.8, 'rgba(90,70,230,0.35)');
    fg.addColorStop(1, 'transparent');
  } else {
    fg.addColorStop(0, 'rgba(255,255,255,0.98)');
    fg.addColorStop(0.2, 'rgba(180,215,255,0.95)');
    fg.addColorStop(0.5, 'rgba(110,150,255,0.7)');
    fg.addColorStop(0.8, 'rgba(140,80,230,0.35)');
    fg.addColorStop(1, 'transparent');
  }
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-8, -58); ctx.lineTo(0, -58 - flameLen); ctx.lineTo(8, -58);
  ctx.closePath(); ctx.fill();

  for (let i = 0; i < 5; i++) {
    const t = (i + 0.5) / 5;
    const y = -58 - flameLen * t;
    const w = 4.5 * (1 - t) + 1.5;
    ctx.fillStyle = `rgba(255,255,255,${0.65 * (1 - t)})`;
    ctx.beginPath();
    ctx.ellipse(0, y, w, w * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const coreLen = flameLen * 0.5;
  const cgCore = ctx.createLinearGradient(0, -58, 0, -58 - coreLen);
  cgCore.addColorStop(0, 'rgba(255,255,255,1)');
  cgCore.addColorStop(0.4, isHit ? 'rgba(255,190,120,0.85)' : 'rgba(210,235,255,0.75)');
  cgCore.addColorStop(1, 'transparent');
  ctx.fillStyle = cgCore;
  ctx.beginPath();
  ctx.moveTo(-3, -58); ctx.lineTo(0, -58 - coreLen); ctx.lineTo(3, -58);
  ctx.closePath(); ctx.fill();

  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const nx = Math.cos(a) * 8;
    const ny = Math.sin(a) * 3.5 - 58;

    ctx.moveTo(nx * 0.6, ny + 1.5);
    ctx.lineTo(nx, ny);
    ctx.lineTo(nx * 0.7, ny - 1.5);

  ctx.beginPath();
  ctx.ellipse(0, -58, 9, 3.8, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#0a0c14'; ctx.fill();
  ctx.strokeStyle = isHit ? 'rgba(255,130,110,0.9)' : 'rgba(150,160,175,0.9)';
  ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, -58, 5.5, 2.2, 0, 0, Math.PI * 2);
  const nzg = ctx.createRadialGradient(0, -58, 0, 0, -58, 5.5);

    ctx.lineWidth = 0.7; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-2.5, -26);
  ctx.lineTo(-2, -44);
  ctx.lineTo(-1, -56);
  ctx.lineTo(0, -66);
  ctx.lineTo(1.5, -60);

  ctx.shadowBlur = 0;
  ctx.strokeStyle = isHit ? 'rgba(255,150,130,0.9)' : 'rgba(30,40,55,0.9)';

    ctx.fillStyle = hex2rgba(accent, 0.55);

  ctx.strokeStyle = panelLine; ctx.lineWidth = 0.4;
  ctx.beginPath(); ctx.moveTo(0.5, -60); ctx.lineTo(1.8, -30); ctx.stroke();

  for (const side of [-1, 1]) {

    ctx.strokeStyle = isHit ? 'rgba(255,150,130,0.8)' : 'rgba(30,40,55,0.8)';

  }

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 7, 18);
    ctx.lineTo(side * 15, 10);
    ctx.lineTo(side * 20, 4);
    ctx.lineTo(side * 34, -8);
    ctx.lineTo(side * 36, -12);

    ctx.lineTo(side * 84, -26);
    ctx.lineTo(side * 84, -22);
    ctx.lineTo(side * 78, -18);

    ctx.fillStyle = wingG;
    ctx.shadowColor = glow; ctx.shadowBlur = 10;

    ctx.shadowBlur = 0;

    ctx.strokeStyle = panelLine; ctx.lineWidth = 0.4;
    ctx.beginPath();
    ctx.moveTo(side * 20, -2); ctx.lineTo(side * 78, -20);
    ctx.moveTo(side * 26, 0);  ctx.lineTo(side * 76, -22);

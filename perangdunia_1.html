}

function drawRunningLights(charge) {
  ctx.save();
  const lightColor = charge > 0.6 ? '#ff60b0' : '#9ff8ff';
  ctx.fillStyle = lightColor;
  for (let i = -8; i <= 8; i++) {
    const x = i * 42;
    if (Math.abs(x) > 350) continue;
    const blink = 0.5 + Math.sin(state.gameTime * 2 + i * 0.7) * 0.5;
    ctx.globalAlpha = blink * 0.85;
    ctx.beginPath(); ctx.arc(x, 82, 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.white;
  for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.arc(i * 52, -46, 1.5, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();
}

function drawGreebles(charge) {
  ctx.save();
  ctx.globalAlpha = 0.8;
  const detailColor = charge > 0.6 ? '#7a1540' : '#1f1450';
  ctx.fillStyle = detailColor;
  const rects = [
    [-300, -15, 14, 8], [-240, -15, 12, 6], [-140, -15, 10, 8],
    [140, -15, 12, 6], [240, -15, 14, 8], [300, -15, 12, 6],
    [-180, 25, 20, 6], [-60, 25, 16, 6], [60, 25, 16, 6], [180, 25, 20, 6],
    [-320, 45, 10, 5], [320, 45, 10, 5],
  ];
  for (const [x, y, w, h] of rects) ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function drawQShipDebris() {
  for (const d of qShipDebris) {
    const a = Math.max(0, d.life / d.max);
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < d.points; i++) {
      const ang = (i/d.points)*Math.PI*2;
      const r = d.size * (0.55 + (i%2)*0.45);
      const px = Math.cos(ang)*r, py = Math.sin(ang)*r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* ═══ PANEL PERTANYAAN ═══ */
function drawQuestionPanel() {
  if (!currentQuestion) return;
  const slideIn = state.qPanelSlide;
  const slideEase = 1 - Math.pow(1 - slideIn, 3);
  const panelX = QP_X;
  const panelY = QP_Y + (1 - slideEase) * -140;
  const panelW = QP_W;
  const panelH = QP_H;
  const fHead = fs(12, 1.45);
  const fQ    = fs(27, 1.45);
  const fTime = fs(16, 1.5);
  const lh    = Math.round(fQ * 1.24);

  ctx.save();

  ctx.shadowColor = hex2rgba(C.magenta, 0.5); ctx.shadowBlur = 30;
  roundRect(ctx, panelX, panelY, panelW, panelH, 18);
  const bgGrad = ctx.createLinearGradient(panelX, panelY, panelX, panelY + panelH);
  bgGrad.addColorStop(0, 'rgba(28, 10, 55, 0.94)');
  bgGrad.addColorStop(0.4, 'rgba(14, 5, 38, 0.96)');
  bgGrad.addColorStop(1, 'rgba(8, 2, 24, 0.97)');
  ctx.fillStyle = bgGrad; ctx.fill();
  ctx.shadowBlur = 0;

  const borderGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY + panelH);
  borderGrad.addColorStop(0, C.cyan);
  borderGrad.addColorStop(0.5, C.magenta);
  borderGrad.addColorStop(1, C.purple);
  ctx.strokeStyle = borderGrad; ctx.lineWidth = 2.8;
  roundRect(ctx, panelX, panelY, panelW, panelH, 18); ctx.stroke();

  ctx.strokeStyle = hex2rgba(C.cyan, 0.4); ctx.lineWidth = 1;
  roundRect(ctx, panelX + 4, panelY + 4, panelW - 8, panelH - 8, 15); ctx.stroke();

  ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.5;
  const cLen = 26;
  ctx.beginPath();
  ctx.moveTo(panelX + 12, panelY + cLen); ctx.lineTo(panelX + 12, panelY + 12); ctx.lineTo(panelX + cLen, panelY + 12);
  ctx.moveTo(panelX + panelW - cLen, panelY + 12); ctx.lineTo(panelX + panelW - 12, panelY + 12); ctx.lineTo(panelX + panelW - 12, panelY + cLen);
  ctx.moveTo(panelX + 12, panelY + panelH - cLen); ctx.lineTo(panelX + 12, panelY + panelH - 12); ctx.lineTo(panelX + cLen, panelY + panelH - 12);
  ctx.moveTo(panelX + panelW - cLen, panelY + panelH - 12); ctx.lineTo(panelX + panelW - 12, panelY + panelH - 12); ctx.lineTo(panelX + panelW - 12, panelY + panelH - cLen);
  ctx.stroke();

  const qNum = (state.correctCount % QUESTIONS_PER_LEVEL) + 1;
  ctx.font = `bold ${fHead}px "Consolas", monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = C.magenta;
  ctx.fillText(`◈ SOAL ${qNum}/${QUESTIONS_PER_LEVEL}  ·  LEVEL ${state.level}/${MAX_LEVEL}`, panelX + 26, panelY + 12);

  const pulse = 0.5 + Math.sin(state.gameTime * 5) * 0.5;
  ctx.globalAlpha = pulse;
  ctx.beginPath(); ctx.arc(panelX + panelW - 30, panelY + 18, 5, 0, Math.PI*2);
  ctx.fillStyle = C.lime; ctx.fill();
  ctx.globalAlpha = 1;

  ctx.font = `bold ${fs(11, 1.45)}px "Consolas", monospace`;
  ctx.textAlign = 'right';
  ctx.fillStyle = C.lime;
  ctx.fillText('AKTIF', panelX + panelW - 42, panelY + 14);

  const font = `bold ${fQ}px system-ui, sans-serif`;
  const lines = wrapText(currentQuestion.q, panelW - 70, font);
  ctx.font = font;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.white;
  const regionTop = panelY + 12 + fHead + 10;
  const regionBot = panelY + panelH - 20;
  const textCY = (regionTop + regionBot) / 2;
  const startY = textCY - ((lines.length - 1) * lh) / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, W/2, startY + i * lh));

  const tBarX = panelX + 30;
  const tBarY = panelY + panelH - 14;
  const tBarW = panelW - 60;
  const tBarH = 7;
  roundRect(ctx, tBarX, tBarY, tBarW, tBarH, 3.5);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)'; ctx.fill();
  const tRatio = clamp(state.timeLeft / state.timeMax, 0, 1);
  const barColor = tRatio > 0.5 ? C.lime : tRatio > 0.25 ? C.amber : C.pink;
  if (tRatio > 0) {
    roundRect(ctx, tBarX, tBarY, tBarW * tRatio, tBarH, 3.5);
    ctx.fillStyle = barColor;
    ctx.fill();
  }
  ctx.font = `bold ${fTime}px "Consolas", monospace`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = barColor;
  ctx.fillText(state.timeLeft.toFixed(1) + 's', panelX + panelW - 30, panelY + 34);
  ctx.restore();
}

/* ═══ F-16 MUSUH ═══ */
function drawEnemyShip(e) {
  if (!e.alive && e.dying <= 0 && !e.launching && !e.fleeing) return;
  const sc = e.dying > 0 ? e.scale : 1;
  if (sc <= 0.01) return;

  const isHit = e.flash > 0;
  const accentColors = ['#00d0ff', '#ff20b0', '#00e080', '#ffa020'];
  const accent = accentColors[e.type] || '#00d0ff';

  const schemes = [
    { hi:'#f0f4f8', mid:'#a8b4c0', lo:'#556270', dark:'#1e2a3a', outline:'#080a15' },
    { hi:'#f4eaf0', mid:'#bca8b4', lo:'#6a5560', dark:'#281e28', outline:'#0a0510' },
    { hi:'#eaf4ea', mid:'#a8bca8', lo:'#556a55', dark:'#1e281e', outline:'#051005' },
    { hi:'#f4f0ea', mid:'#bca8a0', lo:'#6a5c50', dark:'#282018', outline:'#100805' },
  ];
  const s = schemes[e.type] || schemes[0];
  const hullLight = isHit ? '#ff9080' : s.hi;
  const hullMid   = isHit ? '#c04030' : s.mid;
  const hullDark  = isHit ? '#701815' : s.lo;
  const hullDeep  = isHit ? '#300508' : s.dark;
  const outline   = isHit ? '#400008' : s.outline;

  const totalScale = sc * ENEMY_SCALE;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.rot + e.bank * 0.35);
  ctx.scale(totalScale, totalScale);
  ctx.globalAlpha = sc;

  const flick = 0.75 + Math.sin(e.engine) * 0.25;
  const isLaunch = e.launching;
  const isFleeing = e.fleeing;
  const boost = isLaunch ? 2.2 : (isFleeing ? 1.8 : 1.0);

  const flameLen = (42 + Math.sin(e.engine * 1.4) * 10) * flick * boost;
  const fg = ctx.createLinearGradient(0, -60, 0, -60 - flameLen);
  if (isHit) {
    fg.addColorStop(0, 'rgba(255,255,255,1)');
    fg.addColorStop(0.25, 'rgba(255,140,100,1)');
    fg.addColorStop(0.6, 'rgba(220,60,80,0.7)');
    fg.addColorStop(1, 'transparent');
  } else {
    fg.addColorStop(0, 'rgba(255,255,255,1)');
    fg.addColorStop(0.2, 'rgba(180,225,255,1)');
    fg.addColorStop(0.5, 'rgba(90,160,255,0.8)');
    fg.addColorStop(0.8, 'rgba(120,60,230,0.4)');
    fg.addColorStop(1, 'transparent');
  }
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-9, -58); ctx.lineTo(0, -58 - flameLen); ctx.lineTo(9, -58);
  ctx.closePath(); ctx.fill();

  for (let i = 0; i < 5; i++) {
    const t = (i + 0.5) / 5;
    const y = -58 - flameLen * t;
    const w = 4.5 * (1 - t) + 1.5;
    ctx.fillStyle = `rgba(255,255,255,${0.7 * (1 - t)})`;
    ctx.beginPath();
    ctx.ellipse(0, y, w, w * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.beginPath();
  ctx.ellipse(0, -58, 10, 4.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#08080f';
  ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, -58, 6, 2.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = isHit ? '#ff8060' : '#ffd090';
  ctx.fill();

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 8, -28);
    ctx.lineTo(side * 14, -32);
    ctx.lineTo(side * 46, -48);
    ctx.lineTo(side * 50, -52);
    ctx.lineTo(side * 48, -56);
    ctx.lineTo(side * 36, -52);
    ctx.lineTo(side * 12, -44);
    ctx.lineTo(side * 7, -34);
    ctx.closePath();
    const stabG = ctx.createLinearGradient(side * 50, -52, side * 8, -28);
    stabG.addColorStop(0, hullDark);
    stabG.addColorStop(0.5, hullMid);
    stabG.addColorStop(1, hullLight);
    ctx.fillStyle = stabG; ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.strokeStyle = outline; ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(side * 14, -34); ctx.lineTo(side * 42, -48);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(-3, -26);
  ctx.lineTo(-2.5, -44);
  ctx.lineTo(-1.5, -58);
  ctx.lineTo(0, -70);
  ctx.lineTo(2, -62);
  ctx.lineTo(3, -48);
  ctx.lineTo(3.5, -30);
  ctx.closePath();
  const finG = ctx.createLinearGradient(-3, -70, 3, -26);
  finG.addColorStop(0, hullLight);
  finG.addColorStop(0.4, hullMid);
  finG.addColorStop(0.85, hullDark);
  finG.addColorStop(1, hullDeep);
  ctx.fillStyle = finG;
  ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 1.6; ctx.stroke();
  if (!isHit) {
    ctx.fillStyle = outline;
    ctx.fillRect(-2, -54, 4, 2);
    ctx.fillRect(-2, -48, 4, 2);
    ctx.fillStyle = accent;
    ctx.fillRect(-2, -42, 4, 1.5);
  }

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 3, -22);
    ctx.lineTo(side * 10, -30);
    ctx.lineTo(side * 11, -26);
    ctx.lineTo(side * 4, -18);
    ctx.closePath();
    ctx.fillStyle = hullMid; ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 1.2; ctx.stroke();
  }

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 7, 18);
    ctx.lineTo(side * 15, 10);
    ctx.lineTo(side * 20, 4);
    ctx.lineTo(side * 34, -8);
    ctx.lineTo(side * 36, -12);
    ctx.lineTo(side * 82, -28);
    ctx.lineTo(side * 86, -26);
    ctx.lineTo(side * 86, -22);
    ctx.lineTo(side * 80, -18);
    ctx.lineTo(side * 22, -14);
    ctx.lineTo(side * 14, -18);
    ctx.closePath();
    const wingG = ctx.createLinearGradient(side * 86, -28, side * 8, 18);
    if (isHit) {
      wingG.addColorStop(0, '#701818');
      wingG.addColorStop(0.35, '#c04030');
      wingG.addColorStop(0.7, '#ff9080');
      wingG.addColorStop(1, '#601018');
    } else {
      wingG.addColorStop(0, hullDark);
      wingG.addColorStop(0.4, hullMid);
      wingG.addColorStop(0.75, hullLight);
      wingG.addColorStop(1, hullMid);
    }
    ctx.fillStyle = wingG; ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 1.8; ctx.stroke();

    ctx.strokeStyle = outline; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(side * 20, -2); ctx.lineTo(side * 80, -20);
    ctx.moveTo(side * 26, 0);  ctx.lineTo(side * 78, -22);
    ctx.moveTo(side * 32, -2); ctx.lineTo(side * 76, -24);
    ctx.stroke();

    ctx.strokeStyle = isHit ? '#ffd0c0' : '#ffffff';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(side * 20, 4);
    ctx.lineTo(side * 34, -8);
    ctx.lineTo(side * 36, -12);
    ctx.lineTo(side * 82, -28);
    ctx.stroke();

    if (!isHit) {
      const ix = side * 58, iy = -14;
      ctx.beginPath(); ctx.arc(ix, iy, 4.2, 0, Math.PI * 2);
      ctx.fillStyle = '#1a3a80';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 0.9; ctx.stroke();
      ctx.beginPath();
      for (let k = 0; k < 5; k++) {
        const ang = -Math.PI / 2 + k * (Math.PI * 2 / 5);
        const rx = Math.cos(ang) * 2.8, ry = Math.sin(ang) * 2.8;
        if (k === 0) ctx.moveTo(ix + rx, iy + ry);
        else ctx.lineTo(ix + rx, iy + ry);
        const ang2 = ang + Math.PI / 5;
        ctx.lineTo(ix + Math.cos(ang2) * 1.15, iy + Math.sin(ang2) * 1.15);
      }
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
  }

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 6, 34);
    ctx.lineTo(side * 10, 20);
    ctx.lineTo(side * 14, 10);
    ctx.lineTo(side * 16, 5);
    ctx.lineTo(side * 15, 10);
    ctx.lineTo(side * 9, 24);
    ctx.lineTo(side * 7, 34);
    ctx.closePath();
    const lerxG = ctx.createLinearGradient(side * 16, 5, side * 6, 34);
    lerxG.addColorStop(0, hullMid);
    lerxG.addColorStop(1, hullLight);
    ctx.fillStyle = lerxG; ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 1.2; ctx.stroke();
  }

  for (const side of [-1, 1]) {
    ctx.fillStyle = hullDeep;
    ctx.fillRect(side * 82 - 2, -22, 4, 6);
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1;
    ctx.strokeRect(side * 82 - 2, -22, 4, 6);

    ctx.beginPath();
    ctx.ellipse(side * 82, -20, 2.6, 11, 0, 0, Math.PI * 2);
    const mg = ctx.createLinearGradient(side * 79, 0, side * 85, 0);
    mg.addColorStop(0, '#607080');
    mg.addColorStop(0.4, '#f0f4f8');
    mg.addColorStop(0.7, '#a0a8b0');
    mg.addColorStop(1, '#3a4450');
    ctx.fillStyle = mg; ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(side * 82, -29, 1.8, 2.8, 0, 0, Math.PI * 2);
    ctx.fillStyle = isHit ? '#ff4040' : '#201820';
    ctx.fill();
    ctx.strokeStyle = isHit ? '#ff2020' : accent;
    ctx.lineWidth = 1; ctx.stroke();

    for (let f = 0; f < 4; f++) {
      const fa = (f / 4) * Math.PI * 2 + Math.PI / 4;
      const fx = side * 82 + Math.cos(fa) * 1.8;
      const fy = -18 + Math.sin(fa) * 1.8;
      ctx.beginPath();
      ctx.moveTo(fx, fy);
      ctx.lineTo(fx + Math.cos(fa) * 4.5, fy + Math.sin(fa) * 4.5);
      ctx.strokeStyle = '#28303a';
      ctx.lineWidth = 1.4; ctx.stroke();
    }
  }

  for (const side of [-1, 1]) {
    const px = side * 42;
    ctx.fillStyle = hullDeep;
    ctx.beginPath();
    ctx.moveTo(px - 2.2, 0);
    ctx.lineTo(px + 2.2, 0);
    ctx.lineTo(px + 1.6, 14);
    ctx.lineTo(px - 1.6, 14);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(px, 9, 2.4, 9, 0, 0, Math.PI * 2);
    const ag = ctx.createLinearGradient(px - 2.4, 0, px + 2.4, 0);
    ag.addColorStop(0, '#607080');
    ag.addColorStop(0.5, '#e8ecf0');
    ag.addColorStop(1, '#3a4450');
    ctx.fillStyle = ag; ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(px, 0, 1.8, 2.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#181820';
    ctx.fill();

    for (const fs2 of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(px + fs2 * 2.2, 14);
      ctx.lineTo(px + fs2 * 4.5, 17);
      ctx.lineTo(px + fs2 * 2, 17);
      ctx.closePath();
      ctx.fillStyle = '#3a4450';
      ctx.fill();
    }
  }

  ctx.beginPath();
  ctx.moveTo(0, 78);
  ctx.bezierCurveTo(-3, 72, -5, 62, -6, 52);
  ctx.bezierCurveTo(-7.5, 42, -8.5, 32, -9.5, 22);
  ctx.bezierCurveTo(-11.5, 8, -12.5, -8, -12.5, -22);
  ctx.bezierCurveTo(-12.5, -36, -9.5, -50, -6, -60);
  ctx.lineTo(6, -60);
  ctx.bezierCurveTo(9.5, -50, 12.5, -36, 12.5, -22);
  ctx.bezierCurveTo(12.5, -8, 11.5, 8, 9.5, 22);
  ctx.bezierCurveTo(8.5, 32, 7.5, 42, 6, 52);
  ctx.bezierCurveTo(5, 62, 3, 72, 0, 78);
  ctx.closePath();

  const bodyG = ctx.createLinearGradient(-12, 0, 12, 0);
  if (isHit) {
    bodyG.addColorStop(0, '#601018');
    bodyG.addColorStop(0.2, '#c04030');
    bodyG.addColorStop(0.5, '#ff9080');
    bodyG.addColorStop(0.8, '#c04030');
    bodyG.addColorStop(1, '#601018');
  } else {
    bodyG.addColorStop(0, hullDark);
    bodyG.addColorStop(0.15, hullMid);
    bodyG.addColorStop(0.45, hullLight);
    bodyG.addColorStop(0.6, '#ffffff');
    bodyG.addColorStop(0.8, hullMid);
    bodyG.addColorStop(1, hullDark);
  }
  ctx.fillStyle = bodyG;
  ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 1.8; ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, 74); ctx.lineTo(0, -58);
  ctx.stroke();

  ctx.strokeStyle = outline; ctx.lineWidth = 0.7;
  const panelYs = [58, 46, 34, 22, 10, -2, -14, -26, -38, -50];
  for (const py of panelYs) {
    const w = Math.max(3.5, 9 - Math.abs(py) * 0.06);
    ctx.beginPath();
    ctx.moveTo(-w, py); ctx.lineTo(w, py);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(-6.5, 60); ctx.lineTo(-8.5, -50);
  ctx.moveTo(6.5, 60);  ctx.lineTo(8.5, -50);
  ctx.stroke();

  if (!isHit) {
    ctx.fillStyle = 'rgba(30,40,55,0.65)';
    ctx.fillRect(-5.5, 14, 11, 5);
    ctx.fillRect(-4.5, -18, 9, 4);
    ctx.fillRect(-3.5, -36, 7, 3);
    ctx.strokeStyle = outline;
    ctx.lineWidth = 0.5;
    ctx.strokeRect(-5.5, 14, 11, 5);
    ctx.strokeRect(-4.5, -18, 9, 4);
    ctx.strokeRect(-3.5, -36, 7, 3);
  }

  ctx.beginPath();
  ctx.moveTo(-8, 48);
  ctx.quadraticCurveTo(-9.5, 40, -8.5, 32);
  ctx.quadraticCurveTo(-7, 22, -4.5, 16);
  ctx.lineTo(4.5, 16);
  ctx.quadraticCurveTo(7, 22, 8.5, 32);
  ctx.quadraticCurveTo(9.5, 40, 8, 48);
  ctx.closePath();
  ctx.fillStyle = isHit ? 'rgba(80,10,20,0.95)' : 'rgba(20,26,40,0.95)';
  ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 1.4; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-6.5, 46);
  ctx.quadraticCurveTo(-8, 40, -7, 32);
  ctx.quadraticCurveTo(-6, 24, -4, 18);
  ctx.lineTo(4, 18);
  ctx.quadraticCurveTo(6, 24, 7, 32);
  ctx.quadraticCurveTo(8, 40, 6.5, 46);
  ctx.closePath();
  const cg2 = ctx.createRadialGradient(-3, 42, 0, 0, 30, 16);
  if (isHit) {
    cg2.addColorStop(0, 'rgba(255,240,240,1)');
    cg2.addColorStop(0.5, 'rgba(255,110,90,1)');
    cg2.addColorStop(1, 'rgba(80,5,20,0.95)');
  } else {
    cg2.addColorStop(0, 'rgba(240,250,255,1)');
    cg2.addColorStop(0.3, 'rgba(140,220,250,0.95)');
    cg2.addColorStop(0.6, 'rgba(60,140,200,0.92)');
    cg2.addColorStop(0.85, 'rgba(20,60,110,0.95)');
    cg2.addColorStop(1, 'rgba(8,20,40,0.98)');
  }
  ctx.fillStyle = cg2; ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 1.2; ctx.stroke();

  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, 46); ctx.lineTo(0, 18);
  ctx.moveTo(-6.5, 34); ctx.lineTo(6.5, 34);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-4.5, 44); ctx.quadraticCurveTo(-3.5, 32, 0, 20);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(0, 56, 8.5, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#05050a'; ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, 56, 6.5, 4.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#000'; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, 78);
  ctx.bezierCurveTo(-3, 72, -5, 62, -6, 52);
  ctx.lineTo(6, 52);
  ctx.bezierCurveTo(5, 62, 3, 72, 0, 78);
  ctx.closePath();
  const noseG = ctx.createLinearGradient(-5, 52, 5, 78);
  if (isHit) {
    noseG.addColorStop(0, '#601018');
    noseG.addColorStop(0.5, '#ff9080');
    noseG.addColorStop(1, '#601018');
  } else {
    noseG.addColorStop(0, hullDeep);
    noseG.addColorStop(0.4, hullDark);
    noseG.addColorStop(0.7, hullMid);
    noseG.addColorStop(1, hullDark);
  }
  ctx.fillStyle = noseG; ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 1.4; ctx.stroke();

  ctx.strokeStyle = isHit ? '#ffd0c0' : '#c0c8d0';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, 78); ctx.lineTo(0, 90); ctx.stroke();

  const navBlink = 0.55 + Math.sin(e.engine * 1.5) * 0.45;
  ctx.globalAlpha = sc * navBlink;
  ctx.beginPath(); ctx.arc(-86, -24, 2.2, 0, Math.PI * 2);
  ctx.fillStyle = '#ff2020'; ctx.fill();
  ctx.beginPath(); ctx.arc(86, -24, 2.2, 0, Math.PI * 2);
  ctx.fillStyle = '#20ff40'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -66, 1.6, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.globalAlpha = sc;

  if (state.bossMode && e.hp > 1 && e.alive) {
    const hpW = 52;
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(-hpW / 2 - 1, -85, hpW + 2, 6);
    ctx.fillStyle = '#ffb040';
    ctx.fillRect(-hpW / 2, -84, hpW * (e.hp / 2), 4);
    ctx.strokeStyle = '#ffb040';
    ctx.lineWidth = 1;
    ctx.strokeRect(-hpW / 2 - 1, -85, hpW + 2, 6);
  }

  ctx.restore();

  const idx = enemies.indexOf(e);
  if (idx >= 0) {
    const br = 15 * Math.min(uiScale, 1.55);
    const bfx = e.x - 48 * totalScale;
    const bfy = e.y - 24 * totalScale;
    ctx.save();
    ctx.globalAlpha = sc;
    ctx.beginPath(); ctx.arc(bfx, bfy, br, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(10,14,26,0.96)';
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2.4; ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.round(15 * Math.min(uiScale, 1.55))}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(idx + 1), bfx, bfy + 1);
    ctx.restore();
  }
}

function drawEnemyPanel(e) {
  if (e.fleeing) return;
  if (!e.alive && e.dying <= 0 && !e.launching) return;
  if (e.panelScale <= 0.01) return;

  const panelSc = e.panelScale;
  const cx = e.x;
  const cy = e.y + PANEL_BELOW_GAP;
  const w = PANEL_W * panelSc;
  const h = PANEL_H * panelSc;
  const x = cx - w / 2;
  const y = cy - h / 2;

  const isHit = e.flash > 0;
  const accentColors = ['#00d0ff', '#ff20b0', '#00e080', '#ffa020'];
  const accent = accentColors[e.type] || '#00d0ff';
  const panelColor = isHit ? C.pink : (state.bossMode ? C.amber : accent);

  ctx.save();
  ctx.strokeStyle = hex2rgba(accent, 0.6);
  ctx.lineWidth = 1.6;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(cx, e.y + 55 * panelSc);
  ctx.lineTo(cx, y);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.arc(cx, e.y + 55 * panelSc, 3.2, 0, Math.PI*2);
  ctx.fillStyle = accent;
  ctx.fill();

  roundRect(ctx, x, y, w, h, 10);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  if (isHit) {
    g.addColorStop(0, 'rgba(70, 8, 35, 0.96)');
    g.addColorStop(1, 'rgba(30, 3, 18, 0.97)');
  } else if (state.bossMode) {
    g.addColorStop(0, 'rgba(65, 38, 10, 0.95)');
    g.addColorStop(1, 'rgba(28, 16, 4, 0.96)');
  } else {
    g.addColorStop(0, 'rgba(18, 10, 45, 0.95)');
    g.addColorStop(0.5, 'rgba(10, 5, 28, 0.96)');
    g.addColorStop(1, 'rgba(5, 2, 16, 0.97)');
  }
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = panelColor;
  ctx.lineWidth = 2.2; ctx.stroke();

  ctx.strokeStyle = isHit ? C.pink : accent;
  ctx.lineWidth = 3;
  const cLen = 12;
  ctx.beginPath();
  ctx.moveTo(x + 4, y + cLen); ctx.lineTo(x + 4, y + 4); ctx.lineTo(x + cLen, y + 4);
  ctx.moveTo(x + w - cLen, y + 4); ctx.lineTo(x + w - 4, y + 4); ctx.lineTo(x + w - 4, y + cLen);
  ctx.moveTo(x + 4, y + h - cLen); ctx.lineTo(x + 4, y + h - 4); ctx.lineTo(x + cLen, y + h - 4);
  ctx.moveTo(x + w - cLen, y + h - 4); ctx.lineTo(x + w - 4, y + h - 4); ctx.lineTo(x + w - 4, y + h - cLen);
  ctx.stroke();

  const fBadge = Math.round(12 * Math.min(uiScale, 1.45));
  ctx.font = `bold ${fBadge}px "Consolas", monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = accent;
  ctx.fillText(`[${enemies.indexOf(e) + 1}]`, x + 12, y + 6);

  const fOpt = Math.round(17 * uiScale * panelSc);
  const font = `bold ${fOpt}px system-ui, sans-serif`;
  const lines = wrapText(e.text, w - 30, font);
  ctx.font = font;
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lh = Math.round(fOpt * 1.15);
  const startY = cy - ((lines.length - 1) * lh) / 2 + 3;
  lines.forEach((ln, i) => ctx.fillText(ln, cx, startY + i * lh));

  if (e.panelFlash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, e.panelFlash);
    ctx.strokeStyle = e.correct ? C.lime : C.pink;
    ctx.lineWidth = 5;
    roundRect(ctx, x - 6, y - 6, w + 12, h + 12, 12);
    ctx.stroke();
    ctx.restore();
  }

  if (state.questionFailed && e.correct && e.alive) {
    ctx.save();
    const pulse = 0.6 + Math.sin(state.gameTime * 8) * 0.4;
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = C.lime;
    ctx.lineWidth = 6;
    roundRect(ctx, x - 10, y - 10, w + 20, h + 20, 14);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.font = `bold ${Math.round(15 * uiScale)}px "Consolas", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.lime;
    ctx.fillText('✓ JAWABAN BENAR', cx, y - 20);
    ctx.restore();
  }

  ctx.restore();
}

/* ═══ PESAWAT PEMAIN ═══ */
function drawPlayer() {
  if (state.mode === 'over' || state.mode === 'victory') return;
  const bob = Math.sin(state.gameTime * 2.4) * 2.5;
  const px = player.x, py = player.y + bob;
  const tilt = player.bank * 0.5;
  const tier = player.tier;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(tilt);

  if (player.overdrive > 0) {
    const a = 0.35 + Math.sin(state.gameTime * 20) * 0.2;
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 130);
    rg.addColorStop(0, hex2rgba(C.cyan, a * 0.55));
    rg.addColorStop(0.5, hex2rgba(C.purple, a * 0.3));
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0, 0, 130, 0, Math.PI*2); ctx.fill();
  }

  if (player.tierFlash > 0) {
    const a = player.tierFlash;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * 0.6;
    const tg = ctx.createRadialGradient(0, 0, 0, 0, 0, 140);
    tg.addColorStop(0, hex2rgba(C.white, 0.9));
    tg.addColorStop(0.3, hex2rgba(C.cyan, 0.55));
    tg.addColorStop(1, 'transparent');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(0, 0, 140, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  const flameLen = 42 + Math.sin(player.enginePulse) * 10;
  const engineGrad = ctx.createLinearGradient(0, 18, 0, 18 + flameLen);
  engineGrad.addColorStop(0, hex2rgba(C.white, 1));
  engineGrad.addColorStop(0.35, hex2rgba(C.cyan, 0.95));
  engineGrad.addColorStop(0.7, hex2rgba(C.purple, 0.6));
  engineGrad.addColorStop(1, 'transparent');

  const thrusters = [[-13, 18], [13, 18]];
  if (tier >= 2) thrusters.push([-30, 20], [30, 20]);
  if (tier >= 3) thrusters.push([-48, 22], [48, 22]);
  if (tier >= 4) thrusters.push([-66, 24], [66, 24]);
  if (tier >= 5) thrusters.push([-84, 26], [84, 26]);

  for (const [tx, ty] of thrusters) {
    ctx.fillStyle = engineGrad;
    ctx.beginPath();
    ctx.moveTo(tx - 6, ty);
    ctx.lineTo(tx, ty + flameLen * (1 - Math.abs(tx) * 0.004));
    ctx.lineTo(tx + 6, ty);
    ctx.closePath(); ctx.fill();
  }

  const coreLen = flameLen * 1.4;
  const coreGrad = ctx.createLinearGradient(0, 16, 0, 16 + coreLen);
  coreGrad.addColorStop(0, C.white);
  coreGrad.addColorStop(0.3, hex2rgba(C.cyan, 0.9));
  coreGrad.addColorStop(0.7, hex2rgba(C.purple, 0.5));
  coreGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.moveTo(-7, 16); ctx.lineTo(0, 16 + coreLen); ctx.lineTo(7, 16);
  ctx.closePath(); ctx.fill();

  const wingSpan = 48 + (tier - 1) * 15;
  const wingSweep = 0.55 + tier * 0.02;

  for (const side of [-1, 1]) {
    const wingPath = () => {
      ctx.beginPath();
      ctx.moveTo(side * 7, -10);
      ctx.bezierCurveTo(side * 20, -6, side * (wingSpan * 0.7), wingSweep * 22, side * wingSpan, wingSweep * 30);
      ctx.lineTo(side * (wingSpan - 3), wingSweep * 30 + 9);
      ctx.bezierCurveTo(side * (wingSpan * 0.65), 42, side * 26, 25, side * 8, 14);
      ctx.closePath();
    };
    wingPath();
    ctx.strokeStyle = 'rgba(0,8,20,0.98)';
    ctx.lineWidth = 6;
    ctx.lineJoin = 'round';
    ctx.stroke();
    wingPath();
    const wingGrad = ctx.createLinearGradient(side * wingSpan, 0, 0, 18);
    wingGrad.addColorStop(0, '#08122a');
    wingGrad.addColorStop(0.4, '#0d2a5a');
    wingGrad.addColorStop(0.85, '#1a4a8a');
    wingGrad.addColorStop(1, '#0d2a5a');
    ctx.fillStyle = wingGrad; ctx.fill();
    wingPath();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.95);
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(side * 7, -10);
    ctx.bezierCurveTo(side * 20, -6, side * (wingSpan * 0.7), wingSweep * 22, side * wingSpan, wingSweep * 30);
    ctx.stroke();

    ctx.strokeStyle = hex2rgba(C.cyan, 0.55);
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(side * 12, 0);
    ctx.lineTo(side * (wingSpan - 10), wingSweep * 26 + 3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(side * 18, 6);
    ctx.lineTo(side * (wingSpan - 16), wingSweep * 30 + 2);
    ctx.stroke();
  }

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 5, -28);
    ctx.bezierCurveTo(side * 14, -30, side * 24, -24, side * 28, -20);
    ctx.lineTo(side * 26, -16);
    ctx.bezierCurveTo(side * 18, -20, side * 10, -24, side * 5, -22);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0,8,20,0.98)';
    ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#0d2a5a'; ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.9);
    ctx.lineWidth = 1.6; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(side * 6, -27);
    ctx.lineTo(side * 26, -20);
    ctx.stroke();
  }

  const cannonPositions = [[-38, 6], [38, 6]];
  if (tier >= 2) cannonPositions.push([-56, 8], [56, 8]);
  if (tier >= 4) cannonPositions.push([-74, 10], [74, 10]);
  if (tier >= 5) cannonPositions.push([-92, 12], [92, 12]);

  for (const [cx2, cy2] of cannonPositions) {
    ctx.fillStyle = '#02010a';
    ctx.strokeStyle = 'rgba(0,8,20,0.98)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.rect(cx2 - 4, cy2 - 9, 8, 16); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.95);
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.rect(cx2 - 4, cy2 - 9, 8, 16); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx2, cy2 - 10, 2, 0, Math.PI*2);
    ctx.fillStyle = C.lime; ctx.fill();
  }

  if (tier >= 3) {
    for (const side of [-1, 1]) {
      const baseX = side * (wingSpan - 18);
      ctx.beginPath();
      ctx.ellipse(baseX, 8, 13, 7, 0, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(0,8,20,0.98)';
      ctx.lineWidth = 5; ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(baseX, 8, 13, 7, 0, 0, Math.PI*2);
      const podG = ctx.createRadialGradient(baseX - 4, 4, 0, baseX, 8, 15);
      podG.addColorStop(0, '#7fffff');
      podG.addColorStop(0.4, '#0d2a5a');
      podG.addColorStop(1, '#02010a');
      ctx.fillStyle = podG; ctx.fill();
      ctx.beginPath();
      ctx.ellipse(baseX, 8, 13, 7, 0, 0, Math.PI*2);
      ctx.strokeStyle = hex2rgba(C.cyan, 0.95);
      ctx.lineWidth = 1.8; ctx.stroke();
      ctx.beginPath(); ctx.arc(baseX, 8, 3.2, 0, Math.PI*2);
      ctx.fillStyle = C.lime; ctx.fill();
    }
  }

  if (tier >= 3) {
    ctx.beginPath();
    ctx.moveTo(0, -40); ctx.lineTo(-8, -62); ctx.lineTo(0, -54); ctx.lineTo(8, -62);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0,8,20,0.98)';
    ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.fillStyle = '#0d2a5a'; ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.95);
    ctx.lineWidth = 1.6; ctx.stroke();
  }

  if (tier >= 4) {
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 14, 16); ctx.lineTo(side * 32, 32); ctx.lineTo(side * 22, 34); ctx.lineTo(side * 11, 22);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(0,8,20,0.98)';
      ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = '#0a1c40'; ctx.fill();
      ctx.strokeStyle = hex2rgba(C.cyan, 0.9);
      ctx.lineWidth = 1.4; ctx.stroke();
    }
  }

  const hullW = 13 + (tier - 1) * 1.4;
  const hullH = 46 + (tier - 1) * 2;

  const hullPath = () => {
    ctx.beginPath();
    ctx.moveTo(0, -hullH);
    ctx.lineTo(hullW * 0.7, -hullH + 15);
    ctx.lineTo(hullW, -8);
    ctx.lineTo(hullW + 1, 13);
    ctx.lineTo(0, 22);
    ctx.lineTo(-hullW - 1, 13);
    ctx.lineTo(-hullW, -8);
    ctx.lineTo(-hullW * 0.7, -hullH + 15);
    ctx.closePath();
  };

  hullPath();
  ctx.strokeStyle = 'rgba(0,8,20,0.98)';
  ctx.lineWidth = 7;
  ctx.lineJoin = 'round';
  ctx.stroke();

  hullPath();
  const bodyGrad = ctx.createLinearGradient(0, -hullH, 0, 22);
  bodyGrad.addColorStop(0, '#f0faff');
  bodyGrad.addColorStop(0.15, '#7fe8ff');
  bodyGrad.addColorStop(0.45, '#1d6ab0');
  bodyGrad.addColorStop(0.75, '#0a1a45');
  bodyGrad.addColorStop(1, '#02060f');
  ctx.fillStyle = bodyGrad; ctx.fill();

  hullPath();
  ctx.strokeStyle = hex2rgba(C.cyan, 1);
  ctx.lineWidth = 2.2;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, -hullH + 10); ctx.lineTo(0, 20); ctx.stroke();

  ctx.strokeStyle = hex2rgba(C.cyan, 0.6);
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-6, -22); ctx.lineTo(6, -22);
  ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
  ctx.moveTo(-6, 14); ctx.lineTo(6, 14);
  ctx.stroke();

  if (tier >= 4) {
    ctx.fillStyle = 'rgba(4, 2, 18, 0.95)';
    ctx.strokeStyle = hex2rgba(C.cyan, 0.65); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(-8, -34, 16, 8); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.rect(-10, 15, 20, 6); ctx.fill(); ctx.stroke();
  }

  if (tier >= 5) {
    ctx.beginPath(); ctx.arc(0, -6, 6, 0, Math.PI*2);
    const corePulse = 0.8 + Math.sin(state.gameTime * 6) * 0.2;
    ctx.fillStyle = hex2rgba(C.lime, corePulse);
    ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(0, -hullH + 4);
  ctx.quadraticCurveTo(-5, -hullH + 20, -4.5, -hullH + 34);
  ctx.lineTo(4.5, -hullH + 34);
  ctx.quadraticCurveTo(5, -hullH + 20, 0, -hullH + 4);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(0,8,20,0.98)';
  ctx.lineWidth = 3.5; ctx.stroke();
  const cg2 = ctx.createRadialGradient(-1.5, -hullH + 16, 0, 0, -hullH + 20, 14);
  cg2.addColorStop(0, 'rgba(255,255,255,1)');
  cg2.addColorStop(0.35, 'rgba(180,240,255,0.98)');
  cg2.addColorStop(0.7, 'rgba(60, 140, 220, 0.95)');
  cg2.addColorStop(1, 'rgba(10, 30, 70, 0.98)');
  ctx.fillStyle = cg2; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 1);
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(0, -hullH + 4);
  ctx.quadraticCurveTo(-5, -hullH + 20, -4.5, -hullH + 34);
  ctx.lineTo(4.5, -hullH + 34);
  ctx.quadraticCurveTo(5, -hullH + 20, 0, -hullH + 4);
  ctx.closePath();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-1.5, -hullH + 8);
  ctx.quadraticCurveTo(-3, -hullH + 18, -2.5, -hullH + 28);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -hullH); ctx.lineTo(3, -hullH - 10); ctx.lineTo(-3, -hullH - 10);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(0,8,20,0.98)';
  ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 1);
  ctx.lineWidth = 1.2; ctx.stroke();

  if (tier >= 4) {
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 7, -hullH + 6); ctx.lineTo(side * 9, -hullH - 5); ctx.lineTo(side * 5, -hullH - 5);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(0,8,20,0.98)';
      ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = hex2rgba(C.cyan, 0.9);
      ctx.fill();
      ctx.strokeStyle = hex2rgba(C.cyan, 1);
      ctx.lineWidth = 1; ctx.stroke();
    }
  }

  if (tier >= 2) {
    ctx.font = `bold ${fs(10, 1.5)}px "Consolas", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(-10, 15, 20, 10);
    ctx.strokeStyle = hex2rgba(C.lime, 0.9); ctx.lineWidth = 1; ctx.strokeRect(-10, 15, 20, 10);
    ctx.fillStyle = C.lime;
    ctx.fillText('T' + tier, 0, 20);
  }

  ctx.restore();

  if (state.shield > 0) {
    const shieldRatio = state.shield / state.maxShield;
    const pulse = 0.5 + Math.sin(player.shieldPhase * 2) * 0.15;
    const radius = 66 + pulse * 4 + (tier - 1) * 6;
    ctx.save();
    ctx.translate(px, py + bob);
    ctx.globalAlpha = shieldRatio * 0.7;
    const sg = ctx.createRadialGradient(0, 0, radius*0.6, 0, 0, radius);
    sg.addColorStop(0, 'transparent');
    sg.addColorStop(0.7, hex2rgba(C.cyan, 0.3 * shieldRatio));
    sg.addColorStop(1, hex2rgba(C.cyan, 0.9 * shieldRatio));
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, shieldRatio * 1);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = shieldRatio * 0.5;
    ctx.strokeStyle = hex2rgba(C.magenta, 0.9);
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const ang = player.shieldPhase * 0.5 + i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*22, Math.sin(ang)*22);
      ctx.lineTo(Math.cos(ang)*radius, Math.sin(ang)*radius);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (player.invuln > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(state.gameTime * 40) * 0.2;
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(px, py + bob, 78, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawBullets() {
  for (const b of bullets) {
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i], a = (i + 1) / b.trail.length;
      ctx.globalAlpha = a * 0.7;
      const grad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 5 + a*4);
      grad.addColorStop(0, C.white);
      grad.addColorStop(0.4, C.cyan);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(t.x, t.y, 5 + a*4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 14);
    g.addColorStop(0, C.white);
    g.addColorStop(0.35, hex2rgba(C.cyan, 0.95));
    g.addColorStop(0.7, hex2rgba(C.purple, 0.55));
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
    ctx.fillStyle = C.white;
    ctx.fill();
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawShockwaves() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const sw of shockwaves) {
    const t = 1 - sw.life / sw.maxLife;
    ctx.globalAlpha = (1 - t) * 0.8;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 4 * (1 - t) + 1;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawDebris() {
  for (const d of debris) {
    const a = Math.max(0, d.life / d.max);
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < d.points; i++) {
      const ang = (i/d.points)*Math.PI*2;
      const r = d.size * (0.6 + (i%2)*0.4);
      const px = Math.cos(ang)*r, py = Math.sin(ang)*r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawPlaneFragments() {
  for (const f of planeFragments) {
    const a = Math.max(0, f.life / f.max);
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = a;
    if (f.isPanel) {
      ctx.fillStyle = f.color;
      ctx.fillRect(-f.panelW / 2, -f.panelH / 2, f.panelW, f.panelH);
      ctx.strokeStyle = hex2rgba(C.white, 0.6 * a);
      ctx.lineWidth = 0.7;
      ctx.strokeRect(-f.panelW / 2, -f.panelH / 2, f.panelW, f.panelH);
    } else {
      ctx.fillStyle = f.color;
      ctx.beginPath();
      for (let i = 0; i < f.points; i++) {
        const ang = (i / f.points) * Math.PI * 2;
        const r = f.size * (0.45 + ((i % 2) ? 0.55 : 0.35));
        const px = Math.cos(ang) * r;
        const py = Math.sin(ang) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawPopups() {
  for (const p of popups) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `bold ${fs(p.size, 1.5)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }
}

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs(11, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.cyan;
  ctx.fillText('◈ SKOR', px + 14, by + bh * 0.32);
  ctx.font = `bold ${fs(20, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText(String(state.score).padStart(6, '0'), px + 14, by + bh * 0.72);

  const cbx = (W - bw) / 2;
  roundRect(ctx, cbx, by, bw, bh, 10);
  const sg2 = ctx.createLinearGradient(cbx, by, cbx, by + bh);
  sg2.addColorStop(0, 'rgba(60, 15, 50, 0.9)');
  sg2.addColorStop(1, 'rgba(20, 4, 25, 0.95)');
  ctx.fillStyle = sg2; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.magenta, 0.8); ctx.lineWidth = 1.6; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = `bold ${fs(10, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.magenta;
  ctx.fillText('◈ LEVEL / TIER', W/2, by + bh * 0.30);
  ctx.font = `bold ${fs(16, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText(`LV ${state.level}/${MAX_LEVEL}  ·  T${player.tier}`, W/2, by + bh * 0.72);

  const segW = 22 * u, segH = 13 * u, gap = 5 * u;
  const totalW = state.maxHp * segW + (state.maxHp - 1) * gap;
  const startX = W - 18 - totalW;
  ctx.textAlign = 'right';
  ctx.font = `bold ${fs(10, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = state.bossMode ? C.amber : C.cyan;
  ctx.fillText(state.bossMode ? '☠ BOSS' : 'ERA ' + state.level, W - 18, by + bh * 0.22);

  for (let i = 0; i < state.maxHp; i++) {
    const sx = startX + i * (segW + gap);
    const on = i < state.hp;
    const isCrit = state.hp <= 2;
    roundRect(ctx, sx, by + bh * 0.36, segW, segH, 4);
    if (on) {
      const hg = ctx.createLinearGradient(sx, by, sx, by + bh);
      hg.addColorStop(0, isCrit ? C.pink : C.lime);
      hg.addColorStop(1, isCrit ? '#7a1508' : '#004a30');
      ctx.fillStyle = hg;
    } else ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  }

  const shY = by + bh * 0.80;
  roundRect(ctx, startX, shY, totalW, 6 * u, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  if (state.shield > 0) {
    const sr = state.shield / state.maxShield;
    roundRect(ctx, startX, shY, totalW * sr, 6 * u, 3);
    const sg = ctx.createLinearGradient(startX, 0, startX + totalW, 0);
    sg.addColorStop(0, C.cyan); sg.addColorStop(1, C.magenta);
    ctx.fillStyle = sg;
    ctx.fill();
  }

  const cmW = 200 * u, cmH = 10 * u;
  const cmX = (W - cmW) / 2;
  const cmY = by + bh + 6;
  roundRect(ctx, cmX, cmY, cmW, cmH, cmH / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  const cmRatio = state.comboMeter / 100;
  if (cmRatio > 0) {
    roundRect(ctx, cmX, cmY, cmW * cmRatio, cmH, cmH / 2);
    const cg = ctx.createLinearGradient(cmX, 0, cmX + cmW, 0);
    cg.addColorStop(0, C.lime); cg.addColorStop(1, C.cyan);
    ctx.fillStyle = cg;
    ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs(10, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.lime;
  ctx.fillText('COMBO ' + Math.floor(state.comboMeter) + '%', W/2, cmY + cmH + 9 * u);
  ctx.restore();
}

function drawToast() {
  if (state.toastTimer <= 0) return;
  const a = Math.min(1, state.toastTimer / 0.4);

  ctx.globalAlpha = a;

  roundRect(ctx, cx - bw/2, cy - bh/2, bw, bh, 12);

  ctx.fillText(state.toastText, cx, cy + 2);
  ctx.restore();
}

}

function drawVictory() {
  const mu = Math.min(uiScale, 1.4);
  ctx.save();
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, H);
  bgGrad.addColorStop(0, 'rgba(5, 45, 30, 0.94)');
  bgGrad.addColorStop(1, 'rgba(0, 12, 8, 0.98)');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tSize = Math.round(62 * Math.min(mu, 1.12));
  ctx.font = `bold ${tSize}px system-ui, sans-serif`;
  ctx.fillStyle = C.lime;
  ctx.fillText('MISI SUKSES', W/2, 138);
  ctx.fillStyle = C.white;
  ctx.fillText('MISI SUKSES', W/2, 138);

  ctx.font = `bold ${Math.round(15 * mu)}px system-ui, sans-serif`;
  ctx.fillStyle = hex2rgba(C.white, 0.9);
  ctx.fillText('🏆  Semua 10 level Perang Dunia I berhasil dituntaskan!  🏆', W/2, 196);

  const px = W * 0.20, py = 230, pw = W * 0.60, ph = 220 + 60 * mu;
  roundRect(ctx, px, py, pw, ph, 20);
  const bg = ctx.createLinearGradient(px, py, px, py + ph);
  bg.addColorStop(0, 'rgba(5, 40, 25, 0.97)');
  bg.addColorStop(1, 'rgba(2, 15, 8, 0.97)');
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.lime, 0.85); ctx.lineWidth = 2.8; ctx.stroke();

  ctx.font = `bold ${Math.round(15 * mu)}px system-ui, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillStyle = C.lime;
  ctx.fillText('◆  LAPORAN KEMENANGAN', px + 30, py + 32);

  const total = state.hitCorrect + state.hitWrong;
  const stats = [
    ['SKOR AKHIR', String(state.score), C.lime],
    ['LEVEL TERCAPAI', state.level + ' / ' + MAX_LEVEL, C.cyan],
    ['JAWABAN BENAR', String(state.hitCorrect), C.cyan],
    ['JAWABAN SALAH', String(state.hitWrong), C.pink],
    ['COMBO TERBAIK', 'x' + state.bestStreak, C.magenta],
    ['AKURASI', total > 0 ? Math.round(state.hitCorrect / total * 100) + '%' : '—', C.amber],
  ];
  const colW = (pw - 60) / 2, rowHH = 50 * mu;
  stats.forEach((s, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const x = px + 30 + col * colW, y = py + 72 + row * rowHH;
    ctx.fillStyle = s[2];
    ctx.fillRect(x - 12, y - 9, 3, 34 * mu);
    ctx.textAlign = 'left';
    ctx.font = `bold ${Math.round(11 * mu)}px system-ui, sans-serif`;
    ctx.fillStyle = hex2rgba(C.white, 0.8);
    ctx.fillText(s[0], x, y);
    ctx.font = `bold ${Math.round(25 * mu)}px system-ui, sans-serif`;
    ctx.fillStyle = s[2];
    ctx.fillText(s[1], x, y + 26 * mu);
  });

  const blink = 0.7 + Math.sin(state.gameTime * 4) * 0.3;
  ctx.globalAlpha = blink;
  const btnW = Math.min(620, W * 0.50), btnH = 62;
  const btnX = (W - btnW) / 2, btnY = 570;
  roundRect(ctx, btnX, btnY, btnW, btnH, 14);
  const btnG = ctx.createLinearGradient(btnX, 0, btnX + btnW, 0);
  btnG.addColorStop(0, hex2rgba(C.lime, 0.25));
  btnG.addColorStop(0.5, hex2rgba(C.cyan, 0.38));
  btnG.addColorStop(1, hex2rgba(C.lime, 0.25));
  ctx.fillStyle = btnG; ctx.fill();
  ctx.strokeStyle = C.lime; ctx.lineWidth = 2.8;
  ctx.stroke();
  ctx.font = `bold ${Math.round(22 * mu)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.white;
  ctx.fillText('▶  MAIN LAGI  ◀', W/2, btnY + btnH / 2);
  ctx.restore();
}

/* ═══ MASTER RENDER ═══ */
function render() {
  ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
  ctx.save();
  if (state.shake > 0) ctx.translate((Math.random()-0.5) * state.shake, (Math.random()-0.5) * state.shake);
  drawBackground();
  if (state.mode === 'playing' || state.mode === 'over' || state.mode === 'victory') {
    drawEngineTrails();
    drawSmokePuffs();
    drawQShip();
    drawQShipDebris();
    for (const e of enemies) drawEnemyPanel(e);
    for (const e of enemies) drawEnemyShip(e);
    drawBullets();
    drawShockwaves();
    drawDebris();
    drawPlaneFragments();
    drawParticles();
    drawHeatDistortions();
    drawPlayer();
    drawPopups();
    if (state.mode === 'playing') {
      drawQuestionPanel();
      drawHUD();
      drawToast();
    }
  }
  ctx.restore();

  if (state.flashRed > 0) { ctx.fillStyle = hex2rgba(C.pink, state.flashRed*0.3); ctx.fillRect(0,0,W,H); }
  if (state.flashGreen > 0) { ctx.fillStyle = hex2rgba(C.lime, state.flashGreen*0.2); ctx.fillRect(0,0,W,H); }
  if (state.flashBlue > 0) { ctx.fillStyle = hex2rgba(C.cyan, state.flashBlue*0.25); ctx.fillRect(0,0,W,H); }

  const vg = ctx.createRadialGradient(W/2, H/2, H*0.4, W/2, H/2, H*0.95);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.03;
  for (let y = 0; y < H; y += 3) { ctx.fillStyle = '#000'; ctx.fillRect(0, y, W, 1); }
  ctx.restore();

  if (state.mode === 'menu') drawMenu();
  if (state.mode === 'over') drawGameOver();
  if (state.mode === 'victory') drawVictory();
}

/* ═══ MAIN LOOP ═══ */
let lastTs = 0;
function loop(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  if (document.body.classList.contains('portrait-locked')) { requestAnimationFrame(loop); return; }
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ═══ INPUT ═══ */
function canvasCoords(clientX, clientY) {
  const r = cvs.getBoundingClientRect();
  return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
}

function handleStart() {
  initAudio();
  if (state.mode === 'menu' || state.mode === 'over' || state.mode === 'victory') {
    resetGame();
    tone(520, 0.1, 'triangle', 0.055, 880);
    tone(780, 0.14, 'triangle', 0.055, 1200, 0.1);
    tone(1040, 0.18, 'sine', 0.045, 1560, 0.22);
  }
}

cvs.addEventListener('pointerdown', (evt) => {
  evt.preventDefault();
  initAudio();
  if (state.mode !== 'playing') { handleStart(); return; }
  if (state.locked || !state.roundActive) return;
  const { x, y } = canvasCoords(evt.clientX, evt.clientY);
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.alive || e.dying > 0 || e.launching || e.fleeing) continue;
    const shipR = 85;
    const inShip = x >= e.x - shipR && x <= e.x + shipR && y >= e.y - shipR && y <= e.y + shipR;
    const panelCY = e.y + PANEL_BELOW_GAP;
    const inPanel = x >= e.x - PANEL_W / 2 - 26 && x <= e.x + PANEL_W / 2 + 26
                 && y >= panelCY - PANEL_H / 2 - 22 && y <= panelCY + PANEL_H / 2 + 22;
    if (inShip || inPanel) { fire(i); return; }
  }
}, { passive: false });

cvs.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (evt) => {
  initAudio();
  if (evt.code === 'Space' || evt.code === 'Enter') {
    evt.preventDefault();
    if (state.mode !== 'playing') handleStart();
  }
});

window.addEventListener('blur', () => { lastTs = 0; });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

state.gameTime = 0;
requestAnimationFrame(() => resize());
setTimeout(resize, 150);
setTimeout(resize, 500);
</script>

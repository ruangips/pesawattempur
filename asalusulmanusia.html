function drawPlayer() {
  if (state.mode === 'over' || state.mode === 'victory') return;
  const bob = Math.sin(state.gameTime * 2.4) * 2.5;
  const px = player.x, py = player.y + bob;
  const tilt = player.bank * 0.5;
  const tier = player.tier;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(tilt);

  if (player.overdrive > 0) {
    const a = 0.35 + Math.sin(state.gameTime * 20) * 0.2;
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 130);
    rg.addColorStop(0, hex2rgba(C.cyan, a * 0.55));
    rg.addColorStop(0.5, hex2rgba(C.blue, a * 0.3));
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0, 0, 130, 0, Math.PI*2); ctx.fill();
  }

  if (player.tierFlash > 0) {
    const a = player.tierFlash;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * 0.6;
    const tg = ctx.createRadialGradient(0, 0, 0, 0, 0, 140);
    tg.addColorStop(0, hex2rgba(C.white, 0.9));
    tg.addColorStop(0.3, hex2rgba(C.cyan, 0.55));
    tg.addColorStop(1, 'transparent');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(0, 0, 140, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  const flameLen = 42 + Math.sin(player.enginePulse) * 10;
  const engineGrad = ctx.createLinearGradient(0, 18, 0, 18 + flameLen);
  engineGrad.addColorStop(0, hex2rgba(C.white, 1));
  engineGrad.addColorStop(0.35, hex2rgba(C.cyan, 0.95));
  engineGrad.addColorStop(0.7, hex2rgba(C.blue, 0.6));
  engineGrad.addColorStop(1, 'transparent');

  const thrusters = [[-13, 18], [13, 18]];
  if (tier >= 2) thrusters.push([-30, 20], [30, 20]);
  if (tier >= 3) thrusters.push([-48, 22], [48, 22]);
  if (tier >= 4) thrusters.push([-66, 24], [66, 24]);
  if (tier >= 5) thrusters.push([-84, 26], [84, 26]);

  for (const [tx, ty] of thrusters) {
    ctx.fillStyle = engineGrad;
    ctx.beginPath();
    ctx.moveTo(tx - 6, ty);
    ctx.lineTo(tx, ty + flameLen * (1 - Math.abs(tx) * 0.004));
    ctx.lineTo(tx + 6, ty);
    ctx.closePath(); ctx.fill();
  }

  const coreLen = flameLen * 1.4;
  const coreGrad = ctx.createLinearGradient(0, 16, 0, 16 + coreLen);
  coreGrad.addColorStop(0, C.white);
  coreGrad.addColorStop(0.3, hex2rgba(C.cyan, 0.9));
  coreGrad.addColorStop(0.7, hex2rgba(C.blue, 0.5));
  coreGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.moveTo(-7, 16); ctx.lineTo(0, 16 + coreLen); ctx.lineTo(7, 16);
  ctx.closePath(); ctx.fill();

  const wingSpan = 48 + (tier - 1) * 15;
  const wingSweep = 0.55 + tier * 0.02;

  for (const side of [-1, 1]) {
    const wingPath = () => {
      ctx.beginPath();
      ctx.moveTo(side * 7, -10);
      ctx.bezierCurveTo(side * 20, -6, side * (wingSpan * 0.7), wingSweep * 22, side * wingSpan, wingSweep * 30);
      ctx.lineTo(side * (wingSpan - 3), wingSweep * 30 + 9);
      ctx.bezierCurveTo(side * (wingSpan * 0.65), 42, side * 26, 25, side * 8, 14);
      ctx.closePath();
    };
    wingPath();
    ctx.strokeStyle = 'rgba(0,8,20,0.98)';
    ctx.lineWidth = 6;
    ctx.lineJoin = 'round';
    ctx.stroke();
    wingPath();
    const wingGrad = ctx.createLinearGradient(side * wingSpan, 0, 0, 18);
    wingGrad.addColorStop(0, '#04122a');
    wingGrad.addColorStop(0.4, '#0a2a5a');
    wingGrad.addColorStop(0.85, '#1a4a8a');
    wingGrad.addColorStop(1, '#0a2a5a');
    ctx.fillStyle = wingGrad; ctx.fill();
    wingPath();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.95);
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(side * 7, -10);
    ctx.bezierCurveTo(side * 20, -6, side * (wingSpan * 0.7), wingSweep * 22, side * wingSpan, wingSweep * 30);
    ctx.stroke();

    ctx.strokeStyle = hex2rgba(C.cyan, 0.55);
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(side * 12, 0);
    ctx.lineTo(side * (wingSpan - 10), wingSweep * 26 + 3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(side * 18, 6);
    ctx.lineTo(side * (wingSpan - 16), wingSweep * 30 + 2);
    ctx.stroke();
  }

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 5, -28);
    ctx.bezierCurveTo(side * 14, -30, side * 24, -24, side * 28, -20);
    ctx.lineTo(side * 26, -16);
    ctx.bezierCurveTo(side * 18, -20, side * 10, -24, side * 5, -22);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0,8,20,0.98)';
    ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#0a2a5a'; ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.9);
    ctx.lineWidth = 1.6; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(side * 6, -27);
    ctx.lineTo(side * 26, -20);
    ctx.stroke();
  }

  const cannonPositions = [[-38, 6], [38, 6]];
  if (tier >= 2) cannonPositions.push([-56, 8], [56, 8]);
  if (tier >= 4) cannonPositions.push([-74, 10], [74, 10]);
  if (tier >= 5) cannonPositions.push([-92, 12], [92, 12]);

  for (const [cx2, cy2] of cannonPositions) {
    ctx.fillStyle = '#02010a';
    ctx.strokeStyle = 'rgba(0,8,20,0.98)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.rect(cx2 - 4, cy2 - 9, 8, 16); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.95);
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.rect(cx2 - 4, cy2 - 9, 8, 16); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx2, cy2 - 10, 2, 0, Math.PI*2);
    ctx.fillStyle = C.teal; ctx.fill();
  }

  if (tier >= 3) {
    for (const side of [-1, 1]) {
      const baseX = side * (wingSpan - 18);
      ctx.beginPath();
      ctx.ellipse(baseX, 8, 13, 7, 0, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(0,8,20,0.98)';
      ctx.lineWidth = 5; ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(baseX, 8, 13, 7, 0, 0, Math.PI*2);
      const podG = ctx.createRadialGradient(baseX - 4, 4, 0, baseX, 8, 15);
      podG.addColorStop(0, '#7fffff');
      podG.addColorStop(0.4, '#0a2a5a');
      podG.addColorStop(1, '#02010a');
      ctx.fillStyle = podG; ctx.fill();
      ctx.beginPath();
      ctx.ellipse(baseX, 8, 13, 7, 0, 0, Math.PI*2);
      ctx.strokeStyle = hex2rgba(C.cyan, 0.95);
      ctx.lineWidth = 1.8; ctx.stroke();
      ctx.beginPath(); ctx.arc(baseX, 8, 3.2, 0, Math.PI*2);
      ctx.fillStyle = C.teal; ctx.fill();
    }
  }

  if (tier >= 3) {
    ctx.beginPath();
    ctx.moveTo(0, -40); ctx.lineTo(-8, -62); ctx.lineTo(0, -54); ctx.lineTo(8, -62);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0,8,20,0.98)';
    ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.fillStyle = '#0a2a5a'; ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.95);
    ctx.lineWidth = 1.6; ctx.stroke();
  }

  if (tier >= 4) {
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 14, 16); ctx.lineTo(side * 32, 32); ctx.lineTo(side * 22, 34); ctx.lineTo(side * 11, 22);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(0,8,20,0.98)';
      ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = '#081c40'; ctx.fill();
      ctx.strokeStyle = hex2rgba(C.cyan, 0.9);
      ctx.lineWidth = 1.4; ctx.stroke();
    }
  }

  const hullW = 13 + (tier - 1) * 1.4;
  const hullH = 46 + (tier - 1) * 2;

  const hullPath = () => {
    ctx.beginPath();
    ctx.moveTo(0, -hullH);
    ctx.lineTo(hullW * 0.7, -hullH + 15);
    ctx.lineTo(hullW, -8);
    ctx.lineTo(hullW + 1, 13);
    ctx.lineTo(0, 22);
    ctx.lineTo(-hullW - 1, 13);
    ctx.lineTo(-hullW, -8);
    ctx.lineTo(-hullW * 0.7, -hullH + 15);
    ctx.closePath();
  };

  hullPath();
  ctx.strokeStyle = 'rgba(0,8,20,0.98)';
  ctx.lineWidth = 7;
  ctx.lineJoin = 'round';
  ctx.stroke();

  hullPath();
  const bodyGrad = ctx.createLinearGradient(0, -hullH, 0, 22);
  bodyGrad.addColorStop(0, '#f0faff');
  bodyGrad.addColorStop(0.15, '#7fe8ff');
  bodyGrad.addColorStop(0.45, '#1d6ab0');
  bodyGrad.addColorStop(0.75, '#0a1a45');
  bodyGrad.addColorStop(1, '#02060f');
  ctx.fillStyle = bodyGrad; ctx.fill();

  hullPath();
  ctx.strokeStyle = hex2rgba(C.cyan, 1);
  ctx.lineWidth = 2.2;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, -hullH + 10); ctx.lineTo(0, 20); ctx.stroke();

  ctx.strokeStyle = hex2rgba(C.cyan, 0.6);
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(-6, -22); ctx.lineTo(6, -22);
  ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
  ctx.moveTo(-6, 14); ctx.lineTo(6, 14);
  ctx.stroke();

  if (tier >= 4) {
    ctx.fillStyle = 'rgba(4, 2, 18, 0.95)';
    ctx.strokeStyle = hex2rgba(C.cyan, 0.65); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(-8, -34, 16, 8); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.rect(-10, 15, 20, 6); ctx.fill(); ctx.stroke();
  }

  if (tier >= 5) {
    ctx.beginPath(); ctx.arc(0, -6, 6, 0, Math.PI*2);
    const corePulse = 0.8 + Math.sin(state.gameTime * 6) * 0.2;
    ctx.fillStyle = hex2rgba(C.teal, corePulse);
    ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(0, -hullH + 4);
  ctx.quadraticCurveTo(-5, -hullH + 20, -4.5, -hullH + 34);
  ctx.lineTo(4.5, -hullH + 34);
  ctx.quadraticCurveTo(5, -hullH + 20, 0, -hullH + 4);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(0,8,20,0.98)';
  ctx.lineWidth = 3.5; ctx.stroke();
  const cg2 = ctx.createRadialGradient(-1.5, -hullH + 16, 0, 0, -hullH + 20, 14);
  cg2.addColorStop(0, 'rgba(255,255,255,1)');
  cg2.addColorStop(0.35, 'rgba(180,240,255,0.98)');
  cg2.addColorStop(0.7, 'rgba(60, 160, 220, 0.95)');
  cg2.addColorStop(1, 'rgba(10, 40, 80, 0.98)');
  ctx.fillStyle = cg2; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 1);
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(0, -hullH + 4);
  ctx.quadraticCurveTo(-5, -hullH + 20, -4.5, -hullH + 34);
  ctx.lineTo(4.5, -hullH + 34);
  ctx.quadraticCurveTo(5, -hullH + 20, 0, -hullH + 4);
  ctx.closePath();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-1.5, -hullH + 8);
  ctx.quadraticCurveTo(-3, -hullH + 18, -2.5, -hullH + 28);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -hullH); ctx.lineTo(3, -hullH - 10); ctx.lineTo(-3, -hullH - 10);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(0,8,20,0.98)';
  ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 1);
  ctx.lineWidth = 1.2; ctx.stroke();

  if (tier >= 4) {
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 7, -hullH + 6); ctx.lineTo(side * 9, -hullH - 5); ctx.lineTo(side * 5, -hullH - 5);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(0,8,20,0.98)';
      ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = hex2rgba(C.cyan, 0.9);
      ctx.fill();
      ctx.strokeStyle = hex2rgba(C.cyan, 1);
      ctx.lineWidth = 1; ctx.stroke();
    }
  }

  if (tier >= 2) {
    ctx.font = `bold ${fs(10, 1.5)}px "Consolas", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(-10, 15, 20, 10);
    ctx.strokeStyle = hex2rgba(C.teal, 0.9); ctx.lineWidth = 1; ctx.strokeRect(-10, 15, 20, 10);
    ctx.fillStyle = C.teal;
    ctx.fillText('T' + tier, 0, 20);
  }

  ctx.restore();

  if (state.shield > 0) {
    const shieldRatio = state.shield / state.maxShield;
    const pulse = 0.5 + Math.sin(player.shieldPhase * 2) * 0.15;
    const radius = 66 + pulse * 4 + (tier - 1) * 6;
    ctx.save();
    ctx.translate(px, py + bob);
    ctx.globalAlpha = shieldRatio * 0.7;
    const sg = ctx.createRadialGradient(0, 0, radius*0.6, 0, 0, radius);
    sg.addColorStop(0, 'transparent');
    sg.addColorStop(0.7, hex2rgba(C.cyan, 0.3 * shieldRatio));
    sg.addColorStop(1, hex2rgba(C.cyan, 0.9 * shieldRatio));
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, shieldRatio * 1);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = shieldRatio * 0.5;
    ctx.strokeStyle = hex2rgba(C.blue, 0.9);
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const ang = player.shieldPhase * 0.5 + i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*22, Math.sin(ang)*22);
      ctx.lineTo(Math.cos(ang)*radius, Math.sin(ang)*radius);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (player.invuln > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(state.gameTime * 40) * 0.2;
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(px, py + bob, 78, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawBullets() {
  for (const b of bullets) {
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i], a = (i + 1) / b.trail.length;
      ctx.globalAlpha = a * 0.7;
      const grad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 5 + a*4);
      grad.addColorStop(0, C.white);
      grad.addColorStop(0.4, C.cyan);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(t.x, t.y, 5 + a*4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 14);
    g.addColorStop(0, C.white);
    g.addColorStop(0.35, hex2rgba(C.cyan, 0.95));
    g.addColorStop(0.7, hex2rgba(C.blue, 0.55));
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
    ctx.fillStyle = C.white;
    ctx.fill();
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawShockwaves() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const sw of shockwaves) {
    const t = 1 - sw.life / sw.maxLife;
    ctx.globalAlpha = (1 - t) * 0.8;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 4 * (1 - t) + 1;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawDebris() {
  for (const d of debris) {
    const a = Math.max(0, d.life / d.max);
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < d.points; i++) {
      const ang = (i/d.points)*Math.PI*2;
      const r = d.size * (0.6 + (i%2)*0.4);
      const px = Math.cos(ang)*r, py = Math.sin(ang)*r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawPlaneFragments() {
  for (const f of planeFragments) {
    const a = Math.max(0, f.life / f.max);
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = a;
    if (f.isPanel) {
      ctx.fillStyle = f.color;
      ctx.fillRect(-f.panelW / 2, -f.panelH / 2, f.panelW, f.panelH);
      ctx.strokeStyle = hex2rgba(C.white, 0.6 * a);
      ctx.lineWidth = 0.7;
      ctx.strokeRect(-f.panelW / 2, -f.panelH / 2, f.panelW, f.panelH);
    } else {
      ctx.fillStyle = f.color;
      ctx.beginPath();
      for (let i = 0; i < f.points; i++) {
        const ang = (i / f.points) * Math.PI * 2;
        const r = f.size * (0.45 + ((i % 2) ? 0.55 : 0.35));
        const px = Math.cos(ang) * r;
        const py = Math.sin(ang) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawPopups() {
  for (const p of popups) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `bold ${fs(p.size, 1.5)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }
}

/* ═══ HUD ═══ */
function drawHUD() {
  const u = uiScale;
  ctx.save();
  const barH = 56 + 40 * u;
  const barGrad = ctx.createLinearGradient(0, 0, 0, barH);
  barGrad.addColorStop(0, 'rgba(5, 15, 40, 0.9)');
  barGrad.addColorStop(1, 'rgba(5, 15, 40, 0)');
  ctx.fillStyle = barGrad;
  ctx.fillRect(0, 0, W, barH);
  const by = 8;
  const bh = 38 * u;
  const bw = 200 * u;
  const px = 18;
  roundRect(ctx, px, by, bw, bh, 10);
  const sg1 = ctx.createLinearGradient(px, by, px, by + bh);
  sg1.addColorStop(0, 'rgba(10, 30, 60, 0.9)');
  sg1.addColorStop(1, 'rgba(4, 12, 30, 0.95)');
  ctx.fillStyle = sg1; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 0.8); ctx.lineWidth = 1.6; ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs(11, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.cyan;
  ctx.fillText('◈ SKOR', px + 14, by + bh * 0.32);
  ctx.font = `bold ${fs(20, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText(String(state.score).padStart(6, '0'), px + 14, by + bh * 0.72);

  const cbx = (W - bw) / 2;
  roundRect(ctx, cbx, by, bw, bh, 10);
  const sg2 = ctx.createLinearGradient(cbx, by, cbx, by + bh);
  sg2.addColorStop(0, 'rgba(20, 20, 70, 0.9)');
  sg2.addColorStop(1, 'rgba(8, 8, 35, 0.95)');
  ctx.fillStyle = sg2; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.blue, 0.8); ctx.lineWidth = 1.6; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = `bold ${fs(10, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.blue;
  ctx.fillText('◈ LEVEL / TIER', W/2, by + bh * 0.30);
  ctx.font = `bold ${fs(16, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText(`LV ${state.level}/${MAX_LEVEL}  ·  T${player.tier}`, W/2, by + bh * 0.72);

  const segW = 22 * u, segH = 13 * u, gap = 5 * u;
  const totalW = state.maxHp * segW + (state.maxHp - 1) * gap;
  const startX = W - 18 - totalW;
  ctx.textAlign = 'right';
  ctx.font = `bold ${fs(10, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = state.bossMode ? C.amber : C.cyan;
  ctx.fillText(state.bossMode ? '☠ BOSS' : 'ERA ' + state.level, W - 18, by + bh * 0.22);

  for (let i = 0; i < state.maxHp; i++) {
    const sx = startX + i * (segW + gap);
    const on = i < state.hp;
    const isCrit = state.hp <= 2;
    roundRect(ctx, sx, by + bh * 0.36, segW, segH, 4);
    if (on) {
      const hg = ctx.createLinearGradient(sx, by, sx, by + bh);
      hg.addColorStop(0, isCrit ? C.pink : C.teal);
      hg.addColorStop(1, isCrit ? '#7a1508' : '#005040');
      ctx.fillStyle = hg;
    } else ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  }

  const shY = by + bh * 0.80;
  roundRect(ctx, startX, shY, totalW, 6 * u, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  if (state.shield > 0) {
    const sr = state.shield / state.maxShield;
    roundRect(ctx, startX, shY, totalW * sr, 6 * u, 3);
    const sg = ctx.createLinearGradient(startX, 0, startX + totalW, 0);
    sg.addColorStop(0, C.cyan); sg.addColorStop(1, C.blue);
    ctx.fillStyle = sg;
    ctx.fill();
  }

  const cmW = 200 * u, cmH = 10 * u;
  const cmX = (W - cmW) / 2;
  const cmY = by + bh + 6;
  roundRect(ctx, cmX, cmY, cmW, cmH, cmH / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  const cmRatio = state.comboMeter / 100;
  if (cmRatio > 0) {
    roundRect(ctx, cmX, cmY, cmW * cmRatio, cmH, cmH / 2);
    const cg = ctx.createLinearGradient(cmX, 0, cmX + cmW, 0);
    cg.addColorStop(0, C.teal); cg.addColorStop(1, C.cyan);
    ctx.fillStyle = cg;
    ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs(10, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.teal;
  ctx.fillText('COMBO ' + Math.floor(state.comboMeter) + '%', W/2, cmY + cmH + 9 * u);
  ctx.restore();
}

function drawToast() {
  if (state.toastTimer <= 0) return;
  const a = Math.min(1, state.toastTimer / 0.4);
  ctx.save();
  ctx.globalAlpha = a;
  const cx = W/2, cy = 540;
  const fToast = fs(24, 1.45);
  ctx.font = `bold ${fToast}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const metrics = ctx.measureText(state.toastText);
  const bw = metrics.width + 70;
  const bh = fToast + 32;
  roundRect(ctx, cx - bw/2, cy - bh/2, bw, bh, 12);
  const tg = ctx.createLinearGradient(cx, cy - bh/2, cx, cy + bh/2);
  tg.addColorStop(0, 'rgba(10, 30, 60, 0.95)');
  tg.addColorStop(1, 'rgba(4, 12, 30, 0.95)');
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = state.toastColor; ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = state.toastColor;
  ctx.fillText(state.toastText, cx, cy + 2);
  ctx.restore();
}

/* ═══ MENU ═══ */

  for (let i = 0; i < 4; i++) {
    const y = 40 + i * 24 * mu;

    const t = (state.gameTime * 0.6 + i) % 1;
    grd.addColorStop(0, 'transparent');

    grd.addColorStop(Math.min(1, t + 0.15), 'transparent');

  ctx.fillText('MISI GAGAL', W/2, 138);

  roundRect(ctx, px, py, pw, ph, 20);

  btnG.addColorStop(1, hex2rgba(C.cyan, 0.25));

function drawVictory() {

  roundRect(ctx, px, py, pw, ph, 20);

  ctx.fillStyle = C.teal;
  ctx.fillText('◆  LAPORAN KEMENANGAN', px + 30, py + 32);

  const total = state.hitCorrect + state.hitWrong;

  const colW = (pw - 60) / 2, rowHH = 50 * mu;
  stats.forEach((s, i) => {

    ctx.fillText(s[0], x, y);

  const btnW = Math.min(620, W * 0.50), btnH = 62;
  const btnX = (W - btnW) / 2, btnY = 570;
  roundRect(ctx, btnX, btnY, btnW, btnH, 14);
  const btnG = ctx.createLinearGradient(btnX, 0, btnX + btnW, 0);
  btnG.addColorStop(0, hex2rgba(C.teal, 0.25));
  btnG.addColorStop(0.5, hex2rgba(C.cyan, 0.38));
  btnG.addColorStop(1, hex2rgba(C.teal, 0.25));
  ctx.fillStyle = btnG; ctx.fill();
  ctx.strokeStyle = C.teal; ctx.lineWidth = 2.8;
  ctx.stroke();
  ctx.font = `bold ${Math.round(22 * mu)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.white;
  ctx.fillText('▶  MAIN LAGI  ◀', W/2, btnY + btnH / 2);
  ctx.restore();
}

function render() {
  ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
  ctx.save();
  if (state.shake > 0) ctx.translate((Math.random()-0.5) * state.shake, (Math.random()-0.5) * state.shake);
  drawBackground();
  if (state.mode === 'playing' || state.mode === 'over' || state.mode === 'victory') {
    drawEngineTrails();
    drawSmokePuffs();
    drawQShip();
    drawQShipDebris();
    for (const e of enemies) drawEnemyPanel(e);
    for (const e of enemies) drawEnemyShip(e);
    drawBullets();
    drawShockwaves();
    drawDebris();
    drawPlaneFragments();
    drawParticles();
    drawHeatDistortions();
    drawPlayer();
    drawPopups();
    if (state.mode === 'playing') {
      drawQuestionPanel();
      drawHUD();
      drawToast();
    }
  }
  ctx.restore();

  if (state.flashRed > 0) { ctx.fillStyle = hex2rgba(C.pink, state.flashRed*0.3); ctx.fillRect(0,0,W,H); }
  if (state.flashGreen > 0) { ctx.fillStyle = hex2rgba(C.teal, state.flashGreen*0.2); ctx.fillRect(0,0,W,H); }
  if (state.flashBlue > 0) { ctx.fillStyle = hex2rgba(C.cyan, state.flashBlue*0.25); ctx.fillRect(0,0,W,H); }

  const vg = ctx.createRadialGradient(W/2, H/2, H*0.4, W/2, H/2, H*0.95);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.03;
  for (let y = 0; y < H; y += 3) { ctx.fillStyle = '#000'; ctx.fillRect(0, y, W, 1); }
  ctx.restore();

  if (state.mode === 'menu') drawMenu();
  if (state.mode === 'over') drawGameOver();
  if (state.mode === 'victory') drawVictory();
}

let lastTs = 0;
function loop(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  if (document.body.classList.contains('portrait-locked')) { requestAnimationFrame(loop); return; }
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function canvasCoords(clientX, clientY) {
  const r = cvs.getBoundingClientRect();
  return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
}

function handleStart() {
  initAudio();
  if (state.mode === 'menu' || state.mode === 'over' || state.mode === 'victory') {
    resetGame();
    tone(520, 0.1, 'triangle', 0.055, 880);
    tone(780, 0.14, 'triangle', 0.055, 1200, 0.1);
    tone(1040, 0.18, 'sine', 0.045, 1560, 0.22);
  }
}

cvs.addEventListener('pointerdown', (evt) => {
  evt.preventDefault();
  initAudio();
  if (state.mode !== 'playing') { handleStart(); return; }
  if (state.locked || !state.roundActive) return;
  const { x, y } = canvasCoords(evt.clientX, evt.clientY);
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.alive || e.dying > 0 || e.launching || e.fleeing) continue;
    const shipR = 85;
    const inShip = x >= e.x - shipR && x <= e.x + shipR && y >= e.y - shipR && y <= e.y + shipR;
    const panelCY = e.y + PANEL_BELOW_GAP;
    const inPanel = x >= e.x - PANEL_W / 2 - 26 && x <= e.x + PANEL_W / 2 + 26
                 && y >= panelCY - PANEL_H / 2 - 22 && y <= panelCY + PANEL_H / 2 + 22;
    if (inShip || inPanel) { fire(i); return; }
  }
}, { passive: false });

cvs.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (evt) => {
  initAudio();
  if (evt.code === 'Space' || evt.code === 'Enter') {
    evt.preventDefault();
    if (state.mode !== 'playing') handleStart();
  }
});

window.addEventListener('blur', () => { lastTs = 0; });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

state.gameTime = 0;
requestAnimationFrame(() => resize());
setTimeout(resize, 150);
setTimeout(resize, 500);
</script>

function resize() {
  const locked = updateOrientationOverlay();

  const rect = wrap.getBoundingClientRect();
  const vw = rect.width, vh = rect.height;
  if (vw < 10 || vh < 10) { setTimeout(resize, 80); return; }
  const aspect = clamp(vw / vh, 1.4, 2.8);
  const newW = Math.round(BASE_H * aspect);
  if (Math.abs(newW - W) > 20) {
    W = newW; H = BASE_H;

  const padding = 0.998;
  const s = Math.min(vw / W, vh / H) * padding;

  baseScale = cvs.width / W;

}

let actx = null;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, t='square', v=0.06, s=null, dl=0) {
  if (!actx) return;
  const t0 = actx.currentTime + dl;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = t; o.frequency.setValueAtTime(f, t0);
  if (s) o.frequency.exponentialRampToValueAtTime(Math.max(20, s), t0 + d);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(v, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}
function noiseBurst(d=0.3, v=0.12, c=900, q=1) {
  if (!actx) return;
  const len = Math.floor(actx.sampleRate * d);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const da = buf.getChannelData(0);
  for (let i = 0; i < len; i++) da[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.7);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = v;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = c; f.Q.value = q;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  if (r < 0) r = 0;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function wrapText(text, maxWidth, font) {
  const prev = ctx.font; ctx.font = font;
  const words = text.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  ctx.font = prev;
  return lines;
}

  if      (r < 0.13) type = 'hominid';
  else if (r < 0.24) type = 'hunter';
  else if (r < 0.34) type = 'mammoth';
  else if (r < 0.44) type = 'campfire';
  else if (r < 0.53) type = 'tree';
  else if (r < 0.62) type = 'hut';
  else if (r < 0.70) type = 'menhir';
  else if (r < 0.78) type = 'ziggurat';
  else if (r < 0.85) type = 'pyramid';
  else if (r < 0.91) type = 'column';
  else if (r < 0.96) type = 'mountain';
  else                type = 'smokeColumn';

  const layerRoll = Math.random();
  let layer;
  if (layerRoll < 0.45) layer = 0;
  else if (layerRoll < 0.80) layer = 1;
  else layer = 2;

  const layerSizes = {
    hominid:     [24, 38, 54],
    hunter:      [26, 42, 60],
    mammoth:     [60, 90, 128],
    campfire:    [38, 60, 88],
    tree:        [55, 90, 130],
    hut:         [55, 85, 120],
    menhir:      [40, 65, 95],
    ziggurat:    [90, 140, 200],
    pyramid:     [100, 160, 230],
    column:      [80, 130, 190],
    mountain:    [220, 340, 480],
    smokeColumn: [110, 160, 230],
  };
  const layerAlphas = [0.28, 0.50, 0.78];
  const layerVs     = [8, 20, 42];

  const size = layerSizes[type][layer] * (0.85 + Math.random() * 0.30);

  const palettes = [
    [ 6, 16, 40],
    [ 8, 20, 48],
    [ 5, 12, 32],
    [ 10, 22, 54],
  ];
  const pal = palettes[Math.floor(Math.random() * palettes.length)];

  return {
    type, size, layer,
    x: Math.random() * W,
    y: atTop ? -size * 2 - Math.random() * H * 0.55 : Math.random() * H,
    v: layerVs[layer] * (0.7 + Math.random() * 0.6),
    alpha: layerAlphas[layer],
    flip: Math.random() < 0.5 ? 1 : -1,
    rot: 0, rotV: (Math.random() - 0.5) * 0.10,
    pal,
    phase: Math.random() * Math.PI * 2,
    variant: Math.floor(Math.random() * 3),
  };
}

function initBackground() {
  stars = [];
  for (let i = 0; i < 280; i++) {
    const layer = i < 170 ? 0 : i < 235 ? 1 : 2;
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: layer === 0 ? Math.random() * 0.9 + 0.35
        : layer === 1 ? Math.random() * 1.5 + 0.65
        : Math.random() * 2.3 + 1.1,
      v: layer === 0 ? 12 : layer === 1 ? 34 : 72,
      a: layer === 0 ? 0.28 : layer === 1 ? 0.52 : 0.82,
      layer,
      twinkle: Math.random() * Math.PI * 2,
      isEmber: Math.random() < 0.55,
      hue: 185 + Math.random() * 60,
      drift: (Math.random() - 0.5) * 16,
    });
  }

  nebulaClouds = [];
  for (let i = 0; i < 7; i++) {
    nebulaClouds.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 200 + Math.random() * 320,
      v: 5 + Math.random() * 12,
      hue: 195 + Math.random() * 40,
      a: 0.05 + Math.random() * 0.065,
    });
  }

  auroraBands = [];
  for (let i = 0; i < 4; i++) {
    auroraBands.push({
      y: 80 + i * 90 + Math.random() * 40,
      amp: 30 + Math.random() * 50,
      speed: 0.1 + Math.random() * 0.15,
      phase: Math.random() * Math.PI * 2,
      hue: 180 + Math.random() * 40,
      alpha: 0.08 + Math.random() * 0.06,
    });
  }

  spaceObjects = [];
  for (let i = 0; i < 24; i++) spaceObjects.push(makeWorldObject(false));

  distantFlashes = [];
}

initBackground();
bgReady = true;

function silColor(pal, a) {
  return `rgba(${pal[0]}, ${pal[1]}, ${pal[2]}, ${a})`;
}

function drawSilHominid(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  ctx.beginPath(); ctx.arc(s * 0.08, -s * 1.18, s * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.20, -s * 1.10, s * 0.12, s * 0.09, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.05, -s * 1.28, s * 0.20, s * 0.06, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.10, -s * 1.05); ctx.lineTo( s * 0.32, -s * 1.02);
  ctx.lineTo( s * 0.24, -s * 0.35); ctx.lineTo(-s * 0.14, -s * 0.35);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.14, -s * 1.00); ctx.lineTo(-s * 0.32, -s * 0.55);
  ctx.lineTo(-s * 0.24, -s * 0.52); ctx.lineTo(-s * 0.06, -s * 0.98);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo( s * 0.28, -s * 0.98); ctx.lineTo( s * 0.42, -s * 0.60);
  ctx.lineTo( s * 0.32, -s * 0.56); ctx.lineTo( s * 0.20, -s * 0.94);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.40, -s * 0.48, s * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.12, -s * 0.35); ctx.lineTo(-s * 0.06, -s * 0.02);
  ctx.lineTo( s * 0.04, -s * 0.02); ctx.lineTo( s * 0.02, -s * 0.35);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo( s * 0.10, -s * 0.35); ctx.lineTo( s * 0.20, -s * 0.02);
  ctx.lineTo( s * 0.30, -s * 0.02); ctx.lineTo( s * 0.22, -s * 0.35);
  ctx.closePath(); ctx.fill();
}

function drawSilHunter(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  ctx.beginPath(); ctx.arc(0, -s * 1.36, s * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -s * 1.42, s * 0.20, Math.PI * 1.1, Math.PI * 1.9); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.22, -s * 1.16); ctx.lineTo( s * 0.22, -s * 1.16);
  ctx.lineTo( s * 0.18, -s * 0.36); ctx.lineTo(-s * 0.18, -s * 0.36);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.20, -s * 1.10); ctx.lineTo(-s * 0.34, -s * 0.60);
  ctx.lineTo(-s * 0.24, -s * 0.58); ctx.lineTo(-s * 0.10, -s * 1.08);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo( s * 0.20, -s * 1.10); ctx.lineTo( s * 0.34, -s * 0.62);
  ctx.lineTo( s * 0.24, -s * 0.60); ctx.lineTo( s * 0.10, -s * 1.08);
  ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.translate(-s * 0.30, -s * 0.80); ctx.rotate(-0.35);
  ctx.fillRect(-s * 0.025, -s * 1.15, s * 0.05, s * 1.80);
  ctx.beginPath();
  ctx.moveTo(0, -s * 1.20); ctx.lineTo(-s * 0.07, -s * 1.05); ctx.lineTo( s * 0.07, -s * 1.05);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillRect(-s * 0.16, -s * 0.36, s * 0.13, s * 0.36);
  ctx.fillRect( s * 0.05, -s * 0.36, s * 0.13, s * 0.36);
  ctx.fillRect(-s * 0.20, -s * 0.04, s * 0.20, s * 0.04);
  ctx.fillRect( s * 0.02, -s * 0.04, s * 0.20, s * 0.04);
}

function drawSilMammoth(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  ctx.beginPath(); ctx.ellipse(s * 0.05, -s * 0.60, s * 0.72, s * 0.50, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-s * 0.60, -s * 0.75, s * 0.32, s * 0.30, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.86, -s * 0.65);
  ctx.quadraticCurveTo(-s * 1.20, -s * 0.40, -s * 1.05, -s * 0.05);
  ctx.quadraticCurveTo(-s * 0.98, s * 0.05, -s * 0.92, -s * 0.05);
  ctx.quadraticCurveTo(-s * 1.02, -s * 0.42, -s * 0.82, -s * 0.68);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.88, -s * 0.58);
  ctx.quadraticCurveTo(-s * 1.30, -s * 0.75, -s * 1.05, -s * 1.00);
  ctx.quadraticCurveTo(-s * 1.12, -s * 0.78, -s * 0.86, -s * 0.62);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  const backY = -s * 1.06;
  ctx.moveTo(-s * 0.55, backY);
  for (let i = 0; i < 8; i++) {
    const x = -s * 0.55 + i * s * 0.17;
    ctx.lineTo(x + s * 0.08, backY - s * 0.10);
    ctx.lineTo(x + s * 0.17, backY);
  }
  ctx.lineTo(s * 0.72, backY); ctx.lineTo(s * 0.72, backY + s * 0.06);
  ctx.lineTo(-s * 0.55, backY + s * 0.06);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(-s * 0.55, -s * 0.18, s * 0.22, s * 0.34);
  ctx.fillRect(-s * 0.18, -s * 0.18, s * 0.22, s * 0.34);
  ctx.fillRect( s * 0.22, -s * 0.18, s * 0.22, s * 0.34);
  ctx.fillRect( s * 0.52, -s * 0.18, s * 0.22, s * 0.34);
}

function drawSilCampfire(s, pal, a) {
  const positions = [
    { x: -s * 0.55, y: 0, flip: 1 },
    { x:  s * 0.55, y: 0, flip: -1 },
    { x:  0,        y: s * 0.06, flip: 1 },
  ];
  for (const p of positions) {
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.flip < 0) ctx.scale(-1, 1);
    ctx.fillStyle = silColor(pal, a);
    ctx.beginPath(); ctx.arc(0, -s * 0.75, s * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s * 0.16, -s * 0.60); ctx.lineTo( s * 0.16, -s * 0.60);
    ctx.lineTo( s * 0.20, -s * 0.20); ctx.lineTo(-s * 0.20, -s * 0.20);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s * 0.20, -s * 0.20); ctx.lineTo(-s * 0.34, s * 0.00); ctx.lineTo(-s * 0.18, s * 0.00);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo( s * 0.20, -s * 0.20); ctx.lineTo( s * 0.34, s * 0.00); ctx.lineTo( s * 0.18, s * 0.00);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const flick = 0.75 + Math.sin(Date.now() * 0.008 + pal[0]) * 0.25;
  const glow = ctx.createRadialGradient(0, -s * 0.25, 0, 0, -s * 0.25, s * 0.65);
  glow.addColorStop(0, `rgba(120, 220, 255, ${a * 0.55 * flick})`);
  glow.addColorStop(0.5, `rgba(60, 160, 255, ${a * 0.25 * flick})`);
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, -s * 0.25, s * 0.65, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(200, 240, 255, ${a * 0.85})`;
  ctx.beginPath();
  ctx.moveTo(-s * 0.10, -s * 0.05);
  ctx.quadraticCurveTo(-s * 0.14, -s * 0.28, 0, -s * 0.40 - Math.sin(Date.now() * 0.01) * s * 0.04);
  ctx.quadraticCurveTo( s * 0.14, -s * 0.28,  s * 0.10, -s * 0.05);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(255, 200, 120, ${a * 0.7})`;
  ctx.beginPath();
  ctx.moveTo(-s * 0.05, -s * 0.05);
  ctx.quadraticCurveTo(-s * 0.07, -s * 0.18, 0, -s * 0.24);
  ctx.quadraticCurveTo( s * 0.07, -s * 0.18,  s * 0.05, -s * 0.05);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawSilHut(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  ctx.beginPath();
  ctx.moveTo(-s * 0.65, 0); ctx.lineTo(-s * 0.65, -s * 0.55);
  ctx.quadraticCurveTo(0, -s * 0.62, s * 0.65, -s * 0.55);
  ctx.lineTo(s * 0.65, 0); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.75, -s * 0.55);
  const segments = 9;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = -s * 0.75 + t * s * 1.50;
    const y = -s * 0.55 - Math.sin(t * Math.PI) * s * 0.55 + (i % 2 === 0 ? 0 : -s * 0.05);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(s * 0.75, -s * 0.55);
  ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.moveTo(-s * 0.15, 0); ctx.lineTo(-s * 0.15, -s * 0.30);
  ctx.quadraticCurveTo(0, -s * 0.40, s * 0.15, -s * 0.30);
  ctx.lineTo(s * 0.15, 0); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawSilMenhir(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  ctx.beginPath();
  ctx.moveTo(-s * 0.18, 0); ctx.lineTo(-s * 0.24, -s * 0.90);
  ctx.lineTo(-s * 0.14, -s * 1.35); ctx.lineTo( s * 0.10, -s * 1.30);
  ctx.lineTo( s * 0.22, -s * 0.75); ctx.lineTo( s * 0.18, 0);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.32, 0); ctx.lineTo(s * 0.36, -s * 0.50);
  ctx.lineTo(s * 0.52, -s * 0.45); ctx.lineTo(s * 0.52, 0);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.40, 0); ctx.lineTo(-s * 0.42, -s * 0.35);
  ctx.lineTo(-s * 0.54, -s * 0.32); ctx.lineTo(-s * 0.56, 0);
  ctx.closePath(); ctx.fill();
}

function drawSilZiggurat(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  const tiers = 4;
  const baseW = s * 1.60, baseH = s * 1.30;
  for (let i = 0; i < tiers; i++) {
    const t = i / tiers;
    const tw = baseW * (1 - t * 0.55);
    const th = baseH / tiers;
    const ty = -baseH + i * th;
    ctx.fillRect(-tw / 2, ty, tw, th + 2);
  }
  ctx.fillRect(-s * 0.15, -baseH - s * 0.22, s * 0.30, s * 0.22);
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.moveTo(-s * 0.10, 0); ctx.lineTo(-s * 0.06, -baseH + s * 0.05);
  ctx.lineTo( s * 0.06, -baseH + s * 0.05); ctx.lineTo( s * 0.10, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawSilPyramid(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  ctx.beginPath();
  ctx.moveTo(-s * 1.00, 0); ctx.lineTo(0, -s * 1.40); ctx.lineTo(s * 1.00, 0);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.45, 0); ctx.lineTo(s * 0.75, -s * 0.70); ctx.lineTo(s * 1.10, 0);
  ctx.closePath(); ctx.fill();
}

function drawSilColumn(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  ctx.fillRect(-s * 0.90, -s * 0.12, s * 1.80, s * 0.12);
  ctx.fillRect(-s * 0.82, -s * 0.20, s * 1.64, s * 0.08);
  const cols = [
    { x: -s * 0.65, h: 0.85, broken: false },
    { x: -s * 0.22, h: 0.65, broken: true },
    { x:  s * 0.22, h: 0.92, broken: false },
    { x:  s * 0.65, h: 0.55, broken: true },
  ];
  for (const col of cols) {
    const colW = s * 0.14;
    if (!col.broken) ctx.fillRect(col.x - colW * 0.7, -s * (0.20 + col.h), colW * 1.4, s * 0.08);
    ctx.fillRect(col.x - colW / 2, -s * (0.20 + col.h), colW, s * col.h);
    ctx.fillRect(col.x - colW * 0.65, -s * 0.20, colW * 1.3, s * 0.08);
  }
}

function drawSilTree(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  ctx.beginPath();
  ctx.moveTo(-s * 0.12, 0); ctx.lineTo(-s * 0.07, -s * 0.60);
  ctx.lineTo(-s * 0.10, -s * 1.15); ctx.lineTo( s * 0.10, -s * 1.15);
  ctx.lineTo( s * 0.07, -s * 0.60); ctx.lineTo( s * 0.12, 0);
  ctx.closePath(); ctx.fill();
  const branches = [
    [ -0.09, -0.90,  -0.60, -1.40 ], [  0.09, -0.95,   0.60, -1.45 ],
    [ -0.07, -0.75,  -0.45, -1.10 ], [  0.07, -0.70,   0.45, -1.05 ],
    [ -0.06, -1.10,  -0.28, -1.60 ], [  0.06, -1.10,   0.30, -1.65 ],
  ];
  ctx.lineCap = 'round';
  for (const [x1, y1, x2, y2] of branches) {
    ctx.lineWidth = s * 0.055;
    ctx.beginPath();
    ctx.moveTo(x1 * s, y1 * s); ctx.lineTo(x2 * s, y2 * s);
    ctx.strokeStyle = silColor(pal, a); ctx.stroke();
  }
}

function drawSilMountain(s, pal, a) {
  ctx.fillStyle = silColor(pal, a);
  ctx.beginPath();
  ctx.moveTo(-s * 1.00, 0); ctx.lineTo(-s * 0.35, -s * 0.95);
  ctx.lineTo(-s * 0.10, -s * 0.80); ctx.lineTo( s * 0.25, -s * 1.05);
  ctx.lineTo( s * 0.60, -s * 0.60); ctx.lineTo( s * 1.00, 0);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.60, 0); ctx.lineTo(s * 0.85, -s * 0.45); ctx.lineTo(s * 1.20, 0);
  ctx.closePath(); ctx.fill();
}

function drawSilSmokeColumn(s, pal, a) {
  const puffs = 8;
  for (let i = 0; i < puffs; i++) {
    const t = i / (puffs - 1);
    const cy = -t * s * 1.5;
    const cx = Math.sin(t * 4.2 + pal[0] * 0.1) * s * 0.15;
    const radius = s * (0.30 + t * 0.55);
    const alpha = a * (0.85 - t * 0.60);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    g.addColorStop(0, `rgba(${pal[0] + 15}, ${pal[1] + 28}, ${pal[2] + 45}, ${alpha})`);
    g.addColorStop(0.6, `rgba(${pal[0] + 25}, ${pal[1] + 40}, ${pal[2] + 60}, ${alpha * 0.35})`);
    g.addColorStop(1, `rgba(${pal[0]}, ${pal[1]}, ${pal[2]}, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
  }
}

function drawWorldObject(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  if (o.flip < 0) ctx.scale(-1, 1);
  if (o.rot) ctx.rotate(o.rot);
  const a = o.alpha;
  const pal = o.pal;
  switch (o.type) {
    case 'hominid':     drawSilHominid(o.size, pal, a); break;
    case 'hunter':      drawSilHunter(o.size, pal, a); break;
    case 'mammoth':     drawSilMammoth(o.size, pal, a); break;
    case 'campfire':    drawSilCampfire(o.size, pal, a); break;
    case 'tree':        drawSilTree(o.size, pal, a); break;
    case 'hut':         drawSilHut(o.size, pal, a); break;
    case 'menhir':      drawSilMenhir(o.size, pal, a); break;
    case 'ziggurat':    drawSilZiggurat(o.size, pal, a); break;
    case 'pyramid':     drawSilPyramid(o.size, pal, a); break;
    case 'column':      drawSilColumn(o.size, pal, a); break;
    case 'mountain':    drawSilMountain(o.size, pal, a); break;
    case 'smokeColumn': drawSilSmokeColumn(o.size, pal, a); break;
  }
  ctx.restore();
}

function drawWorldObjects() {
  const sorted = spaceObjects.slice().sort((a, b) => a.layer - b.layer);
  for (const o of sorted) drawWorldObject(o);
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, 'rgba(1, 6, 16, 0.55)');
  g.addColorStop(0.35, 'rgba(5, 18, 40, 0.48)');
  g.addColorStop(0.62, 'rgba(8, 32, 64, 0.42)');
  g.addColorStop(0.85, 'rgba(4, 24, 48, 0.50)');
  g.addColorStop(1.00, 'rgba(1, 5, 16, 0.62)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of auroraBands) {
    const t = state.gameTime * b.speed + b.phase;
    ctx.beginPath();
    ctx.moveTo(0, b.y + Math.sin(t) * b.amp);
    for (let x = 0; x <= W; x += 40) {
      const yy = b.y + Math.sin(t + x * 0.005) * b.amp + Math.sin(t * 1.3 + x * 0.01) * b.amp * 0.4;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    const grad = ctx.createLinearGradient(0, b.y - 40, 0, b.y + 80);
    grad.addColorStop(0, `hsla(${b.hue}, 90%, 60%, 0)`);
    grad.addColorStop(0.5, `hsla(${b.hue}, 90%, 60%, ${b.alpha})`);
    grad.addColorStop(1, `hsla(${b.hue + 20}, 90%, 55%, 0)`);
    ctx.fillStyle = grad; ctx.fill();
  }
  ctx.restore();

  const horizonY = H * 0.72;
  const hg = ctx.createRadialGradient(W / 2, horizonY, 40, W / 2, horizonY, W * 0.85);
  hg.addColorStop(0, 'rgba(20, 100, 190, 0.18)');
  hg.addColorStop(0.45, 'rgba(10, 60, 130, 0.08)');
  hg.addColorStop(1, 'transparent');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  for (const n of nebulaClouds) {
    const rg = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    rg.addColorStop(0, `hsla(${n.hue}, 60%, 20%, ${n.a * 1.2})`);
    rg.addColorStop(0.55, `hsla(${n.hue - 10}, 55%, 12%, ${n.a * 0.5})`);
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  drawWorldObjects();

  for (const s of stars) {
    const tw = 0.85 + Math.sin(s.twinkle) * 0.15;
    ctx.globalAlpha = s.a * tw * 0.7;
    if (s.isEmber) {
      const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.s * 3.5);
      glow.addColorStop(0, `hsla(${s.hue}, 95%, 72%, 0.95)`);
      glow.addColorStop(0.35, `hsla(${s.hue}, 92%, 55%, 0.45)`);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s * 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `hsl(${s.hue}, 95%, 80%)`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s * 0.95, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(180, 210, 240, 0.65)';
      ctx.fillRect(s.x, s.y, s.s * 0.9, s.s * 1.2);
    }
  }
  ctx.globalAlpha = 1;

  for (const f of distantFlashes) {
    const a = Math.max(0, f.life / f.maxLife);
    const rg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    rg.addColorStop(0, `rgba(180, 230, 255, ${a * 0.7})`);
    rg.addColorStop(0.4, `rgba(80, 150, 255, ${a * 0.35})`);
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
}

function horizonYAt() { return H * 0.72; }

/* ═══ EFEK ═══ */
function explosion(x, y, color, count=30, power=280, sizeMul=1) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * power + 40;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.5 + Math.random()*0.9, max: 1.2, size: (Math.random()*3.5+1.2)*sizeMul, color, glow: Math.random() > 0.5 });
  }
  for (let i = 0; i < count*0.6; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * power * 1.6 + 80;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.3+Math.random()*0.5, max: 0.8, size: Math.random()*2+1, color: C.white, glow: true });
  }
}
function shockwave(x, y, color, maxR=90, life=0.5) { shockwaves.push({ x, y, r: 6, maxR, life, maxLife: life, color }); }
function debrisBurst(x, y, color, count=8) {

}
function popup(x, y, text, color, size=22) { popups.push({ x, y, text, color, size, life: 1.2, maxLife: 1.2, vy: -70 }); }
function toast(text, color) { state.toastText = text; state.toastColor = color; state.toastTimer = 1.6; }
function spawnEngineTrail(x, y, color) { engineTrails.push({ x, y, vx: (Math.random()-0.5)*30, vy: 100 + Math.random()*80, life: 0.6, max: 0.6, size: 4 + Math.random()*4, color }); }
function spawnSmokePuff(x, y, sizeMul=1) {

/* ═══ RESET / ROUND ═══ */
function resetGame() {
  state.score = 0; state.hp = state.maxHp; state.shield = state.maxShield;
  state.level = 1; state.correctCount = 0;
  state.streak = 0; state.bestStreak = 0;
  state.hitCorrect = 0; state.hitWrong = 0;
  state.gameTime = 0; state.comboMeter = 0;
  state.shake = 0; state.flashRed = 0; state.flashGreen = 0; state.flashBlue = 0;
  state.toastTimer = 0; state.bossMode = false;
  state.qPanelSlide = 0;
  state.wrongThisRound = 0;
  state.questionFailed = false;
  state.correctMarkTimer = 0;
  state.incomingThreat = 0;
  state.incomingThreatTarget = 0;
  player.x = W / 2; player.y = 610; player.targetX = W / 2;
  player.vx = 0; player.bank = 0;
  player.weaponLevel = 1; player.overdrive = 0; player.invuln = 1.5;
  player.tier = 1; player.tierFlash = 0;
  player.autoT = 0;
  questionPool = shuffle([...QUESTIONS]);
  enemies = []; bullets = []; enemyBullets = []; particles = [];
  shockwaves = []; debris = []; popups = []; engineTrails = [];
  qShipDebris = []; planeFragments = []; smokePuffs = []; heatDistortions = [];
  lockOnEffects = [];
  state.mode = 'playing';
  newRound();
}

function newRound() {
  if (questionPool.length === 0) questionPool = shuffle([...QUESTIONS]);
  const q = questionPool.pop();
  currentQuestion = q;
  const opts = q.o.map((text, i) => ({ text, correct: i === q.a }));
  shuffle(opts);
  state.bossMode = (state.level >= 5 && state.level % 5 === 0 && state.level < MAX_LEVEL);

  qShip.x = W / 2; qShip.y = qShip.entryY; qShip.baseY = 80;
  qShip.state = 'entering'; qShip.entryT = 0; qShip.hoverT = 0;
  qShip.reactorPulse = 0; qShip.ringAngle = 0; qShip.ringAngle2 = 0;
  qShip.thrusterPulse = 0; qShip.engineGlow = 0;
  qShip.explodeT = 0; qShip.explodeRingR = 0; qShip.explodeRingR2 = 0;
  qShip.chargeLevel = 0; qShip.alarmPulse = 0;
  qShip.leaveVx = 0; qShip.leaveVy = 0; qShip.rotZ = 0;
  qShip.smokeEmitters = [];
  state.qPanelSlide = 0;

  enemies = opts.map((o, i) => ({
    baseX: COL_X[i], baseY: SHIP_Y_START,
    x: COL_X[i], y: -280 - i * 70,
    text: o.text, correct: o.correct,
    alive: true, dying: 0, scale: 1, rot: 0,
    engine: Math.random() * Math.PI * 2,
    flash: 0, type: i,
    hp: state.bossMode ? (o.correct ? 2 : 1) : 1,
    launching: false, launchVy: 0, launchSpin: 0,
    fleeing: false, fleeVx: 0, fleeVy: 0, fleeRot: 0, fleeSpin: 0,
    panelScale: 0, panelFlash: 0,
    bank: 0, bankTarget: 0,
    pitch: 0, pitchTarget: 0, wingFlex: 0,
    smokeTimer: 0, afterburner: 0,
    targetX: COL_X[i], targetY: -280 - i * 70,
    shootCooldown: 2.5 + Math.random() * 4.0,
    shootWarnTimer: 0,
    isChargingShot: false,
  }));

  state.timeMax = Math.max(11, 23 - (state.level - 1) * 1.25);
  state.timeLeft = state.timeMax;
  state.roundActive = true;
  state.locked = false;
  state.wrongThisRound = 0;
  state.questionFailed = false;
  state.incomingThreatTarget = 0;
}

    '#c8d0d8', '#8c99a8', '#485566', '#1c2634',
    '#6090d0', '#1e4a8a', '#0a2050', '#80c8ff',

  explosion(e.x, e.y, '#a0e0ff', 32, 130, 1.9);
  explosion(e.x, e.y, C.cyan, 42, 230, 1.7);
  explosion(e.x, e.y, C.blue, 38, 270, 1.5);
  explosion(e.x, e.y, C.white, 30, 350, 1.1);

      y: e.y + (Math.random() - 0.5) * 140,

/* ★ MUSUH MENEMBAK — peluru HIJAU */
function enemyFire(e) {
  if (!e.alive || e.dying > 0 || e.launching || e.fleeing) return;
  const px = player.x + player.vx * 0.15;
  const py = player.y;
  const ex = e.x;
  const ey = e.y + 30;
  const dx = px - ex;
  const dy = py - ey;
  const dist = Math.hypot(dx, dy) || 1;
  const nx = dx / dist;
  const ny = dy / dist;
  const speed = 260 + state.level * 12;

  enemyBullets.push({
    x: ex, y: ey,
    vx: nx * speed,
    vy: ny * speed,
    life: 6, max: 6,
    size: 9,
    rot: Math.atan2(ny, nx) + Math.PI / 2,
    trail: [],
    wobble: Math.random() * Math.PI * 2,
    aimed: true,
  });

  tone(320, 0.14, 'sawtooth', 0.06, 140);
  tone(220, 0.1, 'square', 0.045);
  noiseBurst(0.15, 0.06, 1400);

  for (let i = 0; i < 6; i++) {
    particles.push({
      x: ex + (Math.random()-0.5)*10, y: ey + (Math.random()-0.5)*10,
      vx: (Math.random()-0.5)*120, vy: 60 + Math.random()*120,
      life: 0.12, max: 0.12, size: 2.5 + Math.random()*3,
      color: '#60ff90', glow: true
    });
  }
}

function fire(idx) {
  if (state.mode !== 'playing' || state.locked || !state.roundActive) return;
  const e = enemies[idx];
  if (!e || !e.alive || e.dying > 0 || e.launching || e.fleeing) return;
  state.locked = true;
  const shots = player.weaponLevel;
  for (let s = 0; s < shots; s++) {
    const spread = (s - (shots - 1) / 2) * 24;
    const startX = player.x + spread;
    const startY = player.y - 40;
    bullets.push({
      aimX: startX,
      aimY: startY,
      x: startX,
      y: startY,
      target: e,
      speed: 340,
      t: 0,
      phase: Math.random() * Math.PI * 2,
      wobbleAmp: 72,
      wobbleFreq: 5.5,
      perp: 0,
      aimDirX: 0, aimDirY: -1,
      smokeT: 0,
      rot: 0,
      trail: [],
    });
  }
  lockOnEffects.push({
    enemy: e,
    life: 3.0, maxLife: 3.0,
    t: 0,
  });
  tone(1500, 0.06, 'square', 0.035, 900);
  tone(1100, 0.1, 'sawtooth', 0.03, 600, 0.05);

  for (let i = 0; i < 8; i++) {
    particles.push({ x: player.x, y: player.y - 30, vx: (Math.random()-0.5)*120, vy: -Math.random()*180, life: 0.15, max: 0.15, size: 3+Math.random()*3, color: C.cyan, glow: true });
  }
  spawnHeatDistortion(player.x, player.y - 40, 30);
  tone(1200, 0.06, 'sawtooth', 0.035, 400);
  tone(2200, 0.04, 'square', 0.022, 800);
}

function resolveHit(bullet, enemy) {
  lockOnEffects = lockOnEffects.filter(lo => lo.enemy !== enemy);

  if (enemy.correct) {
    if (enemy.hp > 1) {
      enemy.hp--; enemy.flash = 0.2;
      explosion(enemy.x, enemy.y, C.cyan, 20, 240);
      spawnSmokePuff(enemy.x, enemy.y, 0.6);
      tone(600, 0.08, 'square', 0.05);
      state.locked = false;
      return;
    }
    state.hitCorrect++; state.correctCount++; state.streak++;
    state.comboMeter = Math.min(100, state.comboMeter + 22);
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const timeBonus = Math.floor(state.timeLeft * 8);
    const streakBonus = state.streak >= 2 ? state.streak * 75 : 0;
    const comboBonus = state.comboMeter >= 100 ? 500 : 0;
    const gained = 100 + timeBonus + streakBonus + comboBonus;
    state.score += gained;

    state.correctMarkX = enemy.x;
    state.correctMarkY = enemy.y;
    state.correctMarkTimer = 2.2;
    state.correctMarkColor = C.teal;

    qShip.state = 'leaving';
    qShip.leaveVx = (Math.random() - 0.5) * 200;
    qShip.leaveVy = -50;
    qShip.engineGlow = 1;
    explosion(qShip.x, qShip.y, C.teal, 40, 360, 1.3);
    shockwave(qShip.x, qShip.y, C.teal, 260, 0.8);

    enemies.forEach(o => {
      if (o !== enemy && o.alive && o.dying <= 0 && !o.launching && !o.fleeing) {
        o.fleeing = true;
        o.fleeVx = (Math.random() - 0.5) * 40;
        o.fleeVy = 450 + Math.random() * 250;
        o.fleeSpin = (Math.random() - 0.5) * 0.8;
        o.fleeRot = 0;
        o.bankTarget = 0;
        o.panelScale = 0;
      }
    });
    enemyBullets.forEach(eb => { eb.life = Math.min(eb.life, 0.4); });

    enemy.panelFlash = 0.6;
    destroyEnemyPlane(enemy);
    enemy.alive = false;
    enemy.launching = false;
    enemy.dying = 0.001;

    tone(880, 0.08, 'square', 0.07);
    tone(1320, 0.14, 'sine', 0.055, 1980, 0.04);
    tone(1760, 0.22, 'sine', 0.045, 2640, 0.09);

    let msg = `✓ +${gained}`;
    if (streakBonus) msg += `  [COMBO ×${state.streak}]`;
    if (comboBonus) msg += `  ⚡ OVERDRIVE!`;
    toast(msg, C.teal);
    popup(enemy.x, enemy.y, `+${gained}`, C.teal, 26);
    popup(enemy.x, enemy.y - 60, '✓ JAWABAN BENAR', C.teal, 22);

    const newTier = Math.min(5, Math.floor(state.correctCount / 3) + 1);
    if (newTier > player.tier) {
      player.tier = newTier;
      player.tierFlash = 1.2;
      toast(`⬆  PESAWAT UPGRADE — TIER ${newTier}!`, C.cyan);
      explosion(player.x, player.y, C.cyan, 45, 420, 1.5);
      shockwave(player.x, player.y, C.cyan, 220, 0.9);
      state.flashBlue = 0.8;
      tone(440, 0.12, 'triangle', 0.07);
      tone(660, 0.15, 'triangle', 0.07, null, 0.1);
      tone(880, 0.2, 'triangle', 0.07, null, 0.22);
    }
    if (state.comboMeter >= 100) {
      state.comboMeter = 0;
      player.overdrive = 6;
      player.weaponLevel = Math.min(3, player.weaponLevel + 1);
      state.flashBlue = 0.7;
      toast('⚡ OVERDRIVE AKTIF!', C.cyan);
      tone(440, 0.15, 'sine', 0.06);
      tone(660, 0.2, 'sine', 0.06, 880, 0.1);
    }
    state.roundActive = false;
    state.nextRoundIn = 1.35;

    if (state.correctCount >= MAX_LEVEL * QUESTIONS_PER_LEVEL) { triggerVictory(); return; }
    const newLevel = Math.floor(state.correctCount / QUESTIONS_PER_LEVEL) + 1;
    if (newLevel > state.level) {
      state.level = Math.min(MAX_LEVEL, newLevel);
      toast(`◆ LEVEL ${state.level} / ${MAX_LEVEL} ◆`, C.amber);
      tone(660, 0.12, 'triangle', 0.055);
      tone(990, 0.16, 'triangle', 0.055, null, 0.12);
    }
  } else {
    state.hitWrong++; state.streak = 0;
    state.comboMeter = Math.max(0, state.comboMeter - 30);
    state.wrongThisRound++;
    enemy.launching = true; enemy.launchVy = 400; enemy.panelFlash = 0.5;

    if (state.wrongThisRound >= MAX_WRONG_PER_ROUND && !state.questionFailed) { failQuestion(); return; }

    if (state.shield > 0) {
      state.shield = Math.max(0, state.shield - 55);
      if (state.shield === 0) { toast('⚠ PERISAI HANCUR!', C.amber); state.flashBlue = 0.8; }
      else toast('✗ SALAH — Perisai diserap!', C.amber);
      explosion(enemy.x, enemy.y, C.amber, 30, 300);
      shockwave(enemy.x, enemy.y, C.amber, 120, 0.5);
      spawnSmokePuff(enemy.x, enemy.y, 0.5);
      tone(180, 0.25, 'sawtooth', 0.07, 60);
      noiseBurst(0.35, 0.13);
      state.shake = Math.max(state.shake, 4);
      state.locked = false;
      const remaining = enemies.filter(o => o.alive && o.dying <= 0 && !o.launching && !o.fleeing);
      if (remaining.length <= 1) { state.roundActive = false; state.nextRoundIn = 1.15; }
    } else {
      state.hp--;
      explosion(enemy.x, enemy.y, C.pink, 34, 340);
      shockwave(enemy.x, enemy.y, C.pink, 140, 0.6);
      tone(160, 0.4, 'sawtooth', 0.09, 40);
      noiseBurst(0.5, 0.16);
      state.flashRed = 0.7; state.shake = Math.max(state.shake, 7);
      toast('✗ SALAH! -1 Energi', C.pink);
      state.locked = false;
      if (state.hp <= 0) { endGame(); return; }
      const remaining = enemies.filter(o => o.alive && o.dying <= 0 && !o.launching && !o.fleeing);
      if (remaining.length <= 1) { state.roundActive = false; state.nextRoundIn = 1.15; }
    }
  }
}

function failQuestion() {
  state.questionFailed = true;
  state.roundActive = false;
  state.locked = true;
  const correctEnemy = enemies.find(e => e.correct && e.alive && !e.launching && !e.fleeing);
  enemies.forEach(o => {
    if (o === correctEnemy) return;
    if (o.alive && o.dying <= 0 && !o.launching && !o.fleeing) {
      o.fleeing = true;
      o.fleeVx = (Math.random() - 0.5) * 60;
      o.fleeVy = 300 + Math.random() * 150;
      o.fleeSpin = (Math.random() - 0.5) * 1.5;
      o.panelScale = 0;
    }
  });
  if (correctEnemy) {
    correctEnemy.panelFlash = 1.5;
    correctEnemy.flash = 0.6;
    explosion(correctEnemy.x, correctEnemy.y, C.teal, 50, 420, 1.4);
    shockwave(correctEnemy.x, correctEnemy.y, C.teal, 320, 0.9);
    popup(correctEnemy.x, correctEnemy.y - 90, '✓ JAWABAN BENAR', C.teal, 28);
    state.correctMarkX = correctEnemy.x;
    state.correctMarkY = correctEnemy.y;
    state.correctMarkTimer = 3.0;
    state.correctMarkColor = C.teal;
  }
  state.hp--;
  state.flashRed = 0.9;
  state.shake = 14;
  state.streak = 0;
  state.comboMeter = 0;
  noiseBurst(0.8, 0.24, 800);
  tone(120, 0.7, 'sawtooth', 0.12, 30);
  toast('❌ 2× SALAH — Jawaban benar ditandai BIRU TERANG  |  -1 Energi', C.pink);
  if (state.hp <= 0) { setTimeout(() => endGame(), 1400); return; }
  state.nextRoundIn = 2.4;
}

function endGame() {
  state.mode = 'over'; state.roundActive = false; state.locked = true;
  state.shake = 10;
  explosion(player.x, player.y, C.amber, 80, 500, 1.5);
  explosion(player.x, player.y, C.white, 40, 600, 1);
  shockwave(player.x, player.y, C.amber, 240, 0.9);
  noiseBurst(1.2, 0.2);
  tone(220, 0.9, 'sawtooth', 0.1, 30);
}

function triggerVictory() {
  state.mode = 'victory';
  state.roundActive = false;
  state.locked = true;
  state.nextRoundIn = 0;
  enemies.forEach(e => {
    if (e.alive && !e.fleeing) {
      e.fleeing = true;
      e.fleeVx = (Math.random() - 0.5) * 100;
      e.fleeVy = 500 + Math.random() * 300;
      e.fleeSpin = (Math.random() - 0.5) * 3;
    }
  });
  explosion(W/2, 300, C.teal, 80, 520, 1.7);
  explosion(W/2, 300, C.cyan, 60, 640, 1.5);
  shockwave(W/2, 300, C.teal, 420, 1.2);
  state.flashGreen = 1.0;
  state.shake = 12;
  tone(660, 0.15, 'triangle', 0.08);
  tone(880, 0.2, 'triangle', 0.08, null, 0.12);
  tone(1320, 0.3, 'sine', 0.07, null, 0.26);
}

function timeUp() {
  qShip.state = 'exploding';
  qShip.explodeT = 0; qShip.explodeRingR = 0; qShip.explodeRingR2 = 0;
  const qx = qShip.x, qy = qShip.y;
  explosion(qx, qy, C.blue, 60, 550, 1.7);
  explosion(qx, qy, C.white, 40, 700, 1.1);
  shockwave(qx, qy, C.white, 400, 1.2);
  shockwave(qx, qy, C.blue, 500, 1.5);
  debrisBurst(qx, qy, C.indigo, 40);
  for (let i = 0; i < 30; i++) spawnSmokePuff(qx + (Math.random()-0.5)*200, qy + (Math.random()-0.5)*100, 1.2);
  state.shake = Math.max(state.shake, 14);
  state.flashRed = 1.0; state.flashBlue = 0.5;
  noiseBurst(1.5, 0.32, 700);
  tone(180, 1.0, 'sawtooth', 0.15, 30);
  tone(90, 1.4, 'sine', 0.13, 25, 0.08);
  enemies.forEach((o, i) => {
    if (o.alive && o.dying <= 0 && !o.launching && !o.fleeing) {
      o.launching = true;
      o.launchVy = 500 + Math.random()*400 + i * 30;
      o.panelFlash = 0.6;
      explosion(o.x, o.y, C.blue, 24, 280);
    }
  });
  if (state.shield > 0) {
    state.shield = 0; state.flashBlue = 0.9;
    toast('💥 WAKTU HABIS! Perisai jatuh!', C.amber);
  } else {
    state.hp--;
    toast('💥 WAKTU HABIS! -1 Energi', C.pink);
  }
  state.streak = 0;
  state.comboMeter = Math.max(0, state.comboMeter - 40);
  state.roundActive = false; state.locked = true;
  if (state.hp <= 0) setTimeout(() => endGame(), 900);
  else state.nextRoundIn = 2.2;
}

/* ═══ UPDATE ═══ */
function update(dt) {
  state.gameTime += dt;
  const starMult = state.mode === 'playing' ? 1 : 0.45;

  if (state.correctMarkTimer > 0) state.correctMarkTimer -= dt;

  for (const s of stars) {
    s.y += s.v * dt * starMult;
    s.x += s.drift * dt * starMult;
    s.twinkle += dt * 3;
    if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    if (s.x < -8) s.x = W + 8;
    if (s.x > W + 8) s.x = -8;
  }
  for (const n of nebulaClouds) {
    n.y += n.v * dt * 0.35;
    n.hue = (n.hue + dt * 3) % 360;
    if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random() * W; }
  }
  for (let i = 0; i < spaceObjects.length; i++) {
    const o = spaceObjects[i];
    o.y += o.v * dt * starMult;
    o.rot += o.rotV * dt;
    if (o.y - o.size * 2 > H + 80) spaceObjects[i] = makeWorldObject(true);
  }
  if (state.mode === 'playing' && Math.random() < dt * 0.35) {
    distantFlashes.push({
      x: Math.random() * W,
      y: horizonYAt() + (Math.random() - 0.5) * 30,
      r: 80 + Math.random() * 120,
      life: 0.35, maxLife: 0.35,
    });
  }
  for (let i = distantFlashes.length - 1; i >= 0; i--) {
    distantFlashes[i].life -= dt;
    if (distantFlashes[i].life <= 0) distantFlashes.splice(i, 1);
  }

  player.autoT += dt;
  const patrolRange = W * 0.40;
  const patrolSpeed = 0.35;
  player.targetX = W / 2 + Math.sin(player.autoT * patrolSpeed) * patrolRange;

  const dx = player.targetX - player.x;
  player.vx = lerp(player.vx, dx * 8, Math.min(1, dt * 8));
  player.x = lerp(player.x, player.targetX, Math.min(1, dt * 8));
  const targetBank = clamp(-player.vx * 0.001, -0.4, 0.4);
  player.bank = lerp(player.bank, targetBank, Math.min(1, dt * 8));

  player.enginePulse += dt * 28;
  player.shieldPhase += dt * 2.4;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.tierFlash > 0) player.tierFlash -= dt;
  if (player.overdrive > 0) {
    player.overdrive -= dt;
    if (player.overdrive <= 0) player.weaponLevel = 1;
  }
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 70);
  if (state.flashRed > 0) state.flashRed = Math.max(0, state.flashRed - dt * 1.5);
  if (state.flashGreen > 0) state.flashGreen = Math.max(0, state.flashGreen - dt * 1.8);
  if (state.flashBlue > 0) state.flashBlue = Math.max(0, state.flashBlue - dt * 1.5);
  if (state.toastTimer > 0) state.toastTimer -= dt;
  state.qPanelSlide = Math.min(1, state.qPanelSlide + dt * 3);

  state.incomingThreat = lerp(state.incomingThreat, state.incomingThreatTarget, Math.min(1, dt * 5));
  if (state.incomingThreatTarget > 0) {
    state.incomingThreatTarget = Math.max(0, state.incomingThreatTarget - dt * 0.35);
  }

  updateQShip(dt);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.955; p.vy *= 0.955; p.vy += 55 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt;
    sw.r = lerp(6, sw.maxR, 1 - sw.life / sw.maxLife);
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vy += 280 * dt; d.rot += d.rotV * dt;
    d.life -= dt;
    if (d.life <= 0 || d.y > H + 50) debris.splice(i, 1);
  }
  for (let i = qShipDebris.length - 1; i >= 0; i--) {
    const d = qShipDebris[i];
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vx *= 0.97; d.vy *= 0.97; d.vy += 40 * dt;
    d.rot += d.rotV * dt; d.life -= dt;
    if (d.life <= 0) qShipDebris.splice(i, 1);
  }
  for (let i = planeFragments.length - 1; i >= 0; i--) {
    const f = planeFragments[i];
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.vx *= 0.985; f.vy *= 0.985; f.vy += 220 * dt;
    f.rot += f.rotV * dt; f.life -= dt;
    if (f.life <= 0 || f.y > H + 90) planeFragments.splice(i, 1);
  }
  for (let i = smokePuffs.length - 1; i >= 0; i--) {
    const s = smokePuffs[i];
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vy -= 8 * dt; s.vx *= 0.98;
    s.size += 18 * dt; s.rot += s.rotV * dt; s.life -= dt;
    s.alpha = Math.max(0, (s.life / s.max) * 0.55);
    if (s.life <= 0) smokePuffs.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y += p.vy * dt; p.vy *= 0.95; p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
  for (let i = engineTrails.length - 1; i >= 0; i--) {
    const t = engineTrails[i];
    t.x += t.vx * dt; t.y += t.vy * dt; t.life -= dt;
    if (t.life <= 0) engineTrails.splice(i, 1);
  }
  for (let i = heatDistortions.length - 1; i >= 0; i--) {
    const hd = heatDistortions[i];
    hd.life -= dt; hd.r += 40 * dt;
    if (hd.life <= 0) heatDistortions.splice(i, 1);
  }
  for (let i = lockOnEffects.length - 1; i >= 0; i--) {
    const lo = lockOnEffects[i];
    if (!lo.enemy || !lo.enemy.alive || lo.enemy.dying > 0) {
      lockOnEffects.splice(i, 1);
      continue;
    }
    lo.life -= dt; lo.t += dt;
    if (lo.life <= 0) lockOnEffects.splice(i, 1);
  }

  let nearestThreat = 0;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.x += eb.vx * dt;
    eb.y += eb.vy * dt;
    eb.life -= dt;
    eb.rot = Math.atan2(eb.vy, eb.vx) + Math.PI / 2;

    if (Math.random() < 0.6) {
      smokePuffs.push({
        x: eb.x, y: eb.y,
        vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20,
        size: 4 + Math.random() * 4,
        life: 0.35, max: 0.35,
        rot: 0, rotV: 0, alpha: 0.5,
        color: 'rgba(80, 255, 120, 0.8)',
      });
    }

    const pdx = player.x - eb.x;
    const pdy = player.y - eb.y;
    const pdist = Math.hypot(pdx, pdy);

    const shieldRadius = 88;

    if (pdist < 420) {
      const t = clamp(1 - pdist / 420, 0, 1);
      nearestThreat = Math.max(nearestThreat, t);
    }

    if (pdist < shieldRadius && state.shield > 0) {
      explosion(eb.x, eb.y, C.yellow, 30, 320, 1.2);
      explosion(eb.x, eb.y, C.green, 16, 220, 0.9);
      shockwave(eb.x, eb.y, C.yellow, 130, 0.6);
      shockwave(eb.x, eb.y, C.green, 90, 0.45);
      for (let k = 0; k < 12; k++) {
        particles.push({
          x: eb.x, y: eb.y,
          vx: (Math.random()-0.5)*260, vy: (Math.random()-0.5)*260,
          life: 0.4+Math.random()*0.4, max: 0.8,
          size: 2+Math.random()*3, color: '#aaffcc', glow: true
        });
      }
      state.shield = Math.max(0, state.shield - 8);
      if (state.shield === 0) {
        toast('⚠ PERISAI HANCUR!', C.amber);
        state.flashBlue = 0.8;
      }
      state.incomingThreatTarget = Math.max(state.incomingThreatTarget, 0.9);
      tone(520, 0.12, 'square', 0.06, 240);
      tone(280, 0.18, 'sawtooth', 0.05, 120);
      noiseBurst(0.25, 0.1, 1500);
      state.shake = Math.max(state.shake, 5);
      enemyBullets.splice(i, 1);
      continue;
    }

    if (pdist < 60 && state.shield <= 0) {
      state.hp = Math.max(0, state.hp - 1);
      state.flashRed = 0.7;
      state.shake = Math.max(state.shake, 10);
      toast('✗ TERKENA TEMBAKAN MUSUH! -1 Energi', C.pink);
      explosion(eb.x, eb.y, C.pink, 30, 320, 1.2);
      shockwave(eb.x, eb.y, C.pink, 120, 0.55);
      tone(180, 0.35, 'sawtooth', 0.09, 50);
      noiseBurst(0.5, 0.16);
      state.incomingThreatTarget = Math.max(state.incomingThreatTarget, 1.0);
      enemyBullets.splice(i, 1);
      if (state.hp <= 0) { endGame(); }
      continue;
    }

    if (eb.x < -100 || eb.x > W + 100 || eb.y < -100 || eb.y > H + 100) {
      enemyBullets.splice(i, 1);
    } else if (eb.life <= 0) {
      enemyBullets.splice(i, 1);
    }
  }
  if (nearestThreat > state.incomingThreatTarget) {
    state.incomingThreatTarget = nearestThreat;
  }

  if (state.mode !== 'playing') return;

  if (state.shield < state.maxShield && state.roundActive && !state.locked) {
    state.shield = Math.min(state.maxShield, state.shield + dt * 8);
  }

  if (state.roundActive && !state.locked && qShip.state === 'hovering') {
    state.timeLeft -= dt;
    qShip.chargeLevel = 1 - state.timeLeft / state.timeMax;
    const progress = 1 - state.timeLeft / state.timeMax;
    const descentY = SHIP_Y_START + progress * SHIP_TOTAL_DESCENT;
    for (const e of enemies) {
      if (e.alive && e.dying <= 0 && !e.launching && !e.fleeing) e.baseY = descentY;
    }
    if (state.timeLeft <= 0) { state.timeLeft = 0; timeUp(); }
  }

  for (const e of enemies) {
    e.engine += dt * 8;
    if (e.panelFlash > 0) e.panelFlash -= dt;
    if (!e.fleeing && !e.launching && e.dying <= 0 && e.alive) e.bankTarget = 0;
    e.bank = lerp(e.bank, e.bankTarget, Math.min(1, dt * 4));

    if (e.fleeing) {
      e.fleeVy += 120 * dt;
      e.fleeVx *= 0.99;
      e.x += e.fleeVx * dt;
      e.y += e.fleeVy * dt;
      e.fleeRot += e.fleeSpin * dt;
      e.rot = e.fleeRot;
      if (Math.random() < 0.7) spawnEngineTrail(e.x + (Math.random()-0.5)*18, e.y - 20, C.cyan);
      if (Math.random() < 0.35) spawnSmokePuff(e.x, e.y - 10, 0.4);
      if (e.y > H + 400 || e.x < -320 || e.x > W + 320) e.alive = false;
      continue;
    }
    if (e.launching) {
      e.launchVy += 1400 * dt;
      e.y += e.launchVy * dt;
      e.launchSpin += dt * 5;
      e.rot = e.launchSpin * (e.correct ? -1 : 1);
      e.bankTarget = e.launchSpin * 0.3;
      if (Math.random() < 0.75) spawnEngineTrail(e.x + (Math.random()-0.5)*30, e.y - 30, e.correct ? C.teal : C.blue);
      if (Math.random() < 0.5) spawnSmokePuff(e.x, e.y, 0.5);
      if ((e.y > H + 60 || e.y < -200) && e.alive) {
        e.alive = false; e.dying = 0.3;
        const ey = clamp(e.y, 30, H - 30);
        explosion(e.x, ey, e.correct ? C.teal : C.blue, 30, 280);
        shockwave(e.x, ey, e.correct ? C.teal : C.blue, 100, 0.4);
      }
      continue;
    }
    if (e.dying > 0) {
      e.dying -= dt;
      e.scale = Math.max(0, e.dying / 0.7);
      e.rot += dt * 5;
      continue;
    }
    if (!e.alive) continue;

    if (e.y < e.baseY - 0.5) e.y = Math.min(e.baseY, e.y + 700 * dt);
    else if (e.y > e.baseY + 0.5) e.y = Math.max(e.baseY, e.y - 700 * dt);
    else { e.y = e.baseY; e.x = e.baseX; e.rot = 0; }

    e.panelScale = Math.min(1, e.panelScale + dt * 4);
    if (e.flash > 0) e.flash -= dt;

    if (state.roundActive && !state.locked && qShip.state === 'hovering' && e.panelScale >= 0.9) {
      e.shootCooldown -= dt;
      const proximity = clamp(1 - (e.y - SHIP_Y_START) / Math.max(1, SHIP_TOTAL_DESCENT), 0, 1);
      const cooldownMul = 1 - proximity * 0.5;

      if (e.isChargingShot) {
        e.shootWarnTimer -= dt;
        if (e.shootWarnTimer <= 0) {
          enemyFire(e);
          e.isChargingShot = false;
          e.shootCooldown = (2.2 + Math.random() * 3.8) * cooldownMul;
        }
      } else if (e.shootCooldown <= 0) {
        e.isChargingShot = true;
        e.shootWarnTimer = 0.55;
      }
    } else {
      e.isChargingShot = false;
    }
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const target = b.target;
    if (!target || (!target.alive && target.dying <= 0 && !target.launching && !target.fleeing)) {
      bullets.splice(i, 1);
      continue;
    }

    const dx = target.x - b.aimX;
    const dy = target.y - b.aimY;
    const aimDist = Math.hypot(dx, dy) || 1;
    const nx = dx / aimDist;
    const ny = dy / aimDist;
    const px = -ny;
    const py = nx;

    b.aimDirX = nx;
    b.aimDirY = ny;

    const step = b.speed * dt;
    b.t += dt;

    b.aimX += nx * step;
    b.aimY += ny * step;

    const proxDamp = Math.min(1, Math.max(0, (aimDist - 60) / 340));
    const wobble = Math.sin(b.t * b.wobbleFreq + b.phase) * b.wobbleAmp * proxDamp;
    b.perp = wobble;

    b.x = b.aimX + px * wobble;
    b.y = b.aimY + py * wobble;
    b.rot = Math.atan2(ny, nx) + Math.PI / 2;

    b.smokeT += dt;
    if (b.smokeT >= 0.04) {
      b.smokeT = 0;
      smokePuffs.push({
        x: b.x, y: b.y,
        vx: (Math.random() - 0.5) * 26,
        vy: (Math.random() - 0.5) * 26,
        size: 6 + Math.random() * 5,
        life: 0.45 + Math.random() * 0.35,
        max: 0.85,
        rot: 0, rotV: 0,
        alpha: 0.55,
        color: 'rgba(140, 200, 255, 0.9)',
      });
    }

    const adx = target.x - b.x;
    const ady = target.y - b.y;
    const actualDist = Math.hypot(adx, ady);
    if (actualDist <= step + 28) {
      b.x = target.x;
      b.y = target.y;
      bullets.splice(i, 1);
      resolveHit(b, target);
    }
  }

  if (state.nextRoundIn > 0) {
    state.nextRoundIn -= dt;
    if (state.nextRoundIn <= 0) {
      if (state.hp > 0 && state.mode === 'playing') newRound();
    }
  }
}

function updateQShip(dt) {
  qShip.reactorPulse += dt * 4;
  qShip.ringAngle += dt * 0.5;
  qShip.ringAngle2 -= dt * 0.9;
  qShip.thrusterPulse += dt * 20;
  if (qShip.state === 'entering') {
    qShip.entryT += dt;
    const t = Math.min(1, qShip.entryT / 1.3);
    const ease = 1 - Math.pow(1 - t, 3);
    qShip.y = lerp(qShip.entryY, qShip.baseY, ease);
    if (t >= 1) { qShip.state = 'hovering'; qShip.hoverT = 0; }
  } else if (qShip.state === 'hovering') {
    qShip.hoverT += dt;
    qShip.y = qShip.baseY;
    const ratio = state.timeLeft / state.timeMax;
    if (ratio < 0.4) {
      const urgency = 1 - ratio / 0.4;
      qShip.alarmPulse = 0.5 + Math.sin(state.gameTime * (8 + urgency * 14)) * 0.5;
    } else qShip.alarmPulse = 0;
    if (Math.random() < 0.9) {
      for (let i = 0; i < 2; i++) spawnEngineTrail(qShip.x + (Math.random()-0.5)*520, qShip.y + 95, qShip.chargeLevel > 0.7 ? C.amber : C.cyan);
    }
  } else if (qShip.state === 'leaving') {
    qShip.leaveVx *= 1.03;
    qShip.x += qShip.leaveVx * dt;
    qShip.y += qShip.leaveVy * dt;
    qShip.leaveVy -= 30 * dt;
    qShip.rotZ = lerp(qShip.rotZ, qShip.leaveVx * 0.0004, dt * 3);
    qShip.engineGlow = Math.max(0, qShip.engineGlow - dt * 0.8);
  } else if (qShip.state === 'exploding') {
    qShip.explodeT += dt;
    qShip.explodeRingR = lerp(0, 600, Math.min(1, qShip.explodeT / 1.5));
    qShip.explodeRingR2 = lerp(0, 800, Math.min(1, qShip.explodeT / 2.0));
    if (qShip.explodeT < 1.4 && Math.random() < 0.7) {
      explosion(qShip.x + (Math.random()-0.5)*700, qShip.y + (Math.random()-0.5)*160, Math.random() > 0.5 ? C.cyan : C.blue, 16, 380, 1.3);
    }
  }
}

/* ═══ RENDER ═══ */
function drawEngineTrails() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const t of engineTrails) {
    const a = Math.max(0, t.life / t.max);
    ctx.globalAlpha = a * 0.7;
    const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.size * a * 2);
    g.addColorStop(0, C.white);
    g.addColorStop(0.4, t.color);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.size * a * 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawSmokePuffs() {
  ctx.save();
  for (const s of smokePuffs) {
    ctx.globalAlpha = s.alpha;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s.size);
    if (s.color) {
      g.addColorStop(0, s.color);
      g.addColorStop(1, 'transparent');
    } else {
      g.addColorStop(0, 'rgba(40,55,80,0.9)');
      g.addColorStop(0.5, 'rgba(25,35,55,0.6)');
      g.addColorStop(1, 'rgba(10,15,30,0)');
    }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, s.size, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawHeatDistortions() {
  ctx.save();
  for (const h of heatDistortions) {
    const a = h.life / h.max;
    ctx.globalAlpha = a * 0.25;
    const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, h.r);
    g.addColorStop(0, 'rgba(180,230,255,0.5)');
    g.addColorStop(0.7, 'rgba(80,160,255,0.15)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawLockOnEffects() {
  for (const lo of lockOnEffects) {
    const e = lo.enemy;
    if (!e || !e.alive || e.dying > 0) continue;
    const lifeRatio = lo.life / lo.maxLife;
    const alpha = Math.min(1, (1 - lifeRatio) * 4) * Math.min(1, lifeRatio * 5);
    const cx = e.x;
    const cy = e.y;
    const pulse = 0.85 + Math.sin(state.gameTime * 18) * 0.15;

    ctx.save();
    ctx.globalAlpha = alpha;

    ctx.globalCompositeOperation = 'lighter';
    const rGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 110);
    rGlow.addColorStop(0, 'rgba(255, 40, 40, 0.35)');
    rGlow.addColorStop(0.55, 'rgba(255, 20, 20, 0.18)');
    rGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = rGlow;
    ctx.beginPath(); ctx.arc(cx, cy, 110, 0, Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    const outerR = 85 * pulse;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(state.gameTime * 2.5);
    ctx.strokeStyle = hex2rgba(C.red, 0.9 * alpha);
    ctx.lineWidth = 3;
    ctx.shadowColor = C.red;
    ctx.shadowBlur = 18;
    for (let i = 0; i < 4; i++) {
      const a0 = (i/4) * Math.PI * 2;
      const a1 = a0 + Math.PI / 5;
      ctx.beginPath();
      ctx.arc(0, 0, outerR, a0, a1);
      ctx.stroke();
    }
    ctx.restore();

    const boxSize = 96 * pulse;
    const half = boxSize / 2;
    const corner = 22;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(state.gameTime * 0.4);
    ctx.strokeStyle = hex2rgba(C.red, alpha);
    ctx.lineWidth = 4;
    ctx.shadowColor = C.red;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(-half, -half + corner); ctx.lineTo(-half, -half); ctx.lineTo(-half + corner, -half);
    ctx.moveTo( half - corner, -half); ctx.lineTo( half, -half); ctx.lineTo( half, -half + corner);
    ctx.moveTo( half,  half - corner); ctx.lineTo( half,  half); ctx.lineTo( half - corner,  half);
    ctx.moveTo(-half + corner,  half); ctx.lineTo(-half,  half); ctx.lineTo(-half,  half - corner);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = hex2rgba(C.red, alpha * 0.95);
    ctx.lineWidth = 2.5;
    ctx.shadowColor = C.red;
    ctx.shadowBlur = 12;
    const gap = 28;
    const len = 20;
    ctx.beginPath();
    ctx.moveTo(0, -gap); ctx.lineTo(0, -gap - len);
    ctx.moveTo(0,  gap); ctx.lineTo(0,  gap + len);
    ctx.moveTo(-gap, 0); ctx.lineTo(-gap - len, 0);
    ctx.moveTo( gap, 0); ctx.lineTo( gap + len, 0);
    ctx.stroke();
    ctx.fillStyle = hex2rgba(C.red, alpha);
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.font = `bold ${fs(17, 1.5)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = hex2rgba(C.red, alpha);
    ctx.shadowColor = C.red;
    ctx.shadowBlur = 16;
    ctx.fillText('◉ TARGET LOCKED', cx, cy - 72);
    ctx.shadowBlur = 0;

    const pulseR = 100 + (1 - lifeRatio) * 30;
    ctx.strokeStyle = hex2rgba(C.red, alpha * lifeRatio * 0.7);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, pulseR, 0, Math.PI*2); ctx.stroke();

    ctx.restore();
  }
}

function drawCorrectMark() {
  if (state.correctMarkTimer <= 0) return;
  const t = state.correctMarkTimer;
  const maxT = 3.0;
  const prog = t / maxT;
  const alpha = Math.min(1, t / 0.4) * (t > 2.0 ? Math.min(1, (maxT - t) / 0.5) : 1);
  const cx = state.correctMarkX;
  const cy = state.correctMarkY;
  const pulse = 0.85 + Math.sin(state.gameTime * 10) * 0.15;
  const radius = 90 * pulse;

  ctx.save();
  ctx.globalAlpha = alpha;

  const ringR = radius + (1 - prog) * 60;
  ctx.strokeStyle = hex2rgba(C.teal, 0.6 * prog);
  ctx.lineWidth = 4 * prog + 1;
  ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, Math.PI*2); ctx.stroke();

  ctx.strokeStyle = hex2rgba(C.cyan, 0.4 * prog);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, ringR * 0.7, 0, Math.PI*2); ctx.stroke();

  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
  gl.addColorStop(0, hex2rgba(C.teal, 0.45 * prog));
  gl.addColorStop(0.5, hex2rgba(C.cyan, 0.25 * prog));
  gl.addColorStop(1, 'transparent');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2); ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
  const checkSize = 42 * pulse;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = C.teal;
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.moveTo(cx - checkSize * 0.45, cy + checkSize * 0.05);
  ctx.lineTo(cx - checkSize * 0.08, cy + checkSize * 0.42);
  ctx.lineTo(cx + checkSize * 0.48, cy - checkSize * 0.38);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.font = `bold ${fs(20, 1.5)}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = C.teal;
  ctx.shadowBlur = 14;
  ctx.fillText('JAWABAN BENAR', cx, cy + 78);
  ctx.shadowBlur = 0;

  for (let i = 0; i < 12; i++) {
    const ang = (i / 12) * Math.PI * 2 + state.gameTime * 2;
    const r2 = radius + 6;
    ctx.globalAlpha = alpha * 0.7;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2, 3, 0, Math.PI*2);
    ctx.fillStyle = i % 2 === 0 ? C.teal : C.cyan;
    ctx.fill();
  }

  ctx.restore();
}

function drawQShip() {
  if (qShip.state === 'idle') return;
  if (qShip.state === 'exploding' && qShip.explodeT > 3.5) return;
  const cx = qShip.x, cy = qShip.y;
  if (qShip.state === 'exploding') {
    const t1 = Math.min(1, qShip.explodeT / 1.5);
    const t2 = Math.min(1, qShip.explodeT / 2.0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (1 - t1) * 0.9;
    ctx.strokeStyle = C.white; ctx.lineWidth = 10 * (1 - t1) + 1;
    ctx.shadowColor = C.white; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(cx, cy, qShip.explodeRingR, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = (1 - t2) * 0.7;
    ctx.strokeStyle = C.blue; ctx.lineWidth = 18 * (1 - t2) + 2;
    ctx.beginPath(); ctx.arc(cx, cy, qShip.explodeRingR2, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    const coreT = Math.min(1, qShip.explodeT / 1.1);
    const coreR = lerp(0, 380, 1 - Math.pow(1 - coreT, 2.2));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1 - coreT;
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    cg.addColorStop(0, C.white); cg.addColorStop(0.2, '#d0f0ff');
    cg.addColorStop(0.45, C.cyan); cg.addColorStop(0.7, C.blue);
    cg.addColorStop(0.9, C.indigo); cg.addColorStop(1, 'transparent');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(qShip.rotZ || 0);
  const charge = qShip.chargeLevel;
  const alarm = qShip.alarmPulse;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const ambientAlpha = 0.14 + charge * 0.32 + alarm * 0.16;
  const ambientColor = charge > 0.6 ? hex2rgba(C.cyan, ambientAlpha) : hex2rgba(C.blue, ambientAlpha * 0.9);
  const ambient = ctx.createRadialGradient(0, 0, 0, 0, 0, 520);
  ambient.addColorStop(0, ambientColor);
  ambient.addColorStop(0.6, hex2rgba(C.blue, ambientAlpha * 0.3));
  ambient.addColorStop(1, 'transparent');
  ctx.fillStyle = ambient;
  ctx.beginPath(); ctx.arc(0, 0, 520, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.rotate(qShip.ringAngle);
  ctx.strokeStyle = hex2rgba(C.cyan, 0.3 + charge * 0.4);
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const a0 = (i/8)*Math.PI*2, a1 = a0 + Math.PI/12;
    ctx.beginPath(); ctx.arc(0, 0, 480, a0, a1); ctx.stroke();
  }
  ctx.restore();
  drawWingPanels(charge, alarm);
  drawMainHull(charge, alarm);
  drawBridgeTower(charge, alarm);
  drawTurrets(charge, alarm);
  drawRunningLights(charge);
  drawGreebles(charge);
  ctx.restore();
}

function drawMainHull(charge, alarm) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-340, -30); ctx.lineTo(-400, 0); ctx.lineTo(-380, 55);
  ctx.lineTo(-260, 80); ctx.lineTo(-140, 90); ctx.lineTo(0, 100);
  ctx.lineTo(140, 90); ctx.lineTo(260, 80); ctx.lineTo(380, 55);
  ctx.lineTo(400, 0); ctx.lineTo(340, -30); ctx.lineTo(200, -50);
  ctx.lineTo(-200, -50); ctx.closePath();
  const hullG = ctx.createLinearGradient(0, -50, 0, 100);
  if (charge > 0.6) {
    hullG.addColorStop(0, '#082038'); hullG.addColorStop(0.3, '#104868');
    hullG.addColorStop(0.55, '#1880b0'); hullG.addColorStop(0.8, '#104868');
    hullG.addColorStop(1, '#082038');
  } else {
    hullG.addColorStop(0, '#041428'); hullG.addColorStop(0.25, '#0a2a50');
    hullG.addColorStop(0.5, '#104070'); hullG.addColorStop(0.75, '#0a2a50');
    hullG.addColorStop(1, '#020a18');
  }
  ctx.fillStyle = hullG; ctx.fill();
  ctx.strokeStyle = charge > 0.6 ? '#00d0ff' : '#0088c0';
  ctx.lineWidth = 2.4; ctx.stroke();
  ctx.strokeStyle = charge > 0.6 ? 'rgba(80,200,255,0.55)' : 'rgba(0,180,255,0.5)';
  ctx.beginPath();
  ctx.moveTo(-360, -20); ctx.lineTo(360, -20);
  ctx.moveTo(-380, 10); ctx.lineTo(380, 10);
  ctx.moveTo(-370, 40); ctx.lineTo(370, 40);
  ctx.moveTo(-320, 68); ctx.lineTo(320, 68);
  ctx.stroke();
  ctx.fillStyle = charge > 0.6 ? C.amber : '#9ff8ff';
  ctx.beginPath();
  ctx.moveTo(0, 100); ctx.lineTo(-30, 88); ctx.lineTo(30, 88); ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawWingPanels(charge, alarm) {
  ctx.save();
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 340, -30); ctx.lineTo(side * 460, -80);
    ctx.lineTo(side * 500, -50); ctx.lineTo(side * 420, 0);
    ctx.lineTo(side * 380, 55); ctx.closePath();
    const wingG = ctx.createLinearGradient(side * 500, -80, side * 380, 55);
    wingG.addColorStop(0, charge > 0.6 ? '#0a2038' : '#041028');
    wingG.addColorStop(0.5, charge > 0.6 ? '#1860a0' : '#0a3060');
    wingG.addColorStop(1, charge > 0.6 ? '#104868' : '#0a2050');
    ctx.fillStyle = wingG; ctx.fill();
    ctx.strokeStyle = charge > 0.6 ? '#00d0ff' : '#0088c0';
    ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}

function drawBridgeTower(charge, alarm) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-150, -50); ctx.lineTo(-120, -125); ctx.lineTo(-60, -145);
  ctx.lineTo(60, -145); ctx.lineTo(120, -125); ctx.lineTo(150, -50);
  ctx.closePath();
  const bridgeG = ctx.createLinearGradient(0, -145, 0, -50);
  if (charge > 0.6) {
    bridgeG.addColorStop(0, '#0a2038'); bridgeG.addColorStop(0.4, '#1860a0');
    bridgeG.addColorStop(1, '#041028');
  } else {
    bridgeG.addColorStop(0, '#041028'); bridgeG.addColorStop(0.4, '#0a3060');
    bridgeG.addColorStop(1, '#020a18');
  }
  ctx.fillStyle = bridgeG; ctx.fill();
  ctx.strokeStyle = charge > 0.6 ? '#00d0ff' : '#0088c0';
  ctx.lineWidth = 2.2; ctx.stroke();
  const windowGlow = charge > 0.6 ? '#80e8ff' : '#9ff8ff';
  ctx.fillStyle = windowGlow;
  for (let i = -7; i <= 7; i++) ctx.fillRect(i * 15 - 4, -130, 8, 12);
  ctx.restore();
}

function drawTurrets(charge, alarm) {
  const turretPositions = [
    [-260, -35], [-180, -35], [-100, -35],
    [100, -35], [180, -35], [260, -35],
    [-240, 55], [-80, 55], [80, 55], [240, 55],
  ];
  for (const [tx, ty] of turretPositions) {
    ctx.save();
    ctx.translate(tx, ty);
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 8, 0, 0, Math.PI*2);
    ctx.fillStyle = charge > 0.6 ? '#041028' : '#020818'; ctx.fill();
    ctx.strokeStyle = charge > 0.6 ? '#00d0ff' : '#0088c0'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(-6, -14, 1.8, 0, Math.PI*2);
    ctx.fillStyle = charge > 0.6 ? '#80e8ff' : '#9ff8ff';
    ctx.fill();
    ctx.beginPath(); ctx.arc(6, -14, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawRunningLights(charge) {
  ctx.save();
  const lightColor = charge > 0.6 ? '#80e8ff' : '#9ff8ff';
  ctx.fillStyle = lightColor;
  for (let i = -8; i <= 8; i++) {
    const x = i * 42;
    if (Math.abs(x) > 350) continue;
    const blink = 0.5 + Math.sin(state.gameTime * 2 + i * 0.7) * 0.5;
    ctx.globalAlpha = blink * 0.85;
    ctx.beginPath(); ctx.arc(x, 82, 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawGreebles(charge) {
  ctx.save();
  ctx.globalAlpha = 0.8;
  const detailColor = charge > 0.6 ? '#0a3060' : '#0a2050';
  ctx.fillStyle = detailColor;
  const rects = [
    [-300, -15, 14, 8], [-240, -15, 12, 6], [-140, -15, 10, 8],
    [140, -15, 12, 6], [240, -15, 14, 8], [300, -15, 12, 6],
  ];
  for (const [x, y, w, h] of rects) ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function drawQShipDebris() {
  for (const d of qShipDebris) {
    const a = Math.max(0, d.life / d.max);
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < d.points; i++) {
      const ang = (i/d.points)*Math.PI*2;
      const r = d.size * (0.55 + (i%2)*0.45);
      const px = Math.cos(ang)*r, py = Math.sin(ang)*r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawQuestionPanel() {
  if (!currentQuestion) return;
  const slideIn = state.qPanelSlide;
  const slideEase = 1 - Math.pow(1 - slideIn, 3);
  const panelX = QP_X;
  const panelY = QP_Y + (1 - slideEase) * -140;
  const panelW = QP_W;
  const panelH = QP_H;
  const fHead = fs(12, 1.45);
  const fQ    = fs(27, 1.45);
  const fTime = fs(16, 1.5);
  const lh    = Math.round(fQ * 1.24);

  ctx.save();
  ctx.shadowColor = hex2rgba(C.cyan, 0.5); ctx.shadowBlur = 30;
  roundRect(ctx, panelX, panelY, panelW, panelH, 18);
  const bgGrad = ctx.createLinearGradient(panelX, panelY, panelX, panelY + panelH);
  bgGrad.addColorStop(0, 'rgba(8, 24, 56, 0.94)');
  bgGrad.addColorStop(0.4, 'rgba(4, 14, 36, 0.96)');
  bgGrad.addColorStop(1, 'rgba(2, 8, 22, 0.97)');
  ctx.fillStyle = bgGrad; ctx.fill();
  ctx.shadowBlur = 0;

  const borderGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY + panelH);
  borderGrad.addColorStop(0, C.cyan);
  borderGrad.addColorStop(0.5, C.blue);
  borderGrad.addColorStop(1, C.purple);
  ctx.strokeStyle = borderGrad; ctx.lineWidth = 2.8;
  roundRect(ctx, panelX, panelY, panelW, panelH, 18); ctx.stroke();

  ctx.strokeStyle = hex2rgba(C.cyan, 0.4); ctx.lineWidth = 1;
  roundRect(ctx, panelX + 4, panelY + 4, panelW - 8, panelH - 8, 15); ctx.stroke();

  ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.5;
  const cLen = 26;
  ctx.beginPath();
  ctx.moveTo(panelX + 12, panelY + cLen); ctx.lineTo(panelX + 12, panelY + 12); ctx.lineTo(panelX + cLen, panelY + 12);
  ctx.moveTo(panelX + panelW - cLen, panelY + 12); ctx.lineTo(panelX + panelW - 12, panelY + 12); ctx.lineTo(panelX + panelW - 12, panelY + cLen);
  ctx.moveTo(panelX + 12, panelY + panelH - cLen); ctx.lineTo(panelX + 12, panelY + panelH - 12); ctx.lineTo(panelX + cLen, panelY + panelH - 12);
  ctx.moveTo(panelX + panelW - cLen, panelY + panelH - 12); ctx.lineTo(panelX + panelW - 12, panelY + panelH - 12); ctx.lineTo(panelX + panelW - 12, panelY + panelH - cLen);
  ctx.stroke();

  const qNum = (state.correctCount % QUESTIONS_PER_LEVEL) + 1;
  ctx.font = `bold ${fHead}px "Consolas", monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = C.cyan;
  ctx.fillText(`◈ SOAL ${qNum}/${QUESTIONS_PER_LEVEL}  ·  LEVEL ${state.level}/${MAX_LEVEL}`, panelX + 26, panelY + 12);

  const font = `bold ${fQ}px system-ui, sans-serif`;
  const lines = wrapText(currentQuestion.q, panelW - 70, font);
  ctx.font = font;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.white;
  const regionTop = panelY + 12 + fHead + 10;
  const regionBot = panelY + panelH - 20;
  const textCY = (regionTop + regionBot) / 2;
  const startY = textCY - ((lines.length - 1) * lh) / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, W/2, startY + i * lh));

  const tBarX = panelX + 30;
  const tBarY = panelY + panelH - 14;
  const tBarW = panelW - 60;
  const tBarH = 7;
  roundRect(ctx, tBarX, tBarY, tBarW, tBarH, 3.5);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)'; ctx.fill();
  const tRatio = clamp(state.timeLeft / state.timeMax, 0, 1);
  const barColor = tRatio > 0.5 ? C.teal : tRatio > 0.25 ? C.amber : C.pink;
  if (tRatio > 0) {
    roundRect(ctx, tBarX, tBarY, tBarW * tRatio, tBarH, 3.5);
    ctx.fillStyle = barColor;
    ctx.fill();
  }
  ctx.font = `bold ${fTime}px "Consolas", monospace`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = barColor;
  ctx.fillText(state.timeLeft.toFixed(1) + 's', panelX + panelW - 30, panelY + 34);
  ctx.restore();
}

/* ★★★ ENEMY SHIP — DIPENDEKKAN ★★★ */
function drawEnemyShip(e) {
  if (!e.alive && e.dying <= 0 && !e.launching && !e.fleeing) return;
  const sc = e.dying > 0 ? e.scale : 1;
  if (sc <= 0.01) return;
  const isHit = e.flash > 0;
  const accentColors = ['#00d0ff', '#4a9fff', '#00e5d0', '#7b68ae'];
  const accent = accentColors[e.type] || '#00d0ff';
  const totalScale = sc * ENEMY_SCALE;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.rot + e.bank * 0.35);
  ctx.scale(totalScale, totalScale);
  ctx.globalAlpha = sc;

  /* Charging shot warning — MERAH */
  if (e.isChargingShot && e.shootWarnTimer > 0) {
    const warnPulse = 0.5 + Math.sin(state.gameTime * 30) * 0.5;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const wg = ctx.createRadialGradient(0, 40, 0, 0, 40, 60);
    wg.addColorStop(0, hex2rgba(C.red, 0.65 * warnPulse));
    wg.addColorStop(0.5, hex2rgba(C.green, 0.3 * warnPulse));
    wg.addColorStop(1, 'transparent');
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.arc(0, 40, 60, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* ENGINE FLAME — dipendekkan */
  const flick = 0.75 + Math.sin(e.engine) * 0.25;
  const boost = e.launching ? 2.2 : (e.fleeing ? 1.8 : 1.0);
  const flameLen = (26 + Math.sin(e.engine * 1.4) * 7) * flick * boost;
  const fg = ctx.createLinearGradient(0, -28, 0, -28 - flameLen);
  if (isHit) {
    fg.addColorStop(0, 'rgba(255,255,255,1)');
    fg.addColorStop(0.25, 'rgba(255,140,100,1)');
    fg.addColorStop(0.6, 'rgba(220,60,80,0.7)');
    fg.addColorStop(1, 'transparent');
  } else {
    fg.addColorStop(0, 'rgba(255,255,255,1)');
    fg.addColorStop(0.2, 'rgba(200,240,255,1)');
    fg.addColorStop(0.5, 'rgba(90,200,255,0.8)');
    fg.addColorStop(0.8, 'rgba(60,120,230,0.4)');
    fg.addColorStop(1, 'transparent');
  }
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-7, -28); ctx.lineTo(0, -28 - flameLen); ctx.lineTo(7, -28);
  ctx.closePath(); ctx.fill();

  /* BODY — dipendekkan dari y=78 menjadi y=42, dan sedikit lebih lebar */
  ctx.beginPath();
  ctx.moveTo(0, 42);
  ctx.bezierCurveTo(-3, 38, -4, 32, -5, 26);
  ctx.bezierCurveTo(-6, 18, -7, 10, -8, 0);
  ctx.bezierCurveTo(-9, -10, -9, -22, -6, -32);
  ctx.lineTo(6, -32);
  ctx.bezierCurveTo(9, -22, 9, -10, 8, 0);
  ctx.bezierCurveTo(7, 10, 6, 18, 5, 26);
  ctx.bezierCurveTo(4, 32, 3, 38, 0, 42);
  ctx.closePath();
  const bodyG = ctx.createLinearGradient(-12, 0, 12, 0);
  if (isHit) {
    bodyG.addColorStop(0, '#601018'); bodyG.addColorStop(0.5, '#ff9080');
    bodyG.addColorStop(1, '#601018');
  } else {
    bodyG.addColorStop(0, '#1e2a3a'); bodyG.addColorStop(0.3, '#a8c4dc');
    bodyG.addColorStop(0.6, '#f0f8ff'); bodyG.addColorStop(1, '#1e2a3a');
  }
  ctx.fillStyle = bodyG;
  ctx.fill();
  ctx.strokeStyle = isHit ? '#400008' : '#081020';
  ctx.lineWidth = 1.8; ctx.stroke();

  /* WINGS — dipendekkan */
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 6, 12);
    ctx.lineTo(side * 12, 6);
    ctx.lineTo(side * 62, -18);
    ctx.lineTo(side * 62, -15);
    ctx.lineTo(side * 16, -8);
    ctx.lineTo(side * 10, -12);
    ctx.closePath();
    ctx.fillStyle = isHit ? '#701818' : '#556a80';
    ctx.fill();
    ctx.strokeStyle = isHit ? '#400008' : '#081020';
    ctx.lineWidth = 1.6; ctx.stroke();
  }

  /* TAIL FIN — dipendekkan */
  ctx.beginPath();
  ctx.moveTo(-3, -14); ctx.lineTo(-1.5, -30); ctx.lineTo(0, -40);
  ctx.lineTo(2, -34); ctx.lineTo(3.5, -16);
  ctx.closePath();
  ctx.fillStyle = isHit ? '#701818' : '#556a80';
  ctx.fill();
  ctx.strokeStyle = isHit ? '#400008' : '#081020';
  ctx.lineWidth = 1.6; ctx.stroke();

  /* CANOPY — diperkecil */
  ctx.beginPath();
  ctx.moveTo(-7, 26); ctx.quadraticCurveTo(-8.5, 20, -7.5, 14);
  ctx.quadraticCurveTo(-6, 6, -4, 2);
  ctx.lineTo(4, 2); ctx.quadraticCurveTo(6, 6, 7.5, 14);
  ctx.quadraticCurveTo(8.5, 20, 7, 26);
  ctx.closePath();
  const cg2 = ctx.createRadialGradient(-2, 22, 0, 0, 16, 12);
  if (isHit) {
    cg2.addColorStop(0, 'rgba(255,240,240,1)');
    cg2.addColorStop(0.5, 'rgba(255,110,90,1)');
    cg2.addColorStop(1, 'rgba(80,5,20,0.95)');
  } else {
    cg2.addColorStop(0, 'rgba(240,250,255,1)');
    cg2.addColorStop(0.3, 'rgba(140,220,250,0.95)');
    cg2.addColorStop(0.6, 'rgba(60,160,220,0.92)');
    cg2.addColorStop(0.85, 'rgba(20,80,140,0.95)');
    cg2.addColorStop(1, 'rgba(8,25,50,0.98)');
  }
  ctx.fillStyle = cg2; ctx.fill();
  ctx.restore();

  const idx = enemies.indexOf(e);
  if (idx >= 0) {
    const br = 15 * Math.min(uiScale, 1.55);
    const bfx = e.x - 34 * totalScale;
    const bfy = e.y - 14 * totalScale;
    ctx.save();
    ctx.globalAlpha = sc;
    ctx.beginPath(); ctx.arc(bfx, bfy, br, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(10,20,40,0.96)'; ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.round(15 * Math.min(uiScale, 1.55))}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(idx + 1), bfx, bfy + 1);
    ctx.restore();
  }
}

function drawEnemyPanel(e) {
  if (e.fleeing) return;
  if (!e.alive && e.dying <= 0 && !e.launching) return;
  if (e.panelScale <= 0.01) return;

  const panelSc = e.panelScale;
  const cx = e.x;
  const cy = e.y + PANEL_BELOW_GAP;
  const w = PANEL_W * panelSc;
  const h = PANEL_H * panelSc;
  const x = cx - w / 2;
  const y = cy - h / 2;

  const isHit = e.flash > 0;
  const accentColors = ['#00d0ff', '#4a9fff', '#00e5d0', '#7b68ae'];
  const accent = accentColors[e.type] || '#00d0ff';
  const panelColor = isHit ? C.pink : (state.bossMode ? C.amber : accent);

  ctx.save();
  roundRect(ctx, x, y, w, h, 10);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  if (isHit) {
    g.addColorStop(0, 'rgba(60, 10, 35, 0.96)');
    g.addColorStop(1, 'rgba(30, 3, 18, 0.97)');
  } else if (state.bossMode) {
    g.addColorStop(0, 'rgba(60, 45, 15, 0.95)');
    g.addColorStop(1, 'rgba(28, 20, 5, 0.96)');
  } else {
    g.addColorStop(0, 'rgba(8, 22, 50, 0.95)');
    g.addColorStop(0.5, 'rgba(4, 12, 32, 0.96)');
    g.addColorStop(1, 'rgba(2, 6, 20, 0.97)');
  }
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = panelColor;
  ctx.lineWidth = 2.2; ctx.stroke();

  const fOpt = Math.round(17 * uiScale * panelSc);
  const font = `bold ${fOpt}px system-ui, sans-serif`;
  const lines = wrapText(e.text, w - 30, font);
  ctx.font = font;
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lh = Math.round(fOpt * 1.15);
  const startY = cy - ((lines.length - 1) * lh) / 2 + 3;
  lines.forEach((ln, i) => ctx.fillText(ln, cx, startY + i * lh));

  if (e.panelFlash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, e.panelFlash);
    ctx.strokeStyle = e.correct ? C.teal : C.pink;
    ctx.lineWidth = 5;
    roundRect(ctx, x - 6, y - 6, w + 12, h + 12, 12);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawEnemyBullets() {
  for (const eb of enemyBullets) {
    const alpha = Math.min(1, eb.life / 0.5);
    const angle = eb.rot;

    ctx.save();
    ctx.translate(eb.x, eb.y);
    ctx.rotate(angle - Math.PI / 2);
    ctx.globalAlpha = alpha;

    const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 36);
    gl.addColorStop(0, 'rgba(120, 255, 160, 0.7)');
    gl.addColorStop(0.45, 'rgba(40, 220, 100, 0.35)');
    gl.addColorStop(1, 'transparent');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI*2); ctx.fill();

    const trailLen = 20;
    const eg = ctx.createLinearGradient(0, 10, 0, 10 + trailLen);
    eg.addColorStop(0, 'rgba(220, 255, 200, 1)');
    eg.addColorStop(0.25, 'rgba(120, 255, 100, 0.95)');
    eg.addColorStop(0.6, 'rgba(30, 200, 80, 0.7)');
    eg.addColorStop(1, 'transparent');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.moveTo(-5, 10);
    ctx.quadraticCurveTo(-7, 10 + trailLen * 0.5, 0, 10 + trailLen);
    ctx.quadraticCurveTo(7, 10 + trailLen * 0.5, 5, 10);
    ctx.closePath(); ctx.fill();

    const bodyW = 15;
    const bodyH = 15;
    ctx.beginPath();
    ctx.moveTo(-bodyW/2, -bodyH/2);
    ctx.lineTo(-bodyW/2, bodyH/2 - 3);
    ctx.lineTo(0, bodyH/2);
    ctx.lineTo(bodyW/2, bodyH/2 - 3);
    ctx.lineTo(bodyW/2, -bodyH/2);
    ctx.closePath();
    const bodyG = ctx.createLinearGradient(-bodyW, 0, bodyW, 0);
    bodyG.addColorStop(0, '#0a3a18');
    bodyG.addColorStop(0.3, '#30a050');
    bodyG.addColorStop(0.5, '#80ff90');
    bodyG.addColorStop(0.7, '#30a050');
    bodyG.addColorStop(1, '#082810');
    ctx.fillStyle = bodyG; ctx.fill();
    ctx.strokeStyle = '#0a2010'; ctx.lineWidth = 1.3; ctx.stroke();

    ctx.fillStyle = hex2rgba(C.yellow, 0.95);
    ctx.fillRect(-bodyW/2, -1.5, bodyW, 3);

    const noseH = 10;
    ctx.beginPath();
    ctx.moveTo(-bodyW/2, -bodyH/2);
    ctx.quadraticCurveTo(-bodyW*0.55, -bodyH/2 - noseH*0.45, 0, -bodyH/2 - noseH);
    ctx.quadraticCurveTo(bodyW*0.55, -bodyH/2 - noseH*0.45, bodyW/2, -bodyH/2);
    ctx.closePath();
    const noseG = ctx.createLinearGradient(0, -bodyH/2 - noseH, 0, -bodyH/2);
    noseG.addColorStop(0, '#d0ffd0');
    noseG.addColorStop(0.35, '#30ff70');
    noseG.addColorStop(0.75, '#10a040');
    noseG.addColorStop(1, '#0a3018');
    ctx.fillStyle = noseG; ctx.fill();
    ctx.strokeStyle = '#082010'; ctx.lineWidth = 1.2; ctx.stroke();

    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * (bodyW/2 - 0.5), bodyH/2 - 5);
      ctx.lineTo(side * (bodyW/2 + 5), bodyH/2 - 1);
      ctx.lineTo(side * (bodyW/2 + 4), bodyH/2 + 1);
      ctx.lineTo(side * (bodyW/2 - 0.5), bodyH/2 - 1);
      ctx.closePath();
      const finG = ctx.createLinearGradient(side * bodyW/2, bodyH/2 - 5, side * (bodyW/2 + 5), bodyH/2 + 1);
      finG.addColorStop(0, '#30a050');
      finG.addColorStop(1, '#0a3018');
      ctx.fillStyle = finG; ctx.fill();
      ctx.strokeStyle = '#082010'; ctx.lineWidth = 0.9; ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0, bodyH/2 - 1, 4.5, 0, Math.PI*2);

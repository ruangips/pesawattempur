    const nozG = ctx.createRadialGradient(0, bodyH/2 - 1, 0, 0, bodyH/2 - 1, 6);
    nozG.addColorStop(0, 'rgba(230, 255, 220, 1)');
    nozG.addColorStop(0.5, 'rgba(120, 255, 120, 0.9)');
    nozG.addColorStop(1, 'transparent');
    ctx.fillStyle = nozG;
    ctx.beginPath(); ctx.arc(0, bodyH/2 - 1, 6, 0, Math.PI*2); ctx.fill();

    const tipGlow = ctx.createRadialGradient(0, -bodyH/2 - noseH*0.7, 0, 0, -bodyH/2 - noseH*0.7, 14);
    tipGlow.addColorStop(0, 'rgba(180, 255, 180, 0.95)');
    tipGlow.addColorStop(0.4, 'rgba(60, 255, 100, 0.55)');
    tipGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = tipGlow;
    ctx.beginPath(); ctx.arc(0, -bodyH/2 - noseH*0.7, 14, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }
}

function drawPlayer() {
  if (state.mode === 'over' || state.mode === 'victory') return;

  const bob = Math.sin(state.gameTime * 2.4) * 2.5;
  const px = player.x, py = player.y + bob;
  const tilt = player.bank * 0.5;
  const tier = player.tier;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(tilt);

  if (player.overdrive > 0) {
    const a = 0.35 + Math.sin(state.gameTime * 20) * 0.2;
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 130);
    rg.addColorStop(0, hex2rgba(C.cyan, a * 0.6));
    rg.addColorStop(0.5, hex2rgba(C.blue, a * 0.35));
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0, 0, 130, 0, Math.PI*2); ctx.fill();
  }

  const flameLen = 46 + Math.sin(player.enginePulse) * 12;
  const boostMul = player.overdrive > 0 ? 1.5 : 1.0;
  const engineOffsets = [-11, 11];
  for (const ex of engineOffsets) {
    const eg = ctx.createLinearGradient(ex, 16, ex, 16 + flameLen * boostMul);
    eg.addColorStop(0, hex2rgba(C.white, 1));
    eg.addColorStop(0.15, hex2rgba(C.cyan, 1));
    eg.addColorStop(0.45, hex2rgba(C.blue, 0.85));
    eg.addColorStop(0.75, hex2rgba(C.purple, 0.45));
    eg.addColorStop(1, 'transparent');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.moveTo(ex - 6, 16);
    ctx.quadraticCurveTo(ex - 7, 16 + flameLen * 0.5 * boostMul, ex, 16 + flameLen * boostMul);
    ctx.quadraticCurveTo(ex + 7, 16 + flameLen * 0.5 * boostMul, ex + 6, 16);
    ctx.closePath(); ctx.fill();

    const cg = ctx.createRadialGradient(ex, 16, 0, ex, 16, 8);
    cg.addColorStop(0, 'rgba(255, 255, 255, 1)');
    cg.addColorStop(0.5, 'rgba(200, 240, 255, 0.9)');
    cg.addColorStop(1, 'transparent');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(ex, 16, 8, 0, Math.PI*2); ctx.fill();
  }

  const wingSpan = 58 + (tier - 1) * 14;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 6, -4);
    ctx.lineTo(side * (wingSpan * 0.55), -2);
    ctx.lineTo(side * wingSpan, 14);
    ctx.lineTo(side * (wingSpan * 0.92), 22);
    ctx.lineTo(side * (wingSpan * 0.55), 24);
    ctx.lineTo(side * 8, 16);
    ctx.closePath();

    ctx.strokeStyle = 'rgba(0, 8, 20, 0.98)';
    ctx.lineWidth = 4.5; ctx.stroke();

    const wingGrad = ctx.createLinearGradient(side * wingSpan, -10, side * 8, 22);
    wingGrad.addColorStop(0.00, '#0a1a30');
    wingGrad.addColorStop(0.20, '#1c3a5c');
    wingGrad.addColorStop(0.45, '#2a5a8a');
    wingGrad.addColorStop(0.70, '#1e4266');
    wingGrad.addColorStop(1.00, '#081828');
    ctx.fillStyle = wingGrad; ctx.fill();

    ctx.strokeStyle = hex2rgba(C.cyan, 0.9);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(side * 6, -4);
    ctx.lineTo(side * (wingSpan * 0.55), -2);
    ctx.lineTo(side * wingSpan, 14);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(0, 200, 255, 0.35)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(side * 18, 2);
    ctx.lineTo(side * (wingSpan * 0.85), 16);
    ctx.moveTo(side * 30, 6);
    ctx.lineTo(side * (wingSpan * 0.75), 20);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(side * (wingSpan - 6), 10, 7, 3.5, side * 0.15, 0, Math.PI*2);
    const podGrad = ctx.createLinearGradient(side * wingSpan, 6, side * wingSpan, 14);
    podGrad.addColorStop(0, '#2a3a4a');
    podGrad.addColorStop(0.5, '#6090b0');
    podGrad.addColorStop(1, '#1a2a3a');
    ctx.fillStyle = podGrad; ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.7); ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath();
    ctx.arc(side * (wingSpan - 6), 10, 1.6, 0, Math.PI*2);
    ctx.fillStyle = C.cyan;
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.moveTo(side * 5, -32);
    ctx.lineTo(side * 18, -30);
    ctx.lineTo(side * 14, -22);
    ctx.lineTo(side * 4, -24);
    ctx.closePath();
    const canardGrad = ctx.createLinearGradient(side * 18, -32, side * 4, -22);
    canardGrad.addColorStop(0, '#2a5a8a');
    canardGrad.addColorStop(1, '#0a1a30');
    ctx.fillStyle = canardGrad; ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.6); ctx.lineWidth = 1.2; ctx.stroke();
  }

  const hullW = 12 + (tier - 1) * 1.2;
  const hullH = 52 + (tier - 1) * 2;
  ctx.beginPath();
  ctx.moveTo(0, -hullH);
  ctx.bezierCurveTo(hullW * 0.4, -hullH * 0.7, hullW * 0.85, -hullH * 0.3, hullW, -8);
  ctx.lineTo(hullW + 1, 14);
  ctx.lineTo(hullW * 0.7, 22);
  ctx.lineTo(0, 26);
  ctx.lineTo(-hullW * 0.7, 22);
  ctx.lineTo(-hullW - 1, 14);
  ctx.lineTo(-hullW, -8);
  ctx.bezierCurveTo(-hullW * 0.85, -hullH * 0.3, -hullW * 0.4, -hullH * 0.7, 0, -hullH);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(0, 8, 20, 0.98)';
  ctx.lineWidth = 5.5; ctx.stroke();

  const bodyGrad = ctx.createLinearGradient(0, -hullH, 0, 26);
  bodyGrad.addColorStop(0.00, '#e8f4ff');
  bodyGrad.addColorStop(0.10, '#a8d8ff');
  bodyGrad.addColorStop(0.30, '#4a90c8');
  bodyGrad.addColorStop(0.55, '#1e4a7a');
  bodyGrad.addColorStop(0.80, '#0a2240');
  bodyGrad.addColorStop(1.00, '#030a18');
  ctx.fillStyle = bodyGrad; ctx.fill();

  ctx.strokeStyle = hex2rgba(C.cyan, 1);
  ctx.lineWidth = 2; ctx.stroke();

  ctx.strokeStyle = 'rgba(200, 240, 255, 0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -hullH + 4);
  ctx.lineTo(0, 24);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(0, -30, 8 + (tier - 1) * 0.6, 14, 0, 0, Math.PI*2);
  const canopyGrad = ctx.createRadialGradient(-2, -34, 0, 0, -30, 14);
  canopyGrad.addColorStop(0.00, 'rgba(220, 250, 255, 1)');
  canopyGrad.addColorStop(0.30, 'rgba(90, 180, 240, 0.95)');
  canopyGrad.addColorStop(0.70, 'rgba(30, 90, 160, 0.95)');
  canopyGrad.addColorStop(1.00, 'rgba(10, 30, 60, 0.98)');
  ctx.fillStyle = canopyGrad; ctx.fill();
  ctx.strokeStyle = 'rgba(0, 200, 255, 0.85)';
  ctx.lineWidth = 1.6; ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(-2, -34, 3, 5, -0.3, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, -hullH);
  ctx.lineTo(-4, -hullH + 8);
  ctx.lineTo(4, -hullH + 8);
  ctx.closePath();
  const noseGrad = ctx.createLinearGradient(0, -hullH, 0, -hullH + 8);
  noseGrad.addColorStop(0, C.cyan);
  noseGrad.addColorStop(1, 'rgba(0, 200, 255, 0)');
  ctx.fillStyle = noseGrad; ctx.fill();
  ctx.beginPath();
  ctx.arc(0, -hullH + 3, 2, 0, Math.PI*2);
  ctx.fillStyle = C.white;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 12;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.moveTo(-3, 14);
  ctx.lineTo(-2, -14);
  ctx.lineTo(0, -20);
  ctx.lineTo(2, -14);
  ctx.lineTo(3, 14);
  ctx.closePath();
  const tailGrad = ctx.createLinearGradient(0, -20, 0, 14);
  tailGrad.addColorStop(0, '#4a90c8');
  tailGrad.addColorStop(1, '#0a2240');
  ctx.fillStyle = tailGrad; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 0.75);
  ctx.lineWidth = 1.2; ctx.stroke();

  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 7, 4);
    ctx.lineTo(side * 10, 6);
    ctx.lineTo(side * 10, 16);
    ctx.lineTo(side * 7, 18);
    ctx.closePath();
    ctx.fillStyle = '#050d18';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 200, 255, 0.5)';
    ctx.lineWidth = 0.8; ctx.stroke();
  }

  for (const side of [-1, 1]) {
    const pylonX = side * (wingSpan * 0.55);
    ctx.beginPath();
    ctx.moveTo(pylonX - 3, 14);
    ctx.lineTo(pylonX + 3, 14);
    ctx.lineTo(pylonX + 2, 26);
    ctx.lineTo(pylonX - 2, 26);
    ctx.closePath();
    ctx.fillStyle = '#1a2a3a';
    ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.6);
    ctx.lineWidth = 0.9; ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(pylonX - 1.5, 26);
    ctx.lineTo(pylonX - 1.5, 40);
    ctx.lineTo(pylonX, 44);
    ctx.lineTo(pylonX + 1.5, 40);
    ctx.lineTo(pylonX + 1.5, 26);
    ctx.closePath();
    ctx.fillStyle = '#2a3a4a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(200, 220, 240, 0.6)';
    ctx.lineWidth = 0.8; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pylonX - 1.5, 40);
    ctx.lineTo(pylonX, 44);
    ctx.lineTo(pylonX + 1.5, 40);
    ctx.closePath();
    ctx.fillStyle = '#d02020';
    ctx.fill();
  }

  if (tier > 1) {
    for (let i = 0; i < tier - 1; i++) {
      const dx = (i - (tier - 2) / 2) * 8;
      ctx.beginPath();
      ctx.arc(dx, 22, 1.8, 0, Math.PI*2);
      ctx.fillStyle = C.amber;
      ctx.shadowColor = C.amber; ctx.shadowBlur = 6;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  ctx.restore();

  const threat = state.incomingThreat;
  const shieldActive = state.shield > 0;
  const baseThreat = shieldActive ? Math.max(threat, 0.15) : 0;

  if (baseThreat > 0.05 && shieldActive) {
    const shieldRatio = state.shield / state.maxShield;
    const pulse = 0.5 + Math.sin(player.shieldPhase * 3 + state.gameTime * 6) * 0.25;
    const intensity = baseThreat * (0.7 + pulse * 0.3);
    const radius = 88 + pulse * 4 + (tier - 1) * 4;

    ctx.save();
    ctx.translate(px, py);
    ctx.globalCompositeOperation = 'lighter';

    const sg = ctx.createRadialGradient(0, 0, radius * 0.55, 0, 0, radius);
    sg.addColorStop(0, 'transparent');
    sg.addColorStop(0.6, hex2rgba(C.yellow, 0.15 * intensity));
    sg.addColorStop(0.85, hex2rgba(C.yellow, 0.5 * intensity));
    sg.addColorStop(1, hex2rgba(C.amber, 0.9 * intensity));
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = hex2rgba(C.yellow, 0.95 * intensity);
    ctx.lineWidth = 3.5 + pulse * 1.5;
    ctx.shadowColor = C.yellow;
    ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();

    ctx.shadowBlur = 10;
    ctx.strokeStyle = hex2rgba(C.amber, 0.7 * intensity);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, radius - 8, 0, Math.PI * 2); ctx.stroke();

    ctx.shadowBlur = 0;
    const arcCount = 6;
    for (let i = 0; i < arcCount; i++) {
      const ang = state.gameTime * 3 + i * Math.PI * 2 / arcCount;
      const arcLen = 0.4 + Math.sin(state.gameTime * 8 + i) * 0.15;
      ctx.strokeStyle = hex2rgba(C.yellow, 0.75 * intensity);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, radius, ang, ang + arcLen);
      ctx.stroke();
    }

    ctx.restore();

    ctx.save();
    ctx.translate(px, py);
    ctx.globalAlpha = intensity * 0.35;
    ctx.strokeStyle = hex2rgba(C.yellow, 0.9);
    ctx.lineWidth = 1;
    const hexR = radius * 0.75;
    for (let i = 0; i < 6; i++) {
      const ang1 = (i / 6) * Math.PI * 2 + state.gameTime * 0.5;
      const ang2 = ((i + 1) / 6) * Math.PI * 2 + state.gameTime * 0.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang1) * hexR * 0.3, Math.sin(ang1) * hexR * 0.3);
      ctx.lineTo(Math.cos(ang1) * hexR, Math.sin(ang1) * hexR);
      ctx.lineTo(Math.cos(ang2) * hexR, Math.sin(ang2) * hexR);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (state.shield > 0 && threat < 0.3) {
    const shieldRatio = state.shield / state.maxShield;
    const pulse = 0.5 + Math.sin(player.shieldPhase * 2) * 0.15;
    const radius = 74 + pulse * 4 + (tier - 1) * 6;
    ctx.save();
    ctx.translate(px, py);
    ctx.globalAlpha = shieldRatio * 0.7;
    const sg = ctx.createRadialGradient(0, 0, radius*0.6, 0, 0, radius);
    sg.addColorStop(0, 'transparent');
    sg.addColorStop(0.7, hex2rgba(C.cyan, 0.3 * shieldRatio));
    sg.addColorStop(1, hex2rgba(C.cyan, 0.9 * shieldRatio));
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, shieldRatio * 1);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = shieldRatio * 0.5;
    ctx.strokeStyle = hex2rgba(C.blue, 0.9);
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const ang = player.shieldPhase * 0.5 + i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * 30, Math.sin(ang) * 30);
      ctx.lineTo(Math.cos(ang) * radius, Math.sin(ang) * radius);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (player.invuln > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(state.gameTime * 40) * 0.2;
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(px, py, 88, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function drawBullets() {
  for (const b of bullets) {
    let dirX = b.aimDirX || 0;
    let dirY = b.aimDirY || -1;
    const dd = Math.hypot(dirX, dirY) || 1;
    dirX /= dd; dirY /= dd;
    const angle = Math.atan2(dirY, dirX);

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(angle - Math.PI / 2);

    const glowR = 32;
    const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
    gl.addColorStop(0, 'rgba(120, 200, 255, 0.55)');
    gl.addColorStop(0.5, 'rgba(60, 140, 255, 0.25)');
    gl.addColorStop(1, 'transparent');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, glowR, 0, Math.PI*2); ctx.fill();

    const trailLen = 16;
    const eg = ctx.createLinearGradient(0, 10, 0, 10 + trailLen);
    eg.addColorStop(0, 'rgba(255, 220, 150, 1)');
    eg.addColorStop(0.20, 'rgba(255, 140, 60, 0.95)');
    eg.addColorStop(0.55, 'rgba(220, 60, 40, 0.7)');
    eg.addColorStop(0.85, 'rgba(120, 30, 20, 0.35)');
    eg.addColorStop(1, 'transparent');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.moveTo(-6, 10);
    ctx.quadraticCurveTo(-8, 10 + trailLen * 0.5, 0, 10 + trailLen);
    ctx.quadraticCurveTo(8, 10 + trailLen * 0.5, 6, 10);
    ctx.closePath(); ctx.fill();

    const flick = 0.7 + Math.random() * 0.5;
    const ig = ctx.createLinearGradient(0, 10, 0, 10 + trailLen * 0.6 * flick);
    ig.addColorStop(0, 'rgba(255, 255, 220, 1)');
    ig.addColorStop(0.5, 'rgba(255, 180, 80, 0.85)');
    ig.addColorStop(1, 'transparent');
    ctx.fillStyle = ig;
    ctx.beginPath();
    ctx.moveTo(-3, 10);
    ctx.lineTo(0, 10 + trailLen * 0.6 * flick);
    ctx.lineTo(3, 10);
    ctx.closePath(); ctx.fill();

    const bodyW = 16;
    const bodyH = 14;
    ctx.beginPath();
    ctx.moveTo(-bodyW / 2, -bodyH / 2);
    ctx.lineTo(-bodyW / 2, bodyH / 2 - 3);
    ctx.lineTo(0, bodyH / 2);
    ctx.lineTo(bodyW / 2, bodyH / 2 - 3);
    ctx.lineTo(bodyW / 2, -bodyH / 2);
    ctx.closePath();

    const bodyG = ctx.createLinearGradient(-bodyW, 0, bodyW, 0);
    bodyG.addColorStop(0.00, '#3a4a5a');
    bodyG.addColorStop(0.20, '#8a9aaa');
    bodyG.addColorStop(0.50, '#e8eef4');
    bodyG.addColorStop(0.80, '#8a9aaa');
    bodyG.addColorStop(1.00, '#2a3a4a');
    ctx.fillStyle = bodyG; ctx.fill();
    ctx.strokeStyle = '#1a2530'; ctx.lineWidth = 1.4; ctx.stroke();

    ctx.fillStyle = hex2rgba(C.cyan, 0.95);
    ctx.fillRect(-bodyW / 2, -1.5, bodyW, 3);

    const noseH = 9;
    ctx.beginPath();
    ctx.moveTo(-bodyW / 2, -bodyH / 2);
    ctx.quadraticCurveTo(-bodyW * 0.55, -bodyH / 2 - noseH * 0.45, 0, -bodyH / 2 - noseH);
    ctx.quadraticCurveTo(bodyW * 0.55, -bodyH / 2 - noseH * 0.45, bodyW / 2, -bodyH / 2);
    ctx.closePath();

    const noseG = ctx.createLinearGradient(0, -bodyH / 2 - noseH, 0, -bodyH / 2);
    noseG.addColorStop(0.00, '#ff9090');
    noseG.addColorStop(0.35, '#e82020');
    noseG.addColorStop(0.75, '#a01010');
    noseG.addColorStop(1.00, '#5a0808');
    ctx.fillStyle = noseG; ctx.fill();
    ctx.strokeStyle = '#3a0505'; ctx.lineWidth = 1.3; ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(-3, -bodyH / 2 - noseH * 0.55, 2.5, 3, -0.3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255, 220, 220, 0.9)';
    ctx.fill();

    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * (bodyW / 2 - 0.5), bodyH / 2 - 5);
      ctx.lineTo(side * (bodyW / 2 + 5), bodyH / 2 - 1);
      ctx.lineTo(side * (bodyW / 2 + 4), bodyH / 2 + 1);
      ctx.lineTo(side * (bodyW / 2 - 0.5), bodyH / 2 - 1);
      ctx.closePath();
      const finG = ctx.createLinearGradient(side * bodyW / 2, bodyH / 2 - 5, side * (bodyW / 2 + 5), bodyH / 2 + 1);
      finG.addColorStop(0, '#4a5a6a');
      finG.addColorStop(1, '#1a2a3a');
      ctx.fillStyle = finG; ctx.fill();
      ctx.strokeStyle = '#0a1520'; ctx.lineWidth = 0.9; ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0, bodyH / 2 - 1, 4, 0, Math.PI*2);
    const nozG = ctx.createRadialGradient(0, bodyH / 2 - 1, 0, 0, bodyH / 2 - 1, 5);
    nozG.addColorStop(0, 'rgba(255, 240, 200, 1)');
    nozG.addColorStop(0.5, 'rgba(255, 160, 60, 0.9)');
    nozG.addColorStop(1, 'transparent');
    ctx.fillStyle = nozG;
    ctx.beginPath(); ctx.arc(0, bodyH / 2 - 1, 5, 0, Math.PI*2); ctx.fill();

    const tipGlow = ctx.createRadialGradient(0, -bodyH / 2 - noseH * 0.7, 0, 0, -bodyH / 2 - noseH * 0.7, 14);
    tipGlow.addColorStop(0, 'rgba(255, 120, 120, 0.95)');
    tipGlow.addColorStop(0.4, 'rgba(255, 40, 40, 0.55)');
    tipGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = tipGlow;
    ctx.beginPath(); ctx.arc(0, -bodyH / 2 - noseH * 0.7, 14, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawShockwaves() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const sw of shockwaves) {
    const t = 1 - sw.life / sw.maxLife;
    ctx.globalAlpha = (1 - t) * 0.8;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 4 * (1 - t) + 1;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawDebris() {
  for (const d of debris) {
    const a = Math.max(0, d.life / d.max);
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    for (let i = 0; i < d.points; i++) {
      const ang = (i/d.points)*Math.PI*2;
      const r = d.size * (0.6 + (i%2)*0.4);
      const px = Math.cos(ang)*r, py = Math.sin(ang)*r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawPlaneFragments() {
  for (const f of planeFragments) {
    const a = Math.max(0, f.life / f.max);
    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.globalAlpha = a;
    if (f.isPanel) {
      ctx.fillStyle = f.color;
      ctx.fillRect(-f.panelW / 2, -f.panelH / 2, f.panelW, f.panelH);
    } else {
      ctx.fillStyle = f.color;
      ctx.beginPath();
      for (let i = 0; i < f.points; i++) {
        const ang = (i / f.points) * Math.PI * 2;
        const r = f.size * (0.45 + ((i % 2) ? 0.55 : 0.35));
        const px = Math.cos(ang) * r;
        const py = Math.sin(ang) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPopups() {
  for (const p of popups) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `bold ${fs(p.size, 1.5)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }
}

function drawHUD() {
  const u = uiScale;
  ctx.save();
  const barH = 56 + 40 * u;
  const barGrad = ctx.createLinearGradient(0, 0, 0, barH);
  barGrad.addColorStop(0, 'rgba(5, 15, 40, 0.9)');
  barGrad.addColorStop(1, 'rgba(5, 15, 40, 0)');
  ctx.fillStyle = barGrad;
  ctx.fillRect(0, 0, W, barH);
  const by = 8;
  const bh = 38 * u;
  const bw = 200 * u;
  const px = 18;
  roundRect(ctx, px, by, bw, bh, 10);
  const sg1 = ctx.createLinearGradient(px, by, px, by + bh);
  sg1.addColorStop(0, 'rgba(10, 30, 60, 0.9)');
  sg1.addColorStop(1, 'rgba(4, 12, 30, 0.95)');
  ctx.fillStyle = sg1; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 0.8); ctx.lineWidth = 1.6; ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${fs(11, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.cyan;
  ctx.fillText('◈ SKOR', px + 14, by + bh * 0.32);
  ctx.font = `bold ${fs(20, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText(String(state.score).padStart(6, '0'), px + 14, by + bh * 0.72);

  const cbx = (W - bw) / 2;
  roundRect(ctx, cbx, by, bw, bh, 10);
  const sg2 = ctx.createLinearGradient(cbx, by, cbx, by + bh);
  sg2.addColorStop(0, 'rgba(20, 20, 70, 0.9)');
  sg2.addColorStop(1, 'rgba(8, 8, 35, 0.95)');
  ctx.fillStyle = sg2; ctx.fill();
  ctx.strokeStyle = hex2rgba(C.blue, 0.8); ctx.lineWidth = 1.6; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = `bold ${fs(10, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.blue;
  ctx.fillText('◈ LEVEL / TIER', W/2, by + bh * 0.30);
  ctx.font = `bold ${fs(16, 1.55)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText(`LV ${state.level}/${MAX_LEVEL}  ·  T${player.tier}`, W/2, by + bh * 0.72);

  const segW = 22 * u, segH = 13 * u, gap = 5 * u;
  const totalW = state.maxHp * segW + (state.maxHp - 1) * gap;
  const startX = W - 18 - totalW;
  for (let i = 0; i < state.maxHp; i++) {
    const sx = startX + i * (segW + gap);
    const on = i < state.hp;
    const isCrit = state.hp <= 2;
    roundRect(ctx, sx, by + bh * 0.36, segW, segH, 4);
    if (on) {
      const hg = ctx.createLinearGradient(sx, by, sx, by + bh);
      hg.addColorStop(0, isCrit ? C.pink : C.teal);
      hg.addColorStop(1, isCrit ? '#7a1508' : '#005040');
      ctx.fillStyle = hg;
    } else ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  }

  const shY = by + bh * 0.80;
  roundRect(ctx, startX, shY, totalW, 6 * u, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  if (state.shield > 0) {
    const sr = state.shield / state.maxShield;
    roundRect(ctx, startX, shY, totalW * sr, 6 * u, 3);
    const sg = ctx.createLinearGradient(startX, 0, startX + totalW, 0);
    sg.addColorStop(0, C.cyan); sg.addColorStop(1, C.blue);
    ctx.fillStyle = sg; ctx.fill();
  }

  const cmW = 200 * u, cmH = 10 * u;
  const cmX = (W - cmW) / 2;
  const cmY = by + bh + 6;
  roundRect(ctx, cmX, cmY, cmW, cmH, cmH / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  const cmRatio = state.comboMeter / 100;
  if (cmRatio > 0) {
    roundRect(ctx, cmX, cmY, cmW * cmRatio, cmH, cmH / 2);
    const cg = ctx.createLinearGradient(cmX, 0, cmX + cmW, 0);
    cg.addColorStop(0, C.teal); cg.addColorStop(1, C.cyan);
    ctx.fillStyle = cg; ctx.fill();
  }
  ctx.restore();
}

function drawToast() {
  if (state.toastTimer <= 0) return;
  const a = Math.min(1, state.toastTimer / 0.4);
  ctx.save();
  ctx.globalAlpha = a;
  const cx = W/2, cy = 540;
  const fToast = fs(24, 1.45);
  ctx.font = `bold ${fToast}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const metrics = ctx.measureText(state.toastText);
  const bw = metrics.width + 70;
  const bh = fToast + 32;
  roundRect(ctx, cx - bw/2, cy - bh/2, bw, bh, 12);
  const tg = ctx.createLinearGradient(cx, cy - bh/2, cx, cy + bh/2);
  tg.addColorStop(0, 'rgba(10, 30, 60, 0.95)');
  tg.addColorStop(1, 'rgba(4, 12, 30, 0.95)');
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = state.toastColor; ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = state.toastColor;
  ctx.fillText(state.toastText, cx, cy + 2);
  ctx.restore();
}

/* ═══ IKON VEKTOR UNTUK HALAMAN BERANDA ═══ */
function drawMenuIcon(kind, x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(1.5, r * 0.14);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;

  if (kind === 'level') {
    for (let i = 0; i < 3; i++) {
      const yy = -r * 0.46 + i * r * 0.44;
      ctx.beginPath();
      ctx.moveTo(-r * 0.52, yy);
      ctx.lineTo(0, yy - r * 0.30);
      ctx.lineTo(r * 0.52, yy);
      ctx.stroke();
    }
  } else if (kind === 'quiz') {
    ctx.beginPath();
    ctx.moveTo(-r * 0.38, -r * 0.56);
    ctx.lineTo(r * 0.38, -r * 0.56);
    ctx.lineTo(r * 0.38, r * 0.56);
    ctx.lineTo(-r * 0.38, r * 0.56);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r * 0.20, -r * 0.22); ctx.lineTo(r * 0.20, -r * 0.22);
    ctx.moveTo(-r * 0.20, 0);         ctx.lineTo(r * 0.20, 0);
    ctx.moveTo(-r * 0.20, r * 0.22);  ctx.lineTo(r * 0.06, r * 0.22);
    ctx.stroke();
  } else if (kind === 'shield') {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.60);
    ctx.lineTo(r * 0.50, -r * 0.34);
    ctx.lineTo(r * 0.50, r * 0.08);
    ctx.quadraticCurveTo(r * 0.50, r * 0.50, 0, r * 0.64);
    ctx.quadraticCurveTo(-r * 0.50, r * 0.50, -r * 0.50, r * 0.08);
    ctx.lineTo(-r * 0.50, -r * 0.34);
    ctx.closePath();
    ctx.stroke();
  } else if (kind === 'bolt') {
    ctx.beginPath();
    ctx.moveTo(r * 0.16, -r * 0.62);
    ctx.lineTo(-r * 0.36, r * 0.08);
    ctx.lineTo(-r * 0.02, r * 0.08);
    ctx.lineTo(-r * 0.16, r * 0.62);
    ctx.lineTo(r * 0.36, -r * 0.08);
    ctx.lineTo(r * 0.02, -r * 0.08);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* ═══ HALAMAN BERANDA (LANDING PAGE) ═══ */
function drawMenu() {
  const mu = Math.min(uiScale, 1.4);
  const cx = W / 2;
  const t  = state.gameTime;

  ctx.save();

  /* ── 1. BACKDROP ── */
  const bgGrad = ctx.createRadialGradient(cx, H * 0.38, 60, cx, H * 0.55, H * 1.20);
  bgGrad.addColorStop(0.00, 'rgba(6, 30, 66, 0.72)');
  bgGrad.addColorStop(0.50, 'rgba(3, 15, 36, 0.82)');
  bgGrad.addColorStop(1.00, 'rgba(1, 4, 12, 0.92)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  /* grid halus */
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = C.cyan;
  ctx.lineWidth = 1;
  const gs = 64;
  const gx0 = ((cx % gs) + gs) % gs;
  ctx.beginPath();
  for (let x = gx0; x < W + gs; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H + gs; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.restore();

  /* ── 2. BADGE ATAS ── */
  const badgeText = '◈  KUIS SEJARAH INTERAKTIF  ·  MATERI SMA  ◈';
  ctx.font = `bold ${Math.round(13 * mu)}px system-ui, sans-serif`;
  const bw = ctx.measureText(badgeText).width + 46;
  const bh = 30, bx = cx - bw / 2, by = 24;
  roundRect(ctx, bx, by, bw, bh, bh / 2);
  ctx.fillStyle = 'rgba(0, 200, 255, 0.08)';
  ctx.fill();
  ctx.strokeStyle = hex2rgba(C.cyan, 0.45);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = hex2rgba(C.cyan, 0.95);
  ctx.fillText(badgeText, cx, by + bh / 2 + 1);

  /* ── 3. GLOW DI BELAKANG JUDUL ── */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const tGlow = ctx.createRadialGradient(cx, 108, 0, cx, 108, W * 0.42);
  tGlow.addColorStop(0, hex2rgba(C.cyan, 0.16));
  tGlow.addColorStop(0.55, hex2rgba(C.blue, 0.07));
  tGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = tGlow;
  ctx.fillRect(0, 0, W, 230);
  ctx.restore();

  /* ── 4. JUDUL ── */
  const titleSize = Math.min(Math.round(74 * Math.min(mu, 1.12)), W * 0.066);
  ctx.font = `900 ${titleSize}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tg = ctx.createLinearGradient(cx - W * 0.35, 0, cx + W * 0.35, 0);
  tg.addColorStop(0.00, '#00d0ff');
  tg.addColorStop(0.28, '#bff2ff');
  tg.addColorStop(0.50, '#ffffff');
  tg.addColorStop(0.74, '#7fc4ff');
  tg.addColorStop(1.00, '#9b8cff');
  ctx.fillStyle = tg;
  ctx.shadowColor = hex2rgba(C.cyan, 0.55);
  ctx.shadowBlur = 26;
  ctx.fillText('ASAL USUL MANUSIA', cx, 104);
  ctx.shadowBlur = 0;

  /* subjudul */
  ctx.font = `600 ${Math.round(15 * mu)}px system-ui, sans-serif`;
  ctx.fillStyle = hex2rgba(C.white, 0.72);
  ctx.fillText('Petualangan sejarah dari Big Bang hingga peradaban awal manusia', cx, 156);

  /* ── 5. PEMBATAS ── */
  const dvY = 182, dvW = Math.min(W * 0.62, 760);
  const dvG = ctx.createLinearGradient(cx - dvW / 2, 0, cx + dvW / 2, 0);
  dvG.addColorStop(0.00, 'transparent');
  dvG.addColorStop(0.50, hex2rgba(C.cyan, 0.55));
  dvG.addColorStop(1.00, 'transparent');
  ctx.strokeStyle = dvG;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx - dvW / 2, dvY);
  ctx.lineTo(cx + dvW / 2, dvY);
  ctx.stroke();
  ctx.fillStyle = C.cyan;
  ctx.save();
  ctx.translate(cx, dvY);
  ctx.rotate(Math.PI / 4);
  ctx.shadowColor = C.cyan;
  ctx.shadowBlur = 12;
  ctx.fillRect(-4, -4, 8, 8);
  ctx.restore();

  /* ── 6. KARTU FITUR ── */
  const cards = [
    { icon: 'level',  title: '10 LEVEL',  desc: 'Big Bang → peradaban awal' },
    { icon: 'quiz',   title: '40 SOAL',   desc: '4 pilihan ganda tiap level' },
    { icon: 'shield', title: '5 ENERGI',  desc: 'Plus perisai penyerap' },
    { icon: 'bolt',   title: 'COMBO',     desc: 'Streak & mode overdrive' },
  ];
  const cGap  = Math.max(10, W * 0.012);
  const cAllW = Math.min(W * 0.90, 1240);
  const cardW = (cAllW - cGap * 3) / 4;
  const cardH = 100;
  const cardY = 200;
  const cardX0 = cx - cAllW / 2;

  cards.forEach((c, i) => {
    const x = cardX0 + i * (cardW + cGap);

    roundRect(ctx, x, cardY, cardW, cardH, 12);
    const cg = ctx.createLinearGradient(x, cardY, x, cardY + cardH);
    cg.addColorStop(0, 'rgba(10, 34, 70, 0.85)');
    cg.addColorStop(1, 'rgba(4, 14, 34, 0.92)');
    ctx.fillStyle = cg;
    ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.35);
    ctx.lineWidth = 1.4;
    ctx.stroke();

    /* garis aksen atas */
    const ag = ctx.createLinearGradient(x, 0, x + cardW, 0);
    ag.addColorStop(0.00, 'transparent');
    ag.addColorStop(0.50, hex2rgba(C.cyan, 0.85));
    ag.addColorStop(1.00, 'transparent');
    ctx.strokeStyle = ag;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 12, cardY + 1);
    ctx.lineTo(x + cardW - 12, cardY + 1);
    ctx.stroke();

    /* ikon */
    const iconR = 15;
    const iconX = x + 34;
    const iconY = cardY + cardH / 2;
    ctx.beginPath();
    ctx.arc(iconX, iconY, iconR + 7, 0, Math.PI * 2);
    ctx.fillStyle = hex2rgba(C.cyan, 0.10);
    ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.50);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    drawMenuIcon(c.icon, iconX, iconY, iconR, C.cyan);

    /* teks */
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(15 * mu)}px system-ui, sans-serif`;
    ctx.fillStyle = C.white;
    ctx.fillText(c.title, x + 66, cardY + 38);

    const dfont = `${Math.round(11.5 * mu)}px system-ui, sans-serif`;
    const dlines = wrapText(c.desc, cardW - 80, dfont);
    ctx.font = dfont;
    ctx.fillStyle = hex2rgba(C.white, 0.58);
    const dlh = Math.round(14 * mu);
    dlines.slice(0, 2).forEach((ln, k) => {
      ctx.fillText(ln, x + 66, cardY + 62 + k * dlh);
    });
  });

  /* ── 7. JUDUL SEKSI: CARA BERMAIN ── */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${Math.round(12 * mu)}px system-ui, sans-serif`;
  ctx.fillStyle = hex2rgba(C.cyan, 0.85);
  ctx.fillText('—   C A R A   B E R M A I N   —', cx, 334);

  /* ── 8. LANGKAH BERMAIN ── */
  const steps = [
    { n: '1', title: 'BACA SOAL',       desc: 'Pertanyaan tampil di panel atas layar.' },
    { n: '2', title: 'TEMBAK JAWABAN',  desc: 'Ketuk pesawat yang membawa jawaban benar.' },
    { n: '3', title: 'JAGA ENERGI',     desc: 'Salah 2× atau waktu habis = soal gagal.' },
  ];
  const sGap  = Math.max(12, W * 0.014);
  const sAllW = Math.min(W * 0.90, 1240);
  const stepW = (sAllW - sGap * 2) / 3;
  const stepH = 84;
  const stepY = 356;
  const stepX0 = cx - sAllW / 2;

  steps.forEach((s, i) => {
    const x = stepX0 + i * (stepW + sGap);

    roundRect(ctx, x, stepY, stepW, stepH, 12);
    const sg = ctx.createLinearGradient(x, stepY, x, stepY + stepH);
    sg.addColorStop(0, 'rgba(8, 26, 58, 0.80)');
    sg.addColorStop(1, 'rgba(3, 11, 28, 0.88)');
    ctx.fillStyle = sg;
    ctx.fill();
    ctx.strokeStyle = hex2rgba(C.blue, 0.32);
    ctx.lineWidth = 1.3;
    ctx.stroke();

    /* badge nomor */
    const nx = x + 36, ny = stepY + stepH / 2;
    ctx.beginPath();
    ctx.arc(nx, ny, 17, 0, Math.PI * 2);
    const ng = ctx.createLinearGradient(nx - 17, ny - 17, nx + 17, ny + 17);
    ng.addColorStop(0, hex2rgba(C.cyan, 0.35));
    ng.addColorStop(1, hex2rgba(C.blue, 0.25));
    ctx.fillStyle = ng;
    ctx.fill();
    ctx.strokeStyle = hex2rgba(C.cyan, 0.80);
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.font = `bold ${Math.round(17 * mu)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.white;
    ctx.shadowColor = C.cyan;
    ctx.shadowBlur = 10;
    ctx.fillText(s.n, nx, ny + 1);
    ctx.shadowBlur = 0;

    /* teks langkah */
    ctx.textAlign = 'left';
    ctx.font = `bold ${Math.round(14 * mu)}px system-ui, sans-serif`;
    ctx.fillStyle = C.white;
    ctx.fillText(s.title, x + 66, stepY + 32);

    const dfont = `${Math.round(11.5 * mu)}px system-ui, sans-serif`;
    const dlines = wrapText(s.desc, stepW - 84, dfont);
    ctx.font = dfont;
    ctx.fillStyle = hex2rgba(C.white, 0.58);
    const dlh = Math.round(14 * mu);
    dlines.slice(0, 2).forEach((ln, k) => {
      ctx.fillText(ln, x + 66, stepY + 54 + k * dlh);
    });
  });

  /* ── 9. TOMBOL MULAI ── */
  const pulse = 0.5 + Math.sin(t * 3) * 0.5;
  const btnW = Math.min(560, W * 0.46);
  const btnH = 70;
  const btnX = cx - btnW / 2;
  const btnY = 490;

  ctx.save();
  ctx.shadowColor = hex2rgba(C.cyan, 0.55 + pulse * 0.35);
  ctx.shadowBlur = 24 + pulse * 18;
  roundRect(ctx, btnX, btnY, btnW, btnH, 16);
  const bgi = ctx.createLinearGradient(btnX, btnY, btnX + btnW, btnY + btnH);
  bgi.addColorStop(0.00, 'rgba(0, 190, 255, 0.30)');
  bgi.addColorStop(0.50, 'rgba(60, 120, 255, 0.45)');
  bgi.addColorStop(1.00, 'rgba(120, 90, 255, 0.30)');
  ctx.fillStyle = bgi;
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = hex2rgba(C.cyan, 0.95);
  ctx.lineWidth = 2.6;
  roundRect(ctx, btnX, btnY, btnW, btnH, 16);
  ctx.stroke();

  /* kilau menyapu */
  ctx.save();
  roundRect(ctx, btnX, btnY, btnW, btnH, 16);
  ctx.clip();
  const sweepX = btnX - btnW * 0.6 + ((t * 260) % (btnW * 2.2));
  const shG = ctx.createLinearGradient(sweepX, 0, sweepX + btnW * 0.45, 0);
  shG.addColorStop(0.0, 'rgba(255,255,255,0)');
  shG.addColorStop(0.5, 'rgba(255,255,255,0.22)');
  shG.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = shG;
  ctx.fillRect(btnX, btnY, btnW, btnH);
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${Math.round(24 * mu)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.shadowColor = hex2rgba(C.cyan, 0.9);
  ctx.shadowBlur = 14;
  ctx.fillText('▶  MULAI PETUALANGAN', cx, btnY + btnH / 2 + 1);
  ctx.shadowBlur = 0;

  /* ── 10. BAR TIPS ── */
  const tipText = 'Jawab cepat = bonus waktu   ·   2× salah = soal gagal   ·   Combo penuh → OVERDRIVE';
  ctx.font = `600 ${Math.round(12.5 * mu)}px system-ui, sans-serif`;
  const tipW = Math.min(ctx.measureText(tipText).width + 56, W * 0.94);
  const tipH = 34, tipY = 594;
  roundRect(ctx, cx - tipW / 2, tipY, tipW, tipH, tipH / 2);
  ctx.fillStyle = 'rgba(255, 176, 64, 0.08)';
  ctx.fill();
  ctx.strokeStyle = hex2rgba(C.amber, 0.38);
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = hex2rgba(C.amber, 0.92);
  ctx.fillText(tipText, cx, tipY + tipH / 2 + 1);

  /* ── 11. FOOTER ── */
  ctx.font = `${Math.round(11 * mu)}px system-ui, sans-serif`;
  ctx.fillStyle = hex2rgba(C.white, 0.35);
  ctx.fillText('40 soal pilihan ganda  ·  10 level  ·  Big History & Peradaban Awal', cx, 662);

  ctx.restore();
}

function drawGameOver() {
  const mu = Math.min(uiScale, 1.4);
  ctx.save();
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, H);
  bgGrad.addColorStop(0, 'rgba(50, 5, 30, 0.9)');
  bgGrad.addColorStop(1, 'rgba(8, 0, 12, 0.96)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${Math.round(62 * Math.min(mu, 1.12))}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText('MISI GAGAL', W/2, 138);

  const blink = 0.7 + Math.sin(state.gameTime * 4) * 0.3;
  ctx.globalAlpha = blink;
  const btnW = Math.min(620, W * 0.50), btnH = 62;
  const btnX = (W - btnW) / 2, btnY = 570;
  roundRect(ctx, btnX, btnY, btnW, btnH, 14);
  ctx.fillStyle = hex2rgba(C.cyan, 0.3); ctx.fill();
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 2.8; ctx.stroke();
  ctx.font = `bold ${Math.round(22 * mu)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText('▶  COBA LAGI  ◀', W/2, btnY + btnH / 2);
  ctx.restore();
}

function drawVictory() {
  const mu = Math.min(uiScale, 1.4);
  ctx.save();
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, H);
  bgGrad.addColorStop(0, 'rgba(5, 45, 40, 0.9)');
  bgGrad.addColorStop(1, 'rgba(0, 12, 10, 0.96)');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${Math.round(62 * Math.min(mu, 1.12))}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText('MISI SUKSES', W/2, 138);

  const blink = 0.7 + Math.sin(state.gameTime * 4) * 0.3;
  ctx.globalAlpha = blink;
  const btnW = Math.min(620, W * 0.50), btnH = 62;
  const btnX = (W - btnW) / 2, btnY = 570;
  roundRect(ctx, btnX, btnY, btnW, btnH, 14);
  ctx.fillStyle = hex2rgba(C.teal, 0.3); ctx.fill();
  ctx.strokeStyle = C.teal; ctx.lineWidth = 2.8; ctx.stroke();
  ctx.font = `bold ${Math.round(22 * mu)}px system-ui, sans-serif`;
  ctx.fillStyle = C.white;
  ctx.fillText('▶  MAIN LAGI  ◀', W/2, btnY + btnH / 2);
  ctx.restore();
}

function render() {
  ctx.setTransform(baseScale, 0, 0, baseScale, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (state.shake > 0) ctx.translate((Math.random()-0.5) * state.shake, (Math.random()-0.5) * state.shake);
  drawBackground();

  if (state.mode === 'playing' || state.mode === 'over' || state.mode === 'victory') {
    drawEngineTrails();
    drawSmokePuffs();
    drawQShip();
    drawQShipDebris();
    for (const e of enemies) drawEnemyPanel(e);
    for (const e of enemies) drawEnemyShip(e);
    drawLockOnEffects();
    drawBullets();
    drawEnemyBullets();
    drawShockwaves();
    drawDebris();
    drawPlaneFragments();
    drawParticles();
    drawHeatDistortions();
    drawCorrectMark();
    drawPlayer();
    drawPopups();
    if (state.mode === 'playing') {
      drawQuestionPanel();
      drawHUD();
      drawToast();
    }
  }
  ctx.restore();

  if (state.flashRed > 0) { ctx.fillStyle = hex2rgba(C.pink, state.flashRed*0.3); ctx.fillRect(0,0,W,H); }
  if (state.flashGreen > 0) { ctx.fillStyle = hex2rgba(C.teal, state.flashGreen*0.2); ctx.fillRect(0,0,W,H); }
  if (state.flashBlue > 0) { ctx.fillStyle = hex2rgba(C.cyan, state.flashBlue*0.25); ctx.fillRect(0,0,W,H); }

  const vg = ctx.createRadialGradient(W/2, H/2, H*0.4, W/2, H/2, H*0.95);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (state.mode === 'menu') drawMenu();
  if (state.mode === 'over') drawGameOver();
  if (state.mode === 'victory') drawVictory();
}

let lastTs = 0;
function loop(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  if (document.body.classList.contains('portrait-locked')) { requestAnimationFrame(loop); return; }
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function canvasCoords(clientX, clientY) {
  const r = cvs.getBoundingClientRect();
  return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
}

function handleStart() {
  initAudio();
  if (state.mode === 'menu' || state.mode === 'over' || state.mode === 'victory') {
    resetGame();
    tone(520, 0.1, 'triangle', 0.055, 880);
    tone(780, 0.14, 'triangle', 0.055, 1200, 0.1);
    tone(1040, 0.18, 'sine', 0.045, 1560, 0.22);
  }
}

cvs.addEventListener('pointerdown', (evt) => {
  evt.preventDefault();
  initAudio();
  if (state.mode !== 'playing') { handleStart(); return; }
  if (state.locked || !state.roundActive) return;
  const { x, y } = canvasCoords(evt.clientX, evt.clientY);
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.alive || e.dying > 0 || e.launching || e.fleeing) continue;
    const shipR = 85;
    const inShip = x >= e.x - shipR && x <= e.x + shipR && y >= e.y - shipR && y <= e.y + shipR;
    const panelCY = e.y + PANEL_BELOW_GAP;
    const inPanel = x >= e.x - PANEL_W / 2 - 26 && x <= e.x + PANEL_W / 2 + 26
                 && y >= panelCY - PANEL_H / 2 - 22 && y <= panelCY + PANEL_H / 2 + 22;
    if (inShip || inPanel) { fire(i); return; }
  }
}, { passive: false });

cvs.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (evt) => {
  initAudio();
  if (evt.code === 'Space' || evt.code === 'Enter') {
    evt.preventDefault();
    if (state.mode !== 'playing') handleStart();
  }
});

window.addEventListener('blur', () => { lastTs = 0; });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

/* ═══ BOOT ═══ */
state.gameTime = 0;
requestAnimationFrame(() => {
  resize();
  requestAnimationFrame(loop);
});
setTimeout(resize, 150);
setTimeout(resize, 500);

</script>
</body>
